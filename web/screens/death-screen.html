<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="DeathScreen">
  <!-- Without an input mode no situation is active here and neither the mouse nor
       gamepad nav produce events, so the two buttons could not be pressed at all. -->
  <meta name="tsic-input-mode" content="InputMode.Menu.Generic">
  <!-- Death is not something Esc backs out of; the buttons are the only way off. -->
  <meta name="tsic-cancel-cmd" content="">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>You died</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/reduce-motion.js" defer></script>
  <script src="/shared/store-maze.js" defer></script>
  <script src="/shared/store-maze-stage.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    .tsic-death-subtitle {
      margin: 0;
      font-family: var(--font-terminal);
      font-size: 14px;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head><body>
  <div class="tsic-stage--magazine-gradient">
    <div class="tsic-panel tsic-cover" style="--tsic-cover-width: 420px;">
      <div class="tsic-masthead" style="flex-direction: column; align-items: center; gap: 8px;">
        <div class="tsic-masthead-title" style="text-align: center;">
          You Died.
        </div>
        <p class="tsic-death-subtitle" id="death-cause">The Store has taken you. Your loved one remains lost.</p>
      </div>
      <div class="tsic-cover-rows" data-tsic-focus-group="nav">
        <button class="tsic-row-button" id="btn-respawn" data-tsic-initial-focus>
          <span class="tsic-row-dept">Dept. 01</span>
          Respawn
          <span class="tsic-row-pg">PG. 01</span>
        </button>
        <button class="tsic-row-button" id="btn-menu">
          <span class="tsic-row-dept">Fire Exit</span>
          Quit to Menu
          <span class="tsic-row-pg">END</span>
        </button>
      </div>
    </div>
  </div>
  <script>
    // Inline scripts run during HTML parse, BEFORE the deferred tsic-*.js
    // load — poll until the runtime exists (see main-menu.html).
    (function boot() {
      if (!window.tsic || typeof tsic.bootMenu !== 'function') { setTimeout(boot, 16); return; }
      tsic.whenReady(() => tsic.bootMenu(function () {
        // The respawn is server-authoritative and held until this button is pressed —
        // URespawnControllerComponent carries it across. Pause.Resume used to sit here,
        // which only ever pushed the SPA back to the HUD and left the corpse standing.
        tsic.onClick('#btn-respawn', () => tsic.publishMessage('UI.Cmd.Death.Respawn', {}));
        tsic.onClick('#btn-menu',    () => tsic.publishMessage('UI.Cmd.Pause.QuitToMenu', {}));

        // Non-transient channel, so this arrives from the cache replay after the
        // navigation rather than needing to beat it.
        tsic.on('tsic.msg.UI.DeathScreen.Shown', (p) => {
          const cause = document.getElementById('death-cause');
          if (cause && p && p.DeathMessage) cause.textContent = p.DeathMessage;
        });
      }, { escape: false, closeButton: false }));
    })();
  </script>
</body></html>
