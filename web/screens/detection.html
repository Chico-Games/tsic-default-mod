<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Detection">
  <title>Detection</title>
  <link rel="stylesheet" href="/shared/base.css">
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/router.js" defer></script>
  <!-- Thin fixture: the wedges render via the live shared component, the same one the
       combined in-game HUD loads (shared/hud-detection.js). This page used to carry its
       own copy of the renderer, which is why the feature never appeared in game — the
       HUD mounts shared/hud-*.js and nothing loads screens/*.html at runtime. -->
  <script src="/shared/hud-detection.js" defer></script>
  <style>
    /* Transparent overlay — sits over the 3D scene, never captures focus. */
    html, body { background: transparent; pointer-events: none; overflow: hidden; margin: 0; }
  </style>
</head><body>
  <div id="hud-detection"></div>
</body></html>
