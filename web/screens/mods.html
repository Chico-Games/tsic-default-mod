<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Mods">
  <meta name="tsic-input-mode" content="InputMode.Menu.MainMenu">
  <meta name="tsic-cancel-cmd" content="UI.Cmd.Menu.Back">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>Mods</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/reduce-motion.js" defer></script>
  <script src="/shared/store-maze.js" defer></script>
  <script src="/shared/store-maze-stage.js" defer></script>
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <script src="/shared/tab-filter.js" defer></script>
  <script type="module" src="/screens/mods.js"></script>
  <style>
    /* ---- Cover fills the viewport (stage has 32px padding all round) ---- */
    .mods-cover { height: min(calc(100vh - 64px), 1100px); }
    .mods-cover .tsic-masthead { padding: 14px 22px 4px; }
    .mods-cover .tsic-masthead-title { font-size: 40px; }
    .mods-cover .tsic-masthead-title em { font-size: 18px; margin-top: 0; }

    .mods-body {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; gap: 10px;
      padding: 4px 22px 8px;
    }
    .mods-body .panel {
      border: 2px solid var(--ink-night);
      background: var(--paper-bright);
    }
    .error { color: var(--mag-red); font-size: 12px; }

    @keyframes fade-in    { from { opacity: 0; } }
    @keyframes fade-slide { from { opacity: 0; transform: translateY(-4px); } }

    /* ================= DISCOVERY (condensed strip) ================= */
    .disco { flex: none; padding: 8px 12px; }
    .disco-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 8px; min-height: 30px;
    }
    .disco-title {
      font-family: var(--font-display); font-weight: 800; font-size: 13px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft);
      white-space: nowrap;
    }
    .disco-title .disco-sub { color: var(--mag-red); margin-left: 6px; }

    .auth-state { display: flex; align-items: center; gap: 8px; animation: fade-slide 0.25s ease both; }
    .auth-note { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
    .auth-note a { color: var(--mag-red); text-decoration: underline; }
    .auth-note a:hover { color: var(--mag-red-dark); }
    .auth-note b { color: var(--ink-night); }

    .disco input[type=email], .disco input[type=text] {
      background: var(--paper-bright); border: 1px solid var(--ink-night);
      color: var(--ink-night); padding: 5px 10px; font: inherit; font-size: 13px;
    }
    .code-input { width: 96px; letter-spacing: 6px; text-align: center; text-transform: uppercase; }

    .btn-solid, .btn-ghost {
      border: 1px solid var(--ink-night); padding: 5px 12px; cursor: pointer;
      font: inherit; font-family: var(--font-display); font-size: 12px;
      letter-spacing: 0.08em; text-transform: uppercase;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-solid { background: var(--ink-night); color: var(--paper-cream); }
    .btn-solid:hover { background: var(--mag-red); border-color: var(--mag-red); }
    .btn-ghost { background: transparent; color: var(--ink-night); }
    .btn-ghost:hover { background: var(--mag-yellow); }

    .disco-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #search { flex: 1; min-width: 0; }
    #btn-filters .caret { display: inline-block; transition: transform 0.25s ease; }
    #btn-filters.open .caret { transform: rotate(180deg); }

    /* Collapsible tag tray — animates open/closed via grid rows. */
    .tag-tray { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s ease; }
    .tag-tray.open { grid-template-rows: 1fr; margin-bottom: 8px; }
    .tag-tray-inner {
      overflow: hidden; min-height: 0;
      display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center;
    }
    .tag-group-label { color: var(--ink-mute); font-size: 11px; }
    .tag-chip {
      padding: 2px 8px; border: 1px solid var(--ink-mute); background: var(--paper-soft);
      color: var(--ink-night); font: inherit; font-size: 11px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .tag-chip:hover { border-color: var(--ink-night); }
    .tag-chip.on { background: var(--mag-red); border-color: var(--mag-red); color: var(--paper-bright); }

    /* Horizontal card rail. */
    .disco-rail-wrap { display: flex; gap: 8px; align-items: stretch; }
    .disco-rail {
      flex: 1; min-width: 0;
      display: grid; grid-auto-flow: column; grid-auto-columns: 180px;
      gap: 8px; overflow-x: auto; overflow-y: hidden;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }
    .disco-rail:empty { min-height: 40px; }
    @keyframes card-in { from { opacity: 0; transform: translateY(10px); } }
    .card {
      border: 1px solid var(--ink-night); background: var(--paper-soft);
      padding: 6px; display: flex; flex-direction: column; gap: 5px;
      animation: card-in 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    .card .logo {
      width: 100%; aspect-ratio: 16 / 9; background-color: var(--ink-night);
      background-size: cover; background-position: center;
    }
    .card .name {
      font-family: var(--font-display); font-weight: 800; font-size: 12px;
      letter-spacing: 0.04em; color: var(--ink-night);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card .summary { font-size: 10px; line-height: 1.35; color: var(--ink-soft); height: 27px; overflow: hidden; }
    .card-sub {
      margin-top: auto; padding: 3px 8px; font-size: 11px;
      background: var(--ink-night); border: 1px solid var(--ink-night); color: var(--paper-cream);
      cursor: pointer; font-family: var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
      transition: background 0.15s, border-color 0.15s;
    }
    .card-sub:hover { background: var(--mag-red); border-color: var(--mag-red); }
    .card-sub:disabled { color: var(--ink-mute); background: var(--paper-soft); border-color: var(--ink-mute); cursor: default; }
    .card-sub.is-sub { background: var(--mag-red); border-color: var(--mag-red); }
    #btn-loadmore {
      flex: none; width: 32px; writing-mode: vertical-rl;
      background: var(--paper-soft); border: 1px solid var(--ink-night); color: var(--ink-night);
      font-family: var(--font-display); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    #btn-loadmore:hover { background: var(--ink-night); color: var(--paper-cream); }

    /* ================= LIBRARY (two columns) ================= */
    .library {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .lib-col {
      display: flex; flex-direction: column; min-height: 0;
      border: 2px solid var(--ink-night); background: var(--paper-bright);
    }
    .lib-head {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-bottom: 2px solid var(--ink-night);
      background: var(--paper-soft);
    }
    .lib-title {
      font-family: var(--font-display); font-weight: 800; font-size: 14px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-night);
    }
    .lib-sub { font-size: 10px; color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase; }
    .lib-count {
      margin-left: auto; min-width: 22px; height: 20px; padding: 0 5px;
      display: grid; place-items: center;
      background: var(--ink-night); color: var(--paper-cream);
      font-family: var(--font-display); font-size: 11px; font-weight: 800;
      transition: transform 0.2s ease;
    }
    .lib-col--active .lib-head { background: var(--ink-night); }
    .lib-col--active .lib-title { color: var(--paper-cream); }
    .lib-col--active .lib-sub { color: rgba(241, 229, 207, 0.65); }
    .lib-col--active .lib-count { background: var(--mag-red); }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .lib-status {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(241, 229, 207, 0.8); animation: pulse 1.2s ease-in-out infinite;
    }
    #btn-update-all {
      padding: 2px 8px; font-size: 10px;
      background: transparent; border: 1px solid rgba(241, 229, 207, 0.5); color: var(--paper-cream);
      cursor: pointer; font-family: var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
      transition: background 0.15s, border-color 0.15s;
    }
    #btn-update-all:hover { background: var(--mag-red); border-color: var(--mag-red); }

    .lib-list {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
      padding: 8px; display: flex; flex-direction: column; gap: 6px;
      scrollbar-gutter: stable; scrollbar-width: thin;
    }
    .lib-empty {
      color: var(--ink-mute); font-size: 12px; letter-spacing: 0.06em;
      text-align: center; padding: 16px 10px; animation: fade-in 0.3s ease;
    }

    .lib-row {
      position: relative; flex: none;
      display: flex; align-items: center; gap: 7px;
      padding: 6px 8px;
      background: var(--paper-soft); border: 1px solid var(--ink-night);
      will-change: transform;
    }
    .lib-row.is-flying { z-index: 6; box-shadow: var(--shadow-block-sm); }
    @keyframes row-enter { from { opacity: 0; transform: translateY(6px) scale(0.98); } }
    .lib-row.row-enter { animation: row-enter 0.3s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .lib-row.row-exit { transition: opacity 0.22s ease, transform 0.22s ease; opacity: 0; transform: translateX(-14px) scale(0.98); pointer-events: none; }
    .lib-col--active .lib-row.row-exit { transform: translateX(14px) scale(0.98); }

    .lib-row .name {
      flex: 1; min-width: 0; font-size: 13px; color: var(--ink-night);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lib-row .ver { color: var(--ink-mute); font-size: 11px; margin-left: 6px; }
    .ord {
      flex: none; width: 22px; height: 22px; display: grid; place-items: center;
      background: var(--ink-night); color: var(--paper-cream);
      font-family: var(--font-display); font-size: 11px; font-weight: 800;
    }
    .lock { flex: none; width: 26px; text-align: center; font-size: 13px; color: var(--ink-soft); }

    .btn-move, .btn-step {
      flex: none; width: 26px; height: 26px; padding: 0;
      display: grid; place-items: center;
      background: var(--paper-bright); border: 1px solid var(--ink-night); color: var(--ink-night);
      font-size: 14px; line-height: 1; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.12s;
    }
    .btn-move:hover { background: var(--mag-red); border-color: var(--mag-red); color: var(--paper-bright); }
    .btn-move--right:hover { transform: translateX(2px); }
    .btn-move--left:hover { transform: translateX(-2px); }
    .btn-step:hover { background: var(--mag-yellow); }
    .btn-move:disabled, .btn-step:disabled { opacity: 0.35; pointer-events: none; }

    .btn-update, .btn-uninstall {
      flex: none; padding: 3px 8px; font-size: 10px; cursor: pointer;
      font-family: var(--font-display); letter-spacing: 0.06em; text-transform: uppercase;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-update { background: var(--ink-night); border: 1px solid var(--ink-night); color: var(--paper-cream); }
    .btn-update:hover { background: var(--mag-red); border-color: var(--mag-red); }
    .btn-update:disabled { opacity: 0.5; pointer-events: none; }
    .btn-uninstall { background: transparent; border: 1px solid var(--ink-mute); color: var(--ink-soft); }
    .btn-uninstall:hover { border-color: var(--mag-red); color: var(--mag-red); }
    .btn-uninstall:disabled { opacity: 0.35; pointer-events: none; }

    /* Download bars — the standard striped magazine bar (.tsic-bar-fill
       recipe: red fill, 45° ink stripes) with the stripes marching while a
       download is live. One stripe period at 45° = 10px × √2 ≈ 14.14px.
       Determinate fill when the file size is known, full-width otherwise. */
    @keyframes dl-march { to { background-position: 14.14px 0; } }
    .dl-fill, .card-dl-fill {
      height: 100%; width: 0%;
      background-color: var(--mag-red);
      background-image: repeating-linear-gradient(45deg,
        transparent, transparent 5px,
        rgba(0, 0, 0, 0.18) 5px, rgba(0, 0, 0, 0.18) 10px);
      animation: dl-march 0.45s linear infinite;
      transition: width 0.2s linear;
    }
    .dl-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; display: none; overflow: hidden; background: var(--paper-muted); }
    .lib-row.is-downloading { border-color: var(--mag-red); }
    .lib-row.is-downloading .dl-bar { display: block; }

    .card-dl { height: 8px; border: 1px solid var(--ink-night); background: var(--paper-muted); overflow: hidden; }
    .card.is-installing { border-color: var(--mag-red); }
    /* After .card-sub:disabled so the busy state wins: the muted disabled
       grey is unreadable over the paper while installing. */
    .card-sub.is-busy {
      background: var(--mag-red); border-color: var(--mag-red);
      color: var(--paper-bright); cursor: default;
    }

    @keyframes flash-ok { 0% { background-color: rgba(70, 140, 70, 0.4); } }
    .lib-row.flash-ok, .card.flash-ok { animation: flash-ok 0.9s ease; }
    @keyframes flash-fail {
      0%, 100% { transform: translateX(0); background-color: rgba(180, 30, 30, 0.3); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .lib-row.flash-fail, .card.flash-fail { animation: flash-fail 0.45s ease; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head><body>
  <div class="tsic-stage--magazine-gradient">
    <div class="tsic-panel tsic-cover mods-cover" style="--tsic-cover-width: 1500px;">
      <div class="tsic-masthead">
        <div class="tsic-masthead-title">
          <em>Special</em>
          Catalogues.
        </div>
        <div class="tsic-masthead-meta">
          <span class="tsic-masthead-issue">Dept. 33</span>
          <span class="tsic-masthead-date">A little something extra.</span>
        </div>
      </div>

      <div class="mods-body">

        <div id="mods-tabs" class="tsic-tab-bar" data-tsic-tab-bar></div>
        <div class="error" id="tab-launch-msg" style="display:none;"></div>

        <section class="panel disco" id="panel-discovery" data-tsic-focus-group="discovery">
          <div class="disco-head">
            <div class="disco-title">Mail-Order Catalogue <span class="disco-sub">mod.io</span></div>
            <div class="disco-auth">
              <div class="auth-state" id="auth-signed-out" style="display:none;">
                <span class="auth-note">Sign in to subscribe —
                  <a href="https://mod.io/join" target="_blank" rel="noopener">create a free account</a></span>
                <input id="email" type="email" placeholder="you@example.com">
                <button id="btn-request" class="btn-solid">Send code</button>
              </div>
              <div class="auth-state" id="auth-awaiting-code" style="display:none;">
                <span class="auth-note">Code sent — check your inbox (and spam)</span>
                <input id="code" type="text" class="code-input" placeholder="A1B2C" maxlength="5">
                <button id="btn-exchange" class="btn-solid">Sign in</button>
                <button id="btn-cancel-code" class="btn-ghost">Cancel</button>
              </div>
              <div class="auth-state" id="auth-signed-in" style="display:none;">
                <span class="auth-note"><b id="username"></b></span>
                <button id="btn-signout" class="btn-ghost">Sign out</button>
              </div>
              <div class="auth-state" id="auth-disabled" style="display:none;">
                <span class="auth-note">mod.io is not configured for this project.</span>
              </div>
            </div>
          </div>

          <div class="disco-controls">
            <input id="search" type="text" placeholder="Search the catalogue…">
            <!-- tsic-dropdown, not a native <select>: CEF's native select popup renders
                 through a Slate menu that misplaces/flips under accelerated paint. -->
            <button id="sort" type="button" class="tsic-dropdown" data-tsic-focusable
                    data-tsic-value="popular"
                    data-tsic-options='[
                      {"value":"popular","label":"Popular"},
                      {"value":"-date_added","label":"Recently Added"},
                      {"value":"-downloads_total","label":"Most Downloaded"},
                      {"value":"-subscribers_total","label":"Most Subscribed"},
                      {"value":"-ratings_weighted_aggregate","label":"Top Rated"}]'>
              <span class="tsic-dropdown-label">Popular</span>
              <span class="tsic-dropdown-caret">▾</span>
            </button>
            <button id="btn-filters" type="button" class="btn-ghost">Filters <span class="caret">▾</span></button>
          </div>
          <div class="tag-tray" id="tag-tray">
            <div class="tag-tray-inner" id="tag-chips"></div>
          </div>

          <div class="disco-rail-wrap">
            <div class="disco-rail" id="browse"></div>
            <button id="btn-loadmore" style="display:none;">More</button>
          </div>

          <div class="error" id="auth-error" style="display:none;"></div>
          <div class="error" id="install-error" style="display:none;"></div>
        </section>

        <section class="library">
          <div class="lib-col" id="col-inactive">
            <div class="lib-head">
              <span class="lib-title">Stockroom</span>
              <span class="lib-sub">Installed · not active</span>
              <span class="lib-count" id="count-inactive">0</span>
            </div>
            <div class="lib-list" id="list-inactive" data-tsic-focus-group="stockroom"></div>
          </div>
          <div class="lib-col lib-col--active" id="col-active">
            <div class="lib-head">
              <span class="lib-title">Shop Floor</span>
              <span class="lib-sub">Active · loads top to bottom</span>
              <span class="lib-status" id="lib-status" style="display:none;">Checking…</span>
              <button id="btn-update-all" type="button" style="display:none;">Update All</button>
              <span class="lib-count" id="count-active">0</span>
            </div>
            <div class="lib-list" id="list-active" data-tsic-focus-group="shopfloor"></div>
          </div>
        </section>

      </div><!-- /mods-body -->

      <div class="tsic-cover-rows" data-tsic-focus-group="actions">
        <button class="tsic-row-button" id="btn-back" data-tsic-initial-focus>
          <span class="tsic-row-dept">Fire Exit</span>
          Back to Main
          <span class="tsic-row-pg">PG. 01</span>
        </button>
      </div>
    </div>
  </div>
</body></html>
