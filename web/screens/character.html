<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Character">
  <meta name="tsic-input-mode" content="InputMode.Menu.MainMenu">
  <meta name="tsic-cancel-cmd" content="UI.Cmd.Menu.Back">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>Customise Character</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/reduce-motion.js" defer></script>
  <!-- No store-maze here. This screen is full-bleed — the rail and the doll's
       stage cover the backdrop edge to edge — so the drifting plan would animate
       a canvas nobody can see, and it costs about ten milliseconds a frame to do
       it. Every other menu page still loads it. -->
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/dom.js" defer></script>
  <script src="/shared/icons.js" defer></script>
  <style>
    /* Full-bleed: the doll is the screen, not a thumbnail beside a list. */
    html, body { height: 100%; overflow: hidden; }

    .cast-screen {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(320px, 26vw) 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "head  stage"
        "slots stage"
        "foot  stage";
      gap: 0;
    }

    /* The animated maze stage sits behind the whole page; the rail needs its own
       opaque paper or the tile names read through it. */
    .cast-head, .cast-slots, .cast-foot { background: var(--paper); }

    /* --- masthead --- */
    .cast-head {
      grid-area: head;
      padding: 20px 24px 14px;
      border-bottom: 2px solid var(--ink-night);
    }
    .cast-title {
      font-family: var(--font-display);
      font-size: clamp(30px, 3.4vw, 52px);
      line-height: 0.9;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: var(--ink-night);
      margin: 0;
    }
    .cast-title em {
      display: block;
      font-family: var(--font-hand);
      font-style: normal;
      font-size: 0.42em;
      text-transform: none;
      letter-spacing: 0.02em;
      color: var(--mag-red);
    }
    .cast-lede {
      font-family: var(--font-body);
      font-size: 12px;
      line-height: 1.45;
      color: var(--ink-mute);
      letter-spacing: 0.02em;
      margin: 8px 0 0;
    }

    /* --- slot rail --- */
    .cast-slots {
      grid-area: slots;
      overflow-y: auto;
      padding: 12px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .cast-empty {
      padding: 14px 4px;
      font-family: var(--font-terminal);
      font-size: 14px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--ink-mute);
      font-style: italic;
    }
    .cast-slot-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-night);
      border-bottom: 1px solid var(--ink-night);
      padding-bottom: 3px;
      margin-bottom: 8px;
    }
    .cast-slot-worn {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: none;
      color: var(--mag-red);
    }
    /* --- sub-menu buttons --- */
    .cast-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cast-menu-btn {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      background: var(--paper-soft);
      border: 1px solid var(--ink-night);
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
    }
    .cast-menu-btn:hover,
    .cast-menu-btn[data-tsic-focused] {
      background: var(--paper-bright);
      outline: 2px solid var(--ink-night);
      outline-offset: -3px;
    }
    .cast-menu-btn-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-night);
    }
    .cast-menu-btn-worn {
      font-family: var(--font-body);
      font-size: 11px;
      letter-spacing: 0.03em;
      color: var(--mag-red);
      text-align: right;
    }
    .cast-back {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 2px 10px;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--ink-night);
      margin-bottom: 4px;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-night);
      width: 100%;
      text-align: left;
    }
    .cast-back:hover,
    .cast-back[data-tsic-focused] { color: var(--mag-red); }

    /* --- colour swatches --- */
    .cast-swatches {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
      gap: 5px;
      margin-bottom: 14px;
    }
    .cast-swatch {
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid var(--ink-night);
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .cast-swatch:hover,
    .cast-swatch[data-tsic-focused] { outline: 2px solid var(--ink-night); outline-offset: 1px; }
    .cast-swatch.is-chosen { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--mag-red); }
    /* The match-hair swatch has no colour of its own to show, so it says so. */
    .cast-swatch--match {
      background: var(--paper-soft);
      font-family: var(--font-terminal);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-mute);
      line-height: 1.05;
    }
    /* A rainbow ring around the colour last mixed: the ring says "any colour", the
       middle says which one, so the square reads like the rest of the row. */
    .cast-swatch--wheel {
      background:
        radial-gradient(circle, var(--tint, transparent) 0 40%, transparent 41%),
        conic-gradient(#e34a3a, #e0c23a, #4fbf5a, #3fb7c8, #4a63d8, #a94ad0, #e34a3a);
    }

    /* Tiles, not rows: a face is picked by looking at it. Falls back to a name
       plate until the parts carry thumbnails. */
    .cast-tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 6px;
    }
    .cast-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 0;
      background: var(--paper-soft);
      border: 1px solid var(--ink-night);
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      font: inherit;
      color: inherit;
    }
    .cast-tile:hover,
    .cast-tile[data-tsic-focused] {
      background: var(--paper-bright);
      outline: 2px solid var(--ink-night);
      outline-offset: -3px;
    }
    /* The worn tile keeps the masthead red so the choice survives losing focus. */
    .cast-tile.is-chosen {
      background: var(--paper-bright);
      border-color: var(--mag-red);
      box-shadow: inset 0 0 0 2px var(--mag-red);
    }
    .cast-tile-art {
      height: 78px;
      background: var(--paper-muted);
      border-bottom: 1px solid var(--ink-night);
      object-fit: cover;
      width: 100%;
      display: block;
    }
    .cast-tile-name {
      padding: 4px 6px 5px;
      font-family: var(--font-body);
      font-size: 11px;
      line-height: 1.25;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .cast-tile.is-chosen .cast-tile-name { font-weight: 700; color: var(--ink-night); }

    /* --- footer --- */
    .cast-foot {
      grid-area: foot;
      padding: 0 18px 18px;
    }

    /* --- stage --- */
    /*
      Deliberately transparent, and it is not an oversight.

      The doll is not in this document. It is the preview render target, drawn by
      Slate UNDERNEATH the whole web view, and this element is the hole we leave for
      it -- see UI.Cmd.View.SetLiveLayer below. Anything painted here, including a
      background, would cover it: nothing in the page can sit behind a live layer.

      So the stage's backdrop belongs to the 3D scene now, not to CSS. Everything
      else on this screen still draws over the doll as normal, which is the way
      round that matters.
    */
    .cast-stage {
      grid-area: stage;
      position: relative;
      border-left: 2px solid var(--ink-night);
      background: transparent;
      overflow: hidden;
      cursor: ew-resize;
      user-select: none;
    }
    .cast-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      text-align: center;
      font-family: var(--font-terminal);
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-mute);
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .cast-screen {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto auto;
        grid-template-areas: "head" "stage" "slots" "foot";
      }
      .cast-stage { border-left: 0; border-bottom: 2px solid var(--ink-night); }
      .cast-slots { max-height: 34vh; }
    }
  </style>
</head>
<!--
  No stage class on <body>, unlike every other menu screen.

  The magazine stage paints the whole viewport, and the doll is drawn by Slate
  BENEATH this page -- so a full-screen background is a lid on it. The rail down
  the left already paints its own opaque paper (see .cast-head/.cast-slots/
  .cast-foot), which is what the stage was there for; the rest of the screen is
  meant to be the scene now.
-->
<body>
  <div class="cast-screen">
    <div class="cast-head">
      <h1 class="cast-title"><em>Customise</em>Character.</h1>
      <p class="cast-lede">
        Who you turn up as. Travels with you into any store, including someone else's.
      </p>
    </div>

    <div class="cast-slots" id="cast-slots" data-tsic-focus-group="cast"></div>

    <div class="cast-foot" data-tsic-focus-group="actions">
      <button class="tsic-row-button" id="btn-back">
        <span class="tsic-row-dept">Fire Exit</span>
        Back to Main
        <span class="tsic-row-pg">PG. 01</span>
      </button>
    </div>

    <div class="cast-stage" id="cast-stage">
      <div class="cast-hint">Drag to turn</div>
    </div>
  </div>

  <script>
    // Inline scripts run during HTML parse, BEFORE the deferred tsic-*.js
    // load — poll until the runtime exists (see main-menu.html).
    (function boot() {
      if (!window.tsic || typeof tsic.bootMenu !== 'function' || !window.TSIC || !TSIC.el) {
        setTimeout(boot, 16); return;
      }
      tsic.whenReady(() => tsic.bootMenu(function () {
        const host = document.getElementById('cast-slots');
        const stage = document.getElementById('cast-stage');

        // ---- live 3D preview -------------------------------------------------
        //
        // The doll used to be an <img> fed PNGs at 15fps. Every one of those frames
        // cost a blocking GPU->CPU readback on the game thread, a copy, a PNG
        // encode, an HTTP round trip and a Chromium decode -- for a picture the GPU
        // already had, and still only fifteen of them a second.
        //
        // Now it is a Slate layer beneath the page and we only tell C++ where to put
        // it. It draws at the renderer's own rate and costs nothing to move.
        //
        // Fractions of the viewport, not pixels: CEF renders at the viewport DPI
        // scale and its buffer is painted back through a centring transform, so a
        // pixel rectangle would be wrong on both counts, and wrong again after a
        // resize.
        function publishStageRect(visible) {
          const r = stage.getBoundingClientRect();
          const w = window.innerWidth || 1;
          const h = window.innerHeight || 1;
          tsic.publishMessage('UI.Cmd.View.SetLiveLayer', {
            Id: 'character-preview',
            MinX: r.left / w,
            MinY: r.top / h,
            MaxX: r.right / w,
            MaxY: r.bottom / h,
            bVisible: !!visible,
          });
        }

        // ResizeObserver rather than a window resize listener: the stage is a grid
        // area, so it also moves when the panel beside it changes width, which no
        // window event reports.
        const stageObserver = new ResizeObserver(() => publishStageRect(true));
        stageObserver.observe(stage);
        publishStageRect(true);

        // Hand the rectangle back on the way out, or the doll keeps drawing over
        // whatever screen comes next.
        window.addEventListener('pagehide', () => {
          stageObserver.disconnect();
          publishStageRect(false);
        });

        // ---- turntable -------------------------------------------------------
        let yaw = 0;
        let dragging = false;
        let lastX = 0;
        let pending = null;

        function pushYaw() {
          pending = null;
          tsic.publishMessage('UI.Cmd.Menu.RotateCharacter', { Yaw: yaw });
        }

        // One publish per frame at most. A pointermove burst would otherwise
        // queue dozens of rotations the capture cannot keep up with, and the
        // doll would keep spinning after the pointer stopped.
        function requestYaw() {
          if (pending !== null) return;
          pending = requestAnimationFrame(pushYaw);
        }

        stage.addEventListener('pointerdown', (e) => {
          dragging = true;
          lastX = e.clientX;
          stage.setPointerCapture(e.pointerId);
        });
        stage.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          // Half a degree per pixel: a comfortable drag across the stage is
          // rather more than one full turn.
          yaw = (yaw + (e.clientX - lastX) * 0.5) % 360;
          lastX = e.clientX;
          requestYaw();
        });
        function endDrag(e) {
          if (!dragging) return;
          dragging = false;
          try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);

        // ---- slot rail -------------------------------------------------------
        // C++ re-broadcasts after every accepted change, so the screen always
        // paints what was actually stored rather than an optimistic guess.
        //
        // Rebuilding the DOM on every broadcast is what made the old screen
        // change selection on its own: the new rows took focus, focus activated
        // one, that published another pick, which re-broadcast. So the panel is
        // built once per signature and only the chosen marks are patched
        // afterwards. Opening a sub-menu changes the signature deliberately.
        let signature = null;
        let openGroup = null;   // null == the top level
        let lastSlots = [];

        function slotSignature(slots) {
          return String(openGroup) + '#' + slots.map((s) => String(s.Slot) + ':' +
            (s.Parts || []).map((p) => String(p.Id) + '@' + String(p.ThumbnailUrl || ''))
              .join(',')).join('|');
        }

        // A slot with no group is shown at the top level; the rest are folded into
        // the button that opens their panel.
        const groupOf = (slot) => String(slot.Group || '');

        function wornName(slot) {
          const chosen = String(slot.SelectedId || '');
          for (const part of (slot.Parts || [])) {
            if (String(part.Id || '') === chosen) return String(part.DisplayName || chosen);
          }
          return '';
        }

        function markChosen(slots) {
          const worn = new Map();

          for (const slot of slots) {
            const chosen = String(slot.SelectedId || '');
            const section = host.querySelector('[data-slot="' + CSS.escape(String(slot.Slot)) + '"]');
            if (section) {
              for (const tile of section.querySelectorAll('.cast-tile, .cast-swatch')) {
                tile.classList.toggle('is-chosen', tile.dataset.partId === chosen);
              }

              // Painted here rather than folded into the rebuild signature, because
              // the picker is open and under the cursor while this fires -- rebuilding
              // the row mid-drag would tear the popup off its own button.
              const wheel = section.querySelector('.cast-swatch--wheel');
              if (wheel && slot.Tint) {
                wheel.style.setProperty('--tint', String(slot.Tint));
                wheel.querySelector('.cast-wheel-input').value = String(slot.Tint);
              }
            }

            // A colour row is a second view of a slot already counted, so leave it
            // out of the summary or clothing reads as four garments.
            const group = groupOf(slot);
            if (!group || slot.bIsColor) continue;
            const name = wornName(slot);
            if (name) worn.set(group, (worn.get(group) || []).concat(name));
          }

          // The closed buttons carry what is worn inside them, so the top level
          // still answers "what am I wearing" without opening anything.
          for (const [group, names] of worn) {
            const button = host.querySelector(
              '[data-group-worn="' + CSS.escape(group) + '"]');
            if (button) button.textContent = names.join(' \u00b7 ');
          }
        }

        const pickPart = (slotKey, id) => tsic.publishMessage(
          'UI.Cmd.Menu.SelectCharacterPart', { Slot: slotKey, Id: id });

        // Panels where the decision is made above the collar get the camera in
        // close; the rest keep the whole figure, because a coat is not judged from
        // the chin up. C++ glides between the two, so this is a plain toggle.
        const CLOSE_UP_GROUPS = new Set(['Face', 'Hair', 'FacialHair']);

        function frameFor(group) {
          tsic.publishMessage('UI.Cmd.Menu.FrameCharacter',
            { bCloseUp: CLOSE_UP_GROUPS.has(String(group || '')) });
        }

        function openPanelFor(group) {
          openGroup = group;
          frameFor(group);
          render({ Slots: lastSlots });
        }

        function buildTiles(slot) {
          const slotKey = String(slot.Slot || '');
          const tiles = TSIC.el('div', { class: 'cast-tiles' });
          for (const part of (slot.Parts || [])) {
            const id = String(part.Id || '');
            const name = String(part.DisplayName || id);
            // No name plate: the picture is the label. The name stays as the
            // tooltip and as the worn line on the button that opens this panel.
            const tile = TSIC.el('button', {
              class: 'cast-tile',
              type: 'button',
              title: name,
              'data-part-id': id,
              'data-part-name': name,
              'data-tsic-focusable': '',
              tabindex: '-1',
            });
            tile.appendChild(part.ThumbnailUrl
              ? TSIC.el('img', { class: 'cast-tile-art', src: String(part.ThumbnailUrl), alt: name })
              : TSIC.el('span', { class: 'cast-tile-name' }, name));
            tile.onclick = () => pickPart(slotKey, id);
            tiles.appendChild(tile);
          }
          return tiles;
        }

        const setTint = (slotKey, hex) => tsic.publishMessage(
          'UI.Cmd.Menu.SetCharacterTint', { Slot: slotKey, Hex: hex });

        // The wheel is the last square in the row rather than a control off to one
        // side: it answers the same question as the swatches, so it sits with the
        // other answers. Chromium gives us a real colour picker for free.
        function buildWheel(slot, part) {
          const slotKey = String(slot.Slot || '');
          const button = TSIC.el('button', {
            class: 'cast-swatch cast-swatch--wheel',
            type: 'button',
            title: String(part.DisplayName || 'Pick your own'),
            'data-part-id': String(part.Id || ''),
            'data-tsic-focusable': '',
            tabindex: '-1',
          });

          // Hidden rather than restyled: an <input type="color"> cannot be made to
          // look like the other squares, but it can be made to do their job. It
          // carries the tint so reopening it starts where the player left off.
          const input = TSIC.el('input', {
            type: 'color', class: 'cast-wheel-input', value: String(slot.Tint || '#7a472d'),
          });
          input.hidden = true;
          input.oninput = () => setTint(slotKey, input.value);
          button.appendChild(input);
          button.onclick = () => input.click();
          return button;
        }

        function buildSwatches(slot) {
          const slotKey = String(slot.Slot || '');
          const row = TSIC.el('div', { class: 'cast-swatches' });
          for (const part of (slot.Parts || [])) {
            const id = String(part.Id || '');
            const name = String(part.DisplayName || id);
            const swatch = String(part.Swatch || '');
            if (swatch === 'wheel') {
              row.appendChild(buildWheel(slot, part));
              continue;
            }

            const isMatch = swatch === 'match';
            const button = TSIC.el('button', {
              class: 'cast-swatch' + (isMatch ? ' cast-swatch--match' : ''),
              type: 'button',
              title: name,
              'data-part-id': id,
              'data-tsic-focusable': '',
              tabindex: '-1',
            });
            if (isMatch) button.textContent = 'Match';
            else button.style.background = swatch;
            button.onclick = () => pickPart(slotKey, id);
            row.appendChild(button);
          }
          return row;
        }

        function buildPanel(slots) {
          const group = openGroup;
          const inGroup = slots.filter((s) => groupOf(s) === group);
          const label = inGroup.length ? String(inGroup[0].GroupName || group) : group;

          const back = TSIC.el('button', {
            class: 'cast-back',
            type: 'button',
            'data-tsic-focusable': '',
            tabindex: '-1',
          }, '\u2039 ' + label);
          back.onclick = () => openPanelFor(null);
          host.appendChild(back);

          const garments = inGroup.filter((s) => !s.bIsColor);
          const addColors = (slot) => host.appendChild(TSIC.el(
            'section', { 'data-slot': String(slot.Slot || '') }, buildSwatches(slot)));

          // A colour row whose garment is not on this panel is still a colour worth
          // offering -- better shown loose at the top than silently dropped.
          for (const slot of inGroup) {
            if (!slot.bIsColor) continue;
            const owner = String(slot.ColorFor || '');
            if (!garments.some((g) => String(g.Slot || '') === owner)) addColors(slot);
          }

          for (const slot of garments) {
            const key = String(slot.Slot || '');

            // Name the rows only where a panel holds more than one of them: a top
            // and a bottom need telling apart, a lone list of haircuts does not.
            if (garments.length > 1) {
              host.appendChild(TSIC.el('div', { class: 'cast-slot-label' },
                TSIC.el('span', {}, String(slot.DisplayName || key))));
            }

            // Colours above the shapes they paint: the smaller decision reads first,
            // and sitting directly over its own tiles is what says which is which.
            for (const colors of inGroup) {
              if (colors.bIsColor && String(colors.ColorFor || '') === key) addColors(colors);
            }
            host.appendChild(TSIC.el('section', { 'data-slot': key }, buildTiles(slot)));
          }
        }

        function buildTopLevel(slots) {
          // Ungrouped slots stay open. Build is two tiles, and hiding two tiles
          // behind a button costs a click to show what a glance already showed.
          for (const slot of slots.filter((s) => !groupOf(s))) {
            const section = TSIC.el('section', { 'data-slot': String(slot.Slot || '') });
            section.appendChild(TSIC.el('div', { class: 'cast-slot-label' },
              TSIC.el('span', {}, String(slot.DisplayName || slot.Slot))));
            section.appendChild(buildTiles(slot));
            host.appendChild(section);
          }

          const menu = TSIC.el('div', { class: 'cast-menu' });
          const seen = new Set();
          for (const slot of slots) {
            const group = groupOf(slot);
            if (!group || seen.has(group)) continue;
            seen.add(group);

            const button = TSIC.el('button', {
              class: 'cast-menu-btn',
              type: 'button',
              'data-tsic-focusable': '',
              tabindex: '-1',
            });
            button.appendChild(TSIC.el('span', { class: 'cast-menu-btn-name' },
              String(slot.GroupName || group)));
            button.appendChild(TSIC.el('span', {
              class: 'cast-menu-btn-worn',
              'data-group-worn': group,
            }));
            button.onclick = () => openPanelFor(group);
            menu.appendChild(button);
          }
          host.appendChild(menu);
        }

        function build(slots) {
          host.replaceChildren();
          if (slots.length === 0) {
            host.appendChild(TSIC.el('div', { class: 'cast-empty' },
              'No uniform on file. The mod ships no character parts.'));
            return;
          }
          if (openGroup) buildPanel(slots);
          else buildTopLevel(slots);
        }

        function render(payload) {
          const slots = (payload && payload.Slots) || [];
          lastSlots = slots;
          const next = slotSignature(slots);
          if (next !== signature) {
            signature = next;
            build(slots);
          }
          markChosen(slots);
        }

        tsic.on('tsic.msg.UI.Menu.Characters', render);

        tsic.onClick('#btn-back', () =>
          tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: 'MainMenu' }));
      }));
    })();
  </script>
</body></html>
