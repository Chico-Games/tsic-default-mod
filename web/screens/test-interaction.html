<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="TestInteraction">
  <meta name="tsic-debug" content="true">
  <title>Test: interaction prompt</title>
  <!-- Test-only host for the LIVE interaction prompt
       (shared/hud-interaction.js). In production hud.js creates the
       #bb-shell-gameplay shell (shared with the behavior bar) and injects its
       styles; here we provide the minimal shell so the component can be
       exercised in isolation.

       DO NOT add rendering logic to this file. The prompt is rendered by
       shared/hud-interaction.js — this page only hosts it. -->
  <style>
    /* Mirror the visibility rules hud.js injects, so getComputedStyle()-based
       hidden/visible assertions work. */
    #bb-target.hidden { display:none; }
    #bb-target-name.hidden { display:none; }
    #bb-divider.hidden { display:none; }
    #interaction-prompt.hidden { display:none; }
    #bb-target-name .cat-icon, #interaction-prompt .cat-icon { display:inline-block; width:13px; height:13px; margin-right:6px; vertical-align:-2px; }
    #bb-target-name .cat-icon svg, #interaction-prompt .cat-icon svg { width:100%; height:100%; display:block; }
    #interaction-prompt.cat-crafting { color:#f0cd8a; }
    #interaction-prompt.cat-production { color:#9fd4f0; }
    #interaction-prompt.cat-plantable { color:#a9e2a0; }
    #interaction-prompt.cat-storage { color:#d9c9f2; }
  </style>
  <!-- Bridge first: components subscribe on window.tsic at defer time; the
       playground migrates those subs into its mock on iframe load. -->
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/dom.js" defer></script>
  <script src="/shared/icons.js" defer></script>
  <script src="/shared/hud-interaction.js" defer></script>
</head><body>
  <div id="bb-shell-gameplay" class="bb-shell">
    <div id="bb-target" class="hidden">
      <div id="bb-target-name" class="hidden"></div>
      <div id="interaction-prompt" class="hidden"></div>
    </div>
    <div id="bb-divider" class="hidden"></div>
    <div id="bb-gameplay"></div>
  </div>
</body></html>
