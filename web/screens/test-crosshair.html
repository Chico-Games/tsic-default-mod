<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="TestCrosshair">
  <meta name="tsic-debug" content="true">
  <title>Test: crosshair</title>
  <!-- Test-only host for the LIVE crosshair components
       (shared/hud-crosshair.js + shared/hud-circular-progress.js). In
       production hud.js creates the #hud-crosshair dot and
       #hud-circular-progress ring and injects their styles; here we provide
       the minimal shell so the components can be exercised in isolation. Also
       subscribes to tsic.msg.UI.Interaction.Targets { bDraggable, bDragging }
       for the drag affordance ring and tsic.msg.UI.CircularProgress.State for
       the charge/progress ring.

       DO NOT add rendering logic to this file. Rendering is driven by the
       shared components — this page only hosts them. -->
  <style>
    /* Mirror the rules hud.js injects, so getComputedStyle()-based
       hidden/visible assertions work. */
    #hud-crosshair { position:fixed; left:50%; top:50%; margin-left:-2px; margin-top:-2px; width:4px; height:4px; background:#fff; border-radius:50%; pointer-events:none; z-index:20; transition:box-shadow 120ms ease, transform 120ms ease; }
    @keyframes hud-ch-halo { 0%,100% { box-shadow:0 0 0 2px rgba(255,255,255,0); } 50% { box-shadow:0 0 0 var(--ch-halo,4px) rgba(255,255,255,var(--ch-halo-a,0.28)); } }
    #hud-crosshair[data-cat] { animation:hud-ch-halo var(--ch-t,2.2s) ease-in-out infinite; }
    #hud-crosshair.dragging { transform:scale(1.4); box-shadow:0 0 0 3px rgba(255,255,255,0.65); animation:none; }
    #hud-crosshair.hidden { display:none; }
    #hud-crosshair-hand { position:fixed; left:calc(50% + 10px); top:50%; margin-top:-9px; width:18px; height:18px; color:#fff; opacity:0; pointer-events:none; z-index:20; transition:opacity 120ms ease, transform 120ms ease; }
    #hud-crosshair-hand.visible { opacity:0.55; }
    #hud-crosshair-hand.dragging { opacity:0.8; transform:scale(0.9); }
    #hud-crosshair-hand.hidden { display:none; }
    #hud-crosshair-hand svg { width:100%; height:100%; display:block; }
    #hud-circular-progress { display:none; position:fixed; left:50%; top:50%; width:56px; height:56px; margin-left:-28px; margin-top:-28px; border-radius:50%; background:conic-gradient(var(--cp-color,#fff) calc(var(--cp-p,0) * 1%), rgba(241,229,207,0.35) 0); mask:radial-gradient(circle, transparent 23px, #000 24px); -webkit-mask:radial-gradient(circle, transparent 23px, #000 24px); pointer-events:none; z-index:20; }
    #hud-circular-progress.active { display:block; }
  </style>
  <!-- Bridge first: components subscribe on window.tsic at defer time; the
       playground migrates those subs into its mock on iframe load. -->
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/dom.js" defer></script>
  <script src="/shared/hud-crosshair.js" defer></script>
  <script src="/shared/hud-circular-progress.js" defer></script>
</head><body>
  <div id="hud-crosshair"></div>
  <div id="hud-circular-progress"></div>
</body></html>
