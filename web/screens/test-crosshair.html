<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="TestCrosshair">
  <meta name="tsic-debug" content="true">
  <title>Test: crosshair</title>
  <!-- Test-only host for the LIVE crosshair components
       (shared/hud-crosshair.js + shared/hud-circular-progress.js). In
       production hud.js creates the #hud-crosshair dot and
       #hud-circular-progress ring and injects their styles; here we provide
       the minimal shell so the components can be exercised in isolation. Also
       subscribes to tsic.msg.UI.Interaction.Targets { bDraggable, bDragging }
       for the drag affordance ring and tsic.msg.UI.CircularProgress.State for
       the charge/progress ring.

       DO NOT add rendering logic to this file. Rendering is driven by the
       shared components — this page only hosts them. -->
  <style>
    /* Mirror the rules hud.js injects, so getComputedStyle()-based
       hidden/visible assertions work. */
    #hud-crosshair { position:fixed; left:50%; top:50%; margin-left:-2px; margin-top:-2px; width:4px; height:4px; background:#fff; border-radius:50%; pointer-events:none; z-index:20; transition:box-shadow 120ms ease, transform 120ms ease; }
    @keyframes hud-ch-halo { 0%,100% { box-shadow:0 0 0 2px rgba(255,255,255,0); } 50% { box-shadow:0 0 0 var(--ch-halo,4px) rgba(255,255,255,var(--ch-halo-a,0.28)); } }
    #hud-crosshair[data-cat] { animation:hud-ch-halo var(--ch-t,2.2s) ease-in-out infinite; }
    #hud-crosshair.dragging { transform:scale(1.4); box-shadow:0 0 0 3px rgba(255,255,255,0.65); animation:none; }
    #hud-crosshair.hidden { display:none; }
    #hud-crosshair-hand { position:fixed; left:calc(50% + 10px); top:50%; margin-top:-9px; width:18px; height:18px; color:#fff; opacity:0; pointer-events:none; z-index:20; transition:opacity 120ms ease, transform 120ms ease; }
    #hud-crosshair-hand.visible { opacity:0.55; }
    #hud-crosshair-hand.dragging { opacity:0.8; transform:scale(0.9); }
    #hud-crosshair-hand.hidden { display:none; }
    #hud-crosshair-hand svg { width:100%; height:100%; display:block; }
    #hud-crosshair-cat { position:fixed; left:calc(50% + 10px); top:50%; margin-top:-8px; width:16px; height:16px; color:#fff; opacity:0; pointer-events:none; z-index:20; transition:opacity 120ms ease; }
    #hud-crosshair-cat.visible { opacity:0.7; }
    #hud-crosshair-cat.hidden { display:none; }
    #hud-crosshair-cat svg { width:100%; height:100%; display:block; }
    /* Panel ring — absolute + opacity-gated, NOT display-gated, so showing it
       never reflows the action panel. hud-circular-progress.js re-parents it onto
       the running action's key chip, so the fixture also hosts a minimal panel
       shell (below) with the two interaction rows and their chips. */
    #bb-shell-gameplay { position:fixed; bottom:18px; right:24px; min-width:240px; padding:8px 12px; }
    #interaction-prompt, #interaction-hold-prompt { display:flex; justify-content:flex-end; align-items:center; gap:6px; }
    #interaction-prompt.hidden, #interaction-hold-prompt.hidden { display:none; }
    .bb-key { position:relative; display:inline-flex; align-items:center; justify-content:center; min-width:29px; height:29px; overflow:hidden; }
    .bb-key.cp-host { overflow:visible; }
    #hud-circular-progress { position:absolute; left:50%; top:50%; width:37px; height:37px; margin:-18.5px 0 0 -18.5px; border-radius:50%; background:conic-gradient(var(--cp-color,#fff) calc(var(--cp-p,0) * 1%), rgba(241,229,207,0.30) 0); mask:radial-gradient(circle, transparent 16px, #000 17px); -webkit-mask:radial-gradient(circle, transparent 16px, #000 17px); pointer-events:none; opacity:0; transform:scale(0.8); }
    #hud-circular-progress.active { opacity:1; transform:scale(1); }
    #hud-circular-progress.parked { left:auto; top:auto; right:9px; bottom:-15px; margin:0; width:26px; height:26px; mask:radial-gradient(circle, transparent 9px, #000 10px); -webkit-mask:radial-gradient(circle, transparent 9px, #000 10px); }
    /* Crosshair collar + completion bloom. */
    #hud-crosshair-progress { position:fixed; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:conic-gradient(var(--cp-color,#fff) calc(var(--cp-p,0) * 1%), rgba(241,229,207,0.20) 0); mask:radial-gradient(circle, transparent 9px, #000 9.8px); -webkit-mask:radial-gradient(circle, transparent 9px, #000 9.8px); opacity:0; pointer-events:none; z-index:20; }
    #hud-crosshair-progress.active { opacity:0.55; }
    #hud-crosshair-progress.hidden { display:none; }
    body.hud-charging #hud-crosshair[data-cat] { animation:none; box-shadow:0 0 0 0 rgba(255,255,255,0); }
    @keyframes hud-cp-bloom { 0% { opacity:0.5; transform:scale(0.9); } 100% { opacity:0; transform:scale(1.9); } }
    #hud-crosshair-bloom { position:fixed; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:1px solid var(--cp-color,#fff); opacity:0; pointer-events:none; z-index:20; }
    #hud-crosshair-bloom.fire { animation:hud-cp-bloom 420ms ease-out 1; }
    #hud-crosshair-bloom.hidden { display:none; }
  </style>
  <!-- Bridge first: components subscribe on window.tsic at defer time; the
       playground migrates those subs into its mock on iframe load. -->
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/dom.js" defer></script>
  <script src="/shared/icons.js" defer></script>
  <script src="/shared/hud-crosshair.js" defer></script>
  <script src="/shared/hud-circular-progress.js" defer></script>
</head><body>
  <div id="hud-crosshair"></div>
  <div id="hud-crosshair-cat"></div>
  <div id="hud-crosshair-progress"></div>
  <div id="hud-crosshair-bloom"></div>
  <!-- Minimal action-panel shell: the progress ring circles the key chip of the
       running action, so the component needs chips to aim at. Rows start hidden;
       a test un-hides the one it wants to exercise. -->
  <div id="bb-shell-gameplay">
    <div id="interaction-prompt" class="hidden">Open<span class="bb-key">E</span></div>
    <div id="interaction-hold-prompt" class="hidden">Deconstruct<span class="bb-key">E</span></div>
    <div id="bb-gameplay"></div>
    <div id="hud-circular-progress" class="parked"></div>
  </div>
</body></html>
