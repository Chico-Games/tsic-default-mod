<!doctype html>
<html><head><meta charset="utf-8"><title>TSIC HUD</title>
<style>
  html, body { background: transparent; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; color: #fff; }

  .hud { position: absolute; left: 24px; bottom: 24px; width: 380px; user-select: none; }
  .label-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.85;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  .bar-track {
    position: relative; height: 22px; border: 1px solid rgba(255,255,255,0.4);
    background: rgba(0, 0, 0, 0.45); border-radius: 3px; overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    margin-top: 4px;
  }
  .bar-damage, .bar-health {
    position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
    transform-origin: left center; transition: width 0.25s linear;
  }
  .bar-damage { background: rgba(255, 64, 64, 0.5); }
  .bar-health {
    background: linear-gradient(180deg, #d33 0%, #6c1818 100%);
    transition: width 0.08s linear;
  }
  .bar-flash {
    position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
    background: rgba(255, 255, 255, 0.5);
    opacity: 0; pointer-events: none;
  }
  .bar-flash.fire { animation: flash 0.35s ease-out; }
  @keyframes flash {
    0%   { opacity: 0.9; }
    100% { opacity: 0; }
  }
  .numbers {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; font-size: 13px; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }
  #disconnected {
    position: absolute; left: 0; right: 0; bottom: -18px; text-align: center;
    font-size: 10px; opacity: 0.55;
  }
</style></head><body>
  <div class="hud">
    <div class="label-row">
      <span>Health</span>
    </div>
    <div class="bar-track">
      <div id="damageBar" class="bar-damage" style="width: 100%;"></div>
      <div id="healthBar" class="bar-health" style="width: 100%;"></div>
      <div id="flash" class="bar-flash"></div>
      <div id="numbers" class="numbers">— / —</div>
    </div>
    <div id="disconnected">awaiting attribute bridge…</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let current = 0, max = 1;
    let damageBarPct = 1.0;        // 0..1 — slow trailing bar
    let lastDamageMs = -1e9;       // wall-clock-ms of last damage event
    let hasAttr = false;           // suppress decay until first attribute arrives
    let prevT = -1;                // previous rAF timestamp for real dt
    const DAMAGE_DELAY_MS = 2000;
    const DAMAGE_DECAY_PER_SEC = 0.2;  // fraction of full bar per second

    function pct(v) { return Math.max(0, Math.min(1, v)) * 100; }
    function fmtNum(n) { return Math.round(n).toString(); }

    function applyVisual() {
      const live = max > 0 ? current / max : 0;
      $('healthBar').style.width = pct(live) + '%';
      $('damageBar').style.width = pct(damageBarPct) + '%';
      $('numbers').textContent = fmtNum(current) + ' / ' + fmtNum(max);
    }

    function step(t) {
      const dtSec = prevT < 0 ? 0 : Math.min(0.1, (t - prevT) / 1000);
      prevT = t;

      const live = max > 0 ? current / max : 0;
      // Heal: snap trailing bar up to live.
      if (damageBarPct < live) {
        damageBarPct = live;
      }
      // After the delay, lerp the damage bar down to live. Skip until the
      // first attribute arrives so we don't drain a bogus full bar at startup.
      if (hasAttr && (t - lastDamageMs) >= DAMAGE_DELAY_MS && damageBarPct > live) {
        damageBarPct = Math.max(live, damageBarPct - DAMAGE_DECAY_PER_SEC * dtSec);
      }
      applyVisual();
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    function fireFlash() {
      const el = $('flash');
      el.classList.remove('fire');
      // Restart the keyframe animation.
      void el.offsetWidth;
      el.classList.add('fire');
    }

    function whenReady(cb) {
      if (window.tsic) { cb(); return; }
      setTimeout(() => whenReady(cb), 16);
    }

    whenReady(() => {
      $('disconnected').textContent = '';
      // Live health attribute (cached — replayed on page reload).
      tsic.on('tsic.msg.UI.Player.Attribute', (p) => {
        if (!p || p.Channel !== 'Health') return;
        current = Number(p.Current) || 0;
        max = Number(p.Max) || 1;
        if (!hasAttr) {
          // Sync trailing bar to the first real value so it doesn't drain
          // from 100% on startup.
          damageBarPct = max > 0 ? current / max : 0;
          hasAttr = true;
        }
      });
      // Damage event — triggers the damage delay + flash.
      tsic.on('tsic.msg.Message.DamageEvent', (msg) => {
        if (!msg || (msg.DamageAmount || 0) <= 0) return;
        lastDamageMs = performance.now();
        // Lock the damage bar at "before-damage" position so it visibly lags behind.
        const live = max > 0 ? current / max : 0;
        if (damageBarPct < live) damageBarPct = live;
        fireFlash();
      });
    });
  </script>
</body></html>
