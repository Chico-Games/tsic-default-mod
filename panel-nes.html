<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="libs/nes.min.css">
<style>
  html, body { margin: 0; padding: 18px 22px; background: #1a1f29; color: #fff; box-sizing: border-box; height: 100vh; overflow: hidden; }
  .tag { position: fixed; right: 10px; top: 8px; font-family: monospace; font-size: 10px; font-weight: 800; letter-spacing: 2px; padding: 4px 10px; border-radius: 4px; background: #ff00aa; color: #000; }
</style></head><body>
  <div class="tag">1 NES.css</div>
  <h2 style="color:#f7d51d; margin: 6px 0;">SCAVENGER</h2>
  <p style="font-size:11px;">Found loot crate. Open?</p>
  <div>
    <button type="button" class="nes-btn is-primary">YES</button>
    <button type="button" class="nes-btn is-error">NO</button>
  </div>
  <div style="margin-top: 12px;">
    <label style="display:block; font-size:11px;">HP</label>
    <progress class="nes-progress is-success" value="78" max="100"></progress>
    <label style="display:block; font-size:11px; margin-top: 4px;">STAM</label>
    <progress class="nes-progress is-warning" value="54" max="100"></progress>
  </div>
  <div style="margin-top: 8px;">
    <span class="nes-badge"><span class="is-primary">LV 7</span></span>
    <span class="nes-badge"><span class="is-success">RARE</span></span>
  </div>
</body></html>
