<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 22px;
    background: radial-gradient(ellipse at 50% 50%, #1a0033 0%, #050010 100%);
    color: #00ffea;
    font-family: 'Consolas', monospace;
    box-sizing: border-box;
    height: 100vh; overflow: hidden;
  }
  .tag { position: fixed; right: 10px; top: 8px; font-family: monospace; font-size: 10px; font-weight: 800; letter-spacing: 2px; padding: 4px 10px; border-radius: 4px; background: #ff00aa; color: #000; }
  h2 {
    color: #ff00aa; font-size: 28px; font-weight: 900;
    letter-spacing: 3px; margin: 18px 0 8px;
    animation: cglitch 0.5s steps(2) infinite;
  }
  @keyframes cglitch {
    0%,100% { transform: translate(0,0); }
    50%     { transform: translate(2px,-1px); }
  }
  .bar {
    height: 14px; border: 1px solid #ff00aa;
    background: rgba(255,0,170,0.1);
    position: relative; overflow: hidden;
    margin-top: 12px;
  }
  .bar::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, #ff00aa, #00ffea);
    animation: cscan 2.5s ease-in-out infinite alternate;
  }
  @keyframes cscan { from { width: 20%; } to { width: 90%; } }
  .badge {
    display: inline-block; margin: 6px 6px 0 0;
    padding: 4px 10px;
    background: rgba(0,255,234,0.08);
    border: 1px solid #00ffea;
    font-size: 10px; letter-spacing: 2px;
  }
</style></head><body>
  <div class="tag">2 CYBER</div>
  <h2>NEURALINK 07</h2>
  <div style="font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.85);">SECURE CHANNEL :: ENCRYPTED</div>
  <div class="bar"></div>
  <div style="margin-top: 12px; font-size: 12px;">DECRYPTING ▓▓▓▓▓▓▓░░░ 70%</div>
  <div style="margin-top: 8px;">
    <span class="badge">SHIELDS</span>
    <span class="badge">ICE</span>
    <span class="badge">DAEMON</span>
    <span class="badge">JACK-IN</span>
  </div>
</body></html>
