<!doctype html>
<html><head><meta charset="utf-8"><title>TSIC UI library showcase</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: #1a1a1f;
    overflow: hidden;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100vw; height: 100vh;
    gap: 4px;
  }
  .cell { position: relative; overflow: hidden; }
  iframe {
    border: 0;
    width: 100%; height: 100%;
    display: block;
  }
</style></head><body>
<div class="grid">
  <div class="cell"><iframe src="panel-nes.html"></iframe></div>
  <div class="cell"><iframe src="panel-cyber.html"></iframe></div>
  <div class="cell"><iframe src="panel-water.html"></iframe></div>
  <div class="cell"><iframe src="panel-anime.html"></iframe></div>
</div>
</body></html>
