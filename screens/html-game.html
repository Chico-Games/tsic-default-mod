<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="HtmlGame">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>HTML Game</title>
  <link rel="stylesheet" href="/shared/base.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#000; }
    #game-frame {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    #game-frame.hidden { display: none; }
  </style>
</head><body>
  <iframe id="game-frame" class="hidden"></iframe>
  <script>
    (function() {
      var frame = document.getElementById('game-frame');

      tsic.on('tsic.msg.UI.HtmlGame.Opened', function(p) {
        if (!p || !p.GameHTMLPath) return;
        frame.src = '/' + p.GameHTMLPath.replace(/^\/+/, '');
        frame.classList.remove('hidden');
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          tsic.closeScreen();
        }
      });
    })();
  </script>
</body></html>
