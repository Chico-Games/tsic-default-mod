<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="MainMenu">
  <title>TSIC — Main Menu</title>
  <link rel="stylesheet" href="/shared/base.css">
  <script src="/shared/router.js" defer></script>
  <style>
    html, body { background: transparent; }
    .menu { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 36px;
            pointer-events: none; }
    .title-block { text-align: center; pointer-events: none; }
    .title-block h1 { margin: 0; font-size: 88px; letter-spacing: 18px;
            font-weight: 200; color: var(--cat-ink-dark);
            text-shadow: 0 4px 18px rgba(35,31,24,0.50), 0 0 24px rgba(220,40,40,0.18); }
    .title-block .sub { margin-top: 6px; font-size: 13px; letter-spacing: 8px;
            color: rgba(255,255,255,0.55); text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(35,31,24,0.50); }
    .buttons { display: flex; flex-direction: column; gap: 12px; width: 320px;
            pointer-events: auto; }
    .menu-btn { background: rgba(241,229,207,0.92); color: #f4f4f4;
            border: 1px solid rgba(255,255,255,0.35);
            padding: 14px 20px; font: inherit; font-size: 15px; letter-spacing: 4px;
            text-transform: uppercase; cursor: pointer;
            transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
            backdrop-filter: blur(2px); }
    .menu-btn:hover { background: rgba(180,30,30,0.65);
            border-color: rgba(255,255,255,0.85); color: var(--cat-ink-dark); }
    .menu-btn:active { background: rgba(140,18,18,0.85); }
  </style>
</head><body>
  <div class="menu">
    <div class="title-block">
      <h1>TSIC</h1>
      <div class="sub">The Store Is Closed</div>
    </div>
    <div class="buttons">
      <button class="menu-btn" id="btn-start">Start New Game</button>
      <button class="menu-btn" id="btn-load">Load Save</button>
      <button class="menu-btn" id="btn-mods">Mods</button>
      <button class="menu-btn" id="btn-settings">Settings</button>
      <button class="menu-btn" id="btn-credits">Credits</button>
      <button class="menu-btn" id="btn-exit">Exit the Store</button>
    </div>
  </div>
  <script>
    (function() {
      function whenReady(cb) {
        if (window.tsic) { cb(); return; }
        setTimeout(() => whenReady(cb), 16);
      }
      function nav(screen) {
        return () => tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: screen });
      }
      whenReady(() => {
        document.getElementById('btn-start').onclick    = nav('NewStore');
        document.getElementById('btn-load').onclick     = nav('LoadSave');
        document.getElementById('btn-mods').onclick     = nav('Mods');
        document.getElementById('btn-settings').onclick = nav('Settings');
        document.getElementById('btn-credits').onclick  = nav('Credits');
        document.getElementById('btn-exit').onclick     = () =>
          tsic.publishMessage('UI.Cmd.Menu.Exit', {});
      });
    })();
  </script>
</body></html>
