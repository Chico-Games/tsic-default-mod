<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Playground">
  <meta name="tsic-debug" content="true">
  <meta name="tsic-input-mode" content="InputMode.Menu">
  <title>TSIC SPA Playground</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    #root { display: grid; grid-template-columns: 240px 1fr 380px; height: 100vh; }
    #screens { border-right: 1px solid #1f2937; overflow: hidden; display: flex; flex-direction: column; }
    #screens h1 { font-size: 11px; letter-spacing: 3px; padding: 12px; margin: 0; color: #fbbf24; border-bottom: 1px solid #1f2937; }
    #pg-legend { padding: 6px 12px; font-size: 10px; color: #64748b; border-bottom: 1px solid #1f2937; display: flex; align-items: center; gap: 6px; }
    #pg-legend .pg-scn-dot.on { width: 7px; height: 7px; }
    #pg-filter { margin: 8px; padding: 4px 8px; background: #111827; color: #e2e8f0; border: 1px solid #1f2937; font-size: 12px; outline: none; }
    #pg-filter:focus { border-color: #374151; }
    #pg-screens { flex: 1; overflow-y: auto; }
    .pg-scn { padding: 6px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #111827; display: flex; align-items: center; gap: 8px; }
    .pg-scn:hover { background: #111827; }
    .pg-scn.active { background: #1e293b; color: #fbbf24; }
    .pg-scn-dot { width: 8px; height: 8px; border-radius: 50%; background: #1f2937; flex: 0 0 auto; }
    .pg-scn-dot.on { background: #fbbf24; box-shadow: 0 0 6px rgba(251, 191, 36, 0.5); }

    #viewer { display: flex; flex-direction: column; min-width: 0; }
    #toolbar { padding: 6px 12px; border-bottom: 1px solid #1f2937; font-size: 12px; display: flex; gap: 8px; align-items: center; }
    #toolbar button { background: #1f2937; color: #e2e8f0; border: 1px solid #374151; padding: 4px 10px; font-size: 11px; cursor: pointer; }
    #toolbar button:hover { background: #374151; }
    #pg-iframe-wrap { flex: 1; background: #d4c19d; min-height: 0; }
    #pg-iframe { width: 100%; height: 100%; border: 0; background: transparent; }

    #side { border-left: 1px solid #1f2937; display: flex; flex-direction: column; min-width: 0; }
    .pg-tabs { display: flex; border-bottom: 1px solid #1f2937; }
    .pg-tab { flex: 1; padding: 8px 12px; cursor: pointer; font-size: 11px; letter-spacing: 2px; text-align: center; border-right: 1px solid #1f2937; user-select: none; }
    .pg-tab:last-child { border-right: 0; }
    .pg-tab.active { background: #1e293b; color: #fbbf24; }
    .pg-pane { flex: 1; padding: 8px; overflow-y: auto; display: none; flex-direction: column; gap: 6px; min-height: 0; }

    .pg-btn { background: #1f2937; color: #e2e8f0; border: 1px solid #374151; padding: 6px 10px; font-size: 11px; cursor: pointer; text-align: left; font-family: inherit; }
    .pg-btn:hover { background: #374151; }
    .pg-btn-strong { background: #b45309; border-color: #92400e; }
    .pg-btn-strong:hover { background: #d97706; }

    .pg-input-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .pg-input-grid .pg-btn { text-align: center; }
    .pg-input-custom { display: flex; gap: 4px; margin-top: 8px; align-items: center; }
    .pg-input-custom input,
    .pg-input-custom select { flex: 1; background: #111827; color: #e2e8f0; border: 1px solid #374151; padding: 4px 6px; font-size: 11px; outline: none; font-family: inherit; }
    .pg-input-custom select optgroup { color: #fbbf24; }
    .pg-input-custom select option { color: #e2e8f0; background: #111827; }
    .pg-input-label { font-size: 11px; color: #94a3b8; min-width: 44px; letter-spacing: 1px; text-transform: uppercase; }

    .pg-input-mode-bar { margin-bottom: 8px; }
    .pg-input-mode-bar .pg-btn { width: 100%; padding: 8px; font-size: 12px; letter-spacing: 2px; text-align: center; }
    .pg-input-mode-bar .pg-btn.on { background: #047857; border-color: #065f46; color: #ecfdf5; }

    .pg-focus-block { margin-top: 12px; padding: 10px; border: 1px solid #334155; border-radius: 3px; background: rgba(30, 41, 59, 0.55); display: flex; flex-direction: column; gap: 6px; }
    .pg-focus-h { font-size: 11px; letter-spacing: 3px; color: #fbbf24; padding-bottom: 4px; border-bottom: 1px solid #334155; margin-bottom: 4px; }
    .pg-focus-status { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; color: #e2e8f0; word-break: break-word; line-height: 1.4; }
    .pg-focus-status.warn { color: #fbbf24; }
    .pg-focus-status.muted { color: #94a3b8; font-size: 11px; }
    .pg-focus-row { display: grid; grid-template-columns: 80px 1fr; gap: 8px; font-size: 12px; line-height: 1.5; }
    .pg-focus-key { color: #94a3b8; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
    .pg-focus-val { color: #e2e8f0; font-family: 'Consolas', monospace; word-break: break-word; }
    .pg-focus-dirs { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .pg-focus-dirs .pg-btn { font-size: 16px; padding: 8px 6px; }

    /* D-pad: 3x3 cross. Arrow buttons go in the cardinal cells, corners
       stay empty. Used by both the QUICK row and the focus-engine block. */
    .pg-dpad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 3px;
      width: 132px;
      margin: 4px auto;
    }
    .pg-dpad .pg-btn { text-align: center; font-size: 16px; padding: 8px 0; line-height: 1; }
    .pg-dpad-up    { grid-column: 2; grid-row: 1; }
    .pg-dpad-left  { grid-column: 1; grid-row: 2; }
    .pg-dpad-right { grid-column: 3; grid-row: 2; }
    .pg-dpad-down  { grid-column: 2; grid-row: 3; }

    /* Axis2D virtual joystick. */
    .pg-axis2d {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 3px;
      background: rgba(30, 41, 59, 0.55);
      display: flex; flex-direction: column; gap: 8px;
    }
    .pg-axis2d-h {
      font-size: 11px; letter-spacing: 3px; color: #fbbf24;
      padding-bottom: 4px; border-bottom: 1px solid #334155;
    }
    .pg-axis2d-row { display: flex; gap: 10px; align-items: center; }
    .pg-joystick {
      position: relative;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      flex: 0 0 auto;
      touch-action: none;
      user-select: none;
    }
    .pg-joystick::before {
      /* Crosshair guide. */
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(to right, transparent 49%, rgba(51,65,85,0.5) 49%, rgba(51,65,85,0.5) 51%, transparent 51%),
        linear-gradient(to bottom, transparent 49%, rgba(51,65,85,0.5) 49%, rgba(51,65,85,0.5) 51%, transparent 51%);
      border-radius: 50%;
      pointer-events: none;
    }
    .pg-joystick-knob {
      position: absolute;
      left: 50%; top: 50%;
      width: 44px; height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
      border: 1px solid #92400e;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: grab;
      transition: transform 80ms ease-out;
    }
    .pg-joystick.dragging .pg-joystick-knob { cursor: grabbing; transition: none; }
    .pg-axis2d-readout {
      flex: 1;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      color: #cbd5e1;
      display: flex; flex-direction: column; gap: 4px;
      min-width: 0;
    }
    .pg-axis2d-readout .v { color: #fbbf24; }

    /* Debug panel. */
    .pg-dbg { display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
    .pg-dbg .pg-dbg-sec { border: 1px solid #1f2937; background: rgba(15, 23, 42, 0.55); border-radius: 3px; }
    .pg-dbg .pg-dbg-h { padding: 5px 10px; font-size: 10px; letter-spacing: 3px; color: #fbbf24; border-bottom: 1px solid #1f2937; background: #1e293b; font-family: 'Segoe UI', system-ui, sans-serif; }
    .pg-dbg .pg-dbg-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; color: #cbd5e1; word-break: break-word; font-family: 'Segoe UI', system-ui, sans-serif; }
    .pg-dbg .pg-dbg-fact { display: grid; grid-template-columns: 96px 1fr; gap: 8px; line-height: 1.4; }
    .pg-dbg .pg-dbg-k { color: #94a3b8; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
    .pg-dbg code { color: #e2e8f0; font-family: 'Consolas','Cascadia Code',monospace; font-size: 12px; }
    .pg-dbg code.warn { color: #fbbf24; }
    .pg-dbg code.muted { color: #64748b; }
    .pg-dbg .pg-dbg-list { margin: 0; padding-left: 16px; max-height: 140px; overflow: auto; }
    .pg-dbg .pg-dbg-list li { font-size: 10px; }
    .pg-dbg .pg-dbg-hist { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; }
    .pg-dbg .pg-dbg-hist-row { padding: 2px 0; display: flex; gap: 6px; align-items: baseline; border-bottom: 1px solid #111827; }
    .pg-dbg .pg-dbg-hist-row .t { color: #6b7280; font-size: 9px; min-width: 70px; }
    .pg-dbg .pg-dbg-hist-row .kind { font-size: 9px; letter-spacing: 1px; min-width: 56px; color: #94a3b8; text-transform: uppercase; }
    .pg-dbg .pg-dbg-hist-row .msg { flex: 1; }
    .pg-dbg .pg-dbg-publish .kind  { color: #93c5fd; }
    .pg-dbg .pg-dbg-inject  .kind  { color: #fde68a; }
    .pg-dbg .pg-dbg-scenario .kind { color: #f0abfc; }
    .pg-dbg .pg-dbg-fixture  .kind { color: #86efac; }
    .pg-dbg .pg-dbg-mode    .kind  { color: #67e8f9; }
    .pg-dbg .pg-dbg-focus   .kind  { color: #fca5a5; }
    .pg-dbg .pg-dbg-fail    .kind,
    .pg-dbg .pg-dbg-error   .kind  { color: #fca5a5; }

    #pg-log-toolbar { display: flex; gap: 4px; margin-bottom: 4px; }
    #pg-log { flex: 1; overflow-y: auto; font-family: 'Consolas', 'Cascadia Code', monospace; font-size: 10px; border: 1px solid #1f2937; }
    .pg-log-row { padding: 2px 6px; border-bottom: 1px solid #111827; white-space: pre-wrap; word-break: break-word; }
    .pg-log-row.inject { color: #fde68a; }
    .pg-log-row.publish { color: #93c5fd; }
    .pg-log-row.info { color: #cbd5e1; }
    .pg-log-row.fail { color: #fca5a5; }
  </style>

</head><body>
  <div id="root">
    <div id="screens">
      <h1>SCREENS</h1>
      <input id="pg-filter" placeholder="filter…">
      <div id="pg-legend"><span class="pg-scn-dot on"></span> controller focus engine enabled</div>
      <div id="pg-screens"></div>
    </div>
    <div id="viewer">
      <div id="toolbar">
        <button id="pg-reload">Reload</button>
        <button id="pg-dump">Dump state</button>
        <button id="pg-subscribed">Subscribed</button>
        <button id="pg-close" style="margin-left:auto;background:#a33;border-color:#c55;color:#eee;">Close</button>
      </div>
      <div id="pg-iframe-wrap"><iframe id="pg-iframe" src="about:blank"></iframe></div>
    </div>
    <div id="side">
      <div class="pg-tabs">
        <div class="pg-tab active" data-pane="pg-scenarios-pane">SCENARIOS</div>
        <div class="pg-tab" data-pane="pg-input-pane">INPUT</div>
        <div class="pg-tab" data-pane="pg-debug-pane">DEBUG</div>
        <div class="pg-tab" data-pane="pg-log-pane">LOG</div>
      </div>
      <div id="pg-scenarios-pane" class="pg-pane" style="display:flex;"><div id="pg-scenarios"></div></div>
      <div id="pg-input-pane" class="pg-pane"><div id="pg-input"></div></div>
      <div id="pg-debug-pane" class="pg-pane"><div id="pg-debug"></div></div>
      <div id="pg-log-pane" class="pg-pane">
        <div id="pg-log-toolbar"><button class="pg-btn" id="pg-clearlog">Clear</button></div>
        <div id="pg-log"></div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      TSICPlaygroundHost.boot();
      document.getElementById('pg-close').addEventListener('click', () => {
        if (window.tsic) tsic.publishMessage('UI.Cmd.Debug.Close', {});
      });
    });
  </script>
</body></html>
