<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="PlayerIndicators">
  <title>Player Indicators</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
  <style>
    html, body { background: transparent; }
    #pi-host { position: fixed; inset: 0; pointer-events: none; }
    .pi { position: absolute; transform: translate(-50%, -100%); pointer-events: none; color: var(--cat-ink-dark); text-shadow: 0 0 4px rgba(35,31,24,0.50); font-size: 11px; letter-spacing: 1px; white-space: nowrap; }
    .pi .name  { background: rgba(241,229,207,0.92); border: 1px solid rgba(184,170,145,0.45); padding: 2px 6px; border-radius: 2px; }
    .pi .dist  { display:block; font-size: 9px; opacity: 0.65; margin-top: 1px; text-align:center; }
    .pi.off    { transform: translate(-50%, -50%) scale(0.85); opacity: 0.7; }
    .pi.lookedAt { transform-origin: 50% 100%; animation: pi-pop 600ms ease-out 1; }
    @keyframes pi-pop { 0% { transform: translate(-50%, -100%) scale(0.85); } 50% { transform: translate(-50%, -100%) scale(1.18); } 100% { transform: translate(-50%, -100%) scale(1); } }
  </style>
</head><body>
  <div id="pi-host"></div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      // ScreenPos01 is a 1080p-normalised coordinate in [0..1]; we apply it to
      // window.inner{Width,Height}. The C++ publisher clamps off-screen to the
      // viewport edges so we still see edge-arrow indicators here.
      whenReady(()=>{
        tsic.on('tsic.msg.UI.PlayerIndicators', (p) => {
          const host = document.getElementById('pi-host');
          host.innerHTML = '';
          for (const ind of ((p && p.Indicators) || [])) {
            const x = (ind.ScreenPos01 && ind.ScreenPos01.X || 0) * window.innerWidth;
            const y = (ind.ScreenPos01 && ind.ScreenPos01.Y || 0) * window.innerHeight;
            const el = document.createElement('div');
            el.className = 'pi' + (ind.bOffScreen ? ' off' : '') + (ind.bLookedAt ? ' lookedAt' : '');
            el.style.left = `${x}px`;
            el.style.top  = `${y}px`;
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = ind.Name || ind.PlayerId || '';
            if (ind.Color) name.style.color = ind.Color;
            el.appendChild(name);
            if (typeof ind.Distance === 'number' && ind.Distance > 0) {
              const d = document.createElement('span');
              d.className = 'dist';
              // Distance is centimetres; convert to metres for readability.
              d.textContent = `${(ind.Distance / 100).toFixed(0)} m`;
              el.appendChild(d);
            }
            host.appendChild(el);
          }
        });
      });
    })();
  </script>
</body></html>
