<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Settings">
  <meta name="tsic-input-mode" content="InputMode.Menu.Settings">
  <meta name="tsic-cancel-cmd" content="UI.Cmd.Settings.Back">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>Settings</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <script src="/screens/settings.js" defer></script>
  <style>
    html, body { background: transparent; color: var(--cat-ink-dark);
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center; }
    #wrap   { width: min(820px, calc(100% - 48px)); max-height: calc(100vh - 48px);
            padding: 32px 40px; box-sizing: border-box; overflow: auto;
            background: var(--cat-bg); color: var(--cat-ink-dark);
            border: 1px solid var(--cat-border);
            box-shadow: var(--cat-shadow-soft);
            font-family: var(--cat-font-serif); }
    #tabs { display:flex; gap: 8px; border-bottom: 1px solid var(--cat-border); margin: 16px 0; padding-bottom: 8px; flex-wrap: wrap; }
    .tsic-tab { background: transparent; border: 1px solid transparent; color: var(--cat-ink-dark); padding: 4px 12px; cursor: pointer; font-family: inherit; }
    .tsic-tab.active { border-color: var(--tsic-accent); background: var(--cat-paper-panel); }
    .group  { margin-bottom: 24px; }
    .group h3 { letter-spacing: 3px; font-size: 13px; margin: 0 0 8px; text-transform: uppercase; color: var(--cat-ink-soft); }
    .field  { display:flex; align-items:center; justify-content:space-between; padding: 8px 0; border-bottom: 1px solid var(--tsic-border); gap: 16px; }
    .field label { flex: 1; color: var(--cat-ink-dark); font-size: 14px; }
    .field-control { display:flex; align-items:center; gap: 8px; }
    .field input[type=range] { width: 240px; }
    .field select { background: var(--cat-paper-panel); color: var(--cat-ink-dark); border: 1px solid var(--tsic-border); padding: 2px 6px; font-family: inherit; }
    .field .value-label { color: rgba(47,43,34,0.6); min-width: 36px; text-align: right; }
    .field-toggle      { width: 44px; height: 22px; background: var(--cat-border-strong); border-radius: 12px; position:relative; cursor:pointer; transition: background 100ms linear; }
    .field-toggle.on   { background: var(--tsic-accent); }
    .field-toggle::after { content:''; position:absolute; left:3px; top:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition: left 100ms linear; }
    .field-toggle.on::after { left: 25px; }
    .field-toggle.disabled { background: rgba(184,170,145,0.4); cursor: not-allowed; }
    .field-rebind { background: var(--cat-paper-panel); color: var(--cat-ink-dark); border:1px solid var(--tsic-border); padding: 2px 10px; cursor:pointer; min-width: 120px; font-family: inherit; }
    .field-rebind.waiting { background: var(--tsic-accent-dim); }
    .tsic-footer-flag { margin-left: auto; display:inline-flex; gap:8px; align-items:center; }
    /* [hidden] is otherwise overridden by display:inline-flex above. */
    .tsic-footer-flag[hidden] { display: none; }
    #restart-required { color: var(--tsic-warning, #d88); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  </style>
</head><body>
  <div id="wrap">
    <h2 class="tsic-title tsic-title--lg">Settings</h2>
    <div id="tabs" class="tsic-tab-strip" data-tsic-tab-bar></div>
    <div id="page" data-tsic-focus-group="setting-list">Loading…</div>
    <div class="tsic-button-row tsic-button-row--start" data-tsic-focus-group="actions">
      <button class="tsic-button" id="btn-back" data-tsic-initial-focus>Back</button>
      <button class="tsic-button" id="btn-reset">Reset to Defaults</button>
      <span id="restart-required" class="tsic-footer-flag" hidden>Restart required</span>
      <span id="apply-toast" class="tsic-footer-flag" hidden>Applying… <b id="apply-countdown">10</b>s
        <button id="btn-keep" class="tsic-button">Keep</button>
        <button id="btn-revert" class="tsic-button">Revert</button>
      </span>
    </div>
  </div>
</body></html>
