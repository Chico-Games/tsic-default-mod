<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Settings">
  <meta name="tsic-input-mode" content="InputMode.Menu.Settings">
  <meta name="tsic-cancel-cmd" content="UI.Cmd.Settings.Back">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>Settings</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <script src="/screens/settings.js" defer></script>
  <style>
    .settings-body { padding: 4px 22px 14px; max-height: 60vh; overflow-y: auto; }
    /* Magazine tab strip — labels rendered like newsstand section tabs. */
    #tabs {
      display: flex;
      gap: 0;
      border-bottom: 4px solid var(--ink-night);
      margin: 8px 0 14px;
      padding: 0;
      flex-wrap: wrap;
    }
    .tsic-tab {
      background: transparent;
      border: 0;
      color: var(--ink-soft);
      padding: 8px 16px;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      position: relative;
      bottom: -4px;
    }
    .tsic-tab:hover { color: var(--ink-night); }
    .tsic-tab.active {
      color: var(--paper-cream);
      background: var(--ink-night);
    }
    .tsic-tab[data-tsic-focused] { outline: 2px solid var(--mag-red); outline-offset: -2px; }

    .group { margin-bottom: 22px; }
    .group h3 {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 6px;
      padding-bottom: 3px;
      border-bottom: 2px dashed var(--ink-mute);
    }
    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--ink-mute);
      gap: 16px;
    }
    .field label {
      flex: 1;
      color: var(--ink-night);
      font-family: var(--font-body);
      font-size: 14px;
    }
    .field-control { display: flex; align-items: center; gap: 8px; }
    .field input[type=range] {
      width: 240px;
      accent-color: var(--mag-red);
    }
    .field select {
      background: var(--paper-bright);
      color: var(--ink-night);
      border: 1px solid var(--ink-night);
      padding: 3px 8px;
      font-family: inherit;
    }
    .field .value-label {
      color: var(--ink-soft);
      min-width: 36px;
      text-align: right;
      font-family: var(--font-terminal);
      font-size: 13px;
    }
    /* Toggle pill — dark ink track, paper-cream knob, magazine red when on. */
    .field-toggle {
      width: 44px; height: 22px;
      background: var(--ink-mute);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: background 120ms linear;
    }
    .field-toggle.on { background: var(--mag-red); }
    .field-toggle::after {
      content: '';
      position: absolute;
      left: 3px; top: 3px;
      width: 16px; height: 16px;
      background: var(--paper-cream);
      border-radius: 50%;
      transition: left 120ms linear;
    }
    .field-toggle.on::after { left: 25px; }
    .field-toggle.disabled { background: var(--paper-muted); cursor: not-allowed; }
    .field-rebind {
      background: var(--paper-bright);
      color: var(--ink-night);
      border: 1px solid var(--ink-night);
      padding: 3px 12px;
      cursor: pointer;
      min-width: 120px;
      font-family: var(--font-body);
    }
    .field-rebind:hover { background: var(--mag-yellow); }
    .field-rebind.waiting { background: var(--mag-red); color: var(--paper-cream); border-color: var(--mag-red); }

    /* Transient status row above the row-buttons. */
    .settings-status {
      padding: 8px 22px 0;
      display: flex;
      gap: 10px;
      align-items: center;
      font-family: var(--font-terminal);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .settings-status [hidden] { display: none; }
    #restart-required { color: var(--mag-red); }
    #apply-toast {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--ink-night);
    }
    #apply-toast .tsic-button { font-size: 11px; padding: 3px 10px; }
  </style>
</head><body>
  <div class="tsic-stage--magazine-gradient">
    <div class="tsic-panel tsic-cover" style="--tsic-cover-width: 820px;">
      <div class="tsic-masthead">
        <div class="tsic-masthead-title">
          <em>The Fine</em>
          Print.
        </div>
        <div class="tsic-masthead-meta">
          <span class="tsic-masthead-issue">Dept. 88</span>
          <span class="tsic-masthead-date">Shopping, your way.</span>
        </div>
      </div>

      <div class="settings-body">
        <div id="tabs" class="tsic-tab-strip" data-tsic-tab-bar></div>
        <div id="page" data-tsic-focus-group="setting-list">Loading…</div>
      </div>

      <div class="settings-status">
        <span id="restart-required" hidden>Restart required</span>
        <span id="apply-toast" hidden>
          Applying… <b id="apply-countdown">10</b>s
          <button id="btn-keep" class="tsic-button">Keep</button>
          <button id="btn-revert" class="tsic-button">Revert</button>
        </span>
      </div>

      <div class="tsic-cover-rows" data-tsic-focus-group="actions">
        <button class="tsic-row-button" id="btn-back" data-tsic-initial-focus>
          <span class="tsic-row-dept">Fire Exit</span>
          Back to Main
          <span class="tsic-row-pg">PG. 01</span>
        </button>
        <button class="tsic-row-button" id="btn-reset">
          <span class="tsic-row-dept">Dept. 88</span>
          Reset to Defaults
          <span class="tsic-row-pg">RESET</span>
        </button>
      </div>
    </div>
  </div>
</body></html>
