<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="PauseMenu">
  <meta name="tsic-action-bar-context" content='[{"ActionName":"IA_UI_CancelBack","Label":"Resume","Priority":1000}]'>
  <title>Paused</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    #pause-panel { width:360px; text-align:center; }
    .pl { text-align:left; margin: 16px 0; max-height: 140px; overflow:auto; }
    .pl-row { padding: 4px 6px; }
    .pause-btn-row > button { flex: 1; }
  </style>
</head><body>
  <div id="pause-overlay" class="tsic-modal-scrim tsic-modal-scrim--paper">
    <div id="pause-panel" class="tsic-panel">
      <h1 class="tsic-title tsic-title--lg">Paused</h1>
      <div class="pl" id="players"></div>
      <button class="tsic-button" style="width:100%;" id="btn-resume">Resume</button>
      <div class="tsic-row pause-btn-row" style="margin-top:8px; gap:8px;">
        <button class="tsic-button" id="btn-settings">Settings</button>
        <button class="tsic-button" id="btn-menu">Quit to Menu</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if (window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      whenReady(()=>{
        tsic.on('tsic.msg.UI.Players.List', (p)=>{
          const host = document.getElementById('players');
          host.innerHTML = '';
          if (!p || !p.Players) return;
          for (const pl of p.Players) {
            const row = document.createElement('div');
            row.className = 'pl-row';
            row.textContent = pl.Name + (pl.bIsHost ? ' (host)' : '');
            host.appendChild(row);
          }
        });
        document.getElementById('btn-resume').onclick = () => tsic.publishMessage('UI.Cmd.Pause.Resume', {});
        document.getElementById('btn-settings').onclick = () => tsic.publishMessage('UI.Cmd.Pause.Settings', {});
        document.getElementById('btn-menu').onclick = () => tsic.publishMessage('UI.Cmd.Pause.QuitToMenu', {});
      });
    })();
  </script>
</body></html>
