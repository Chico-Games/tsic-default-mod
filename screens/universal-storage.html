<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="UniversalStorage">
  <meta name="tsic-input-mode" content="InputMode.Menu.UniversalStorageSetup">
  <meta name="tsic-action-bar-context" content='[{"ActionName":"IA_UI_ConfirmAccept","Label":"Bind","Priority":10}]'>
  <title>Universal Storage</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
</head><body>
  <div id="root" class="tsic-modal-scrim">
    <div class="tsic-panel" style="width:720px;max-width:calc(100vw - 48px);max-height:92vh;overflow:auto;">
      <h2 class="tsic-title">Universal Storage</h2>
      <div id="grid" style="display:grid;grid-template-columns:repeat(8,56px);gap:6px;"></div>
      <div class="tsic-close-row">
        <button class="tsic-button" id="btn-close">Close</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      function renderItems(items) {
        const host = document.getElementById('grid');
        host.innerHTML = '';
        for (let i = 0; i < 64; i++) {
          const slot = document.createElement('div');
          slot.className = 'tsic-slot';
          slot.dataset.slot = i;
          host.appendChild(slot);
        }
        for (const it of items) {
          const idx = (typeof it.SlotIndex === 'number' && it.SlotIndex >= 0) ? it.SlotIndex : -1;
          const slot = (idx >= 0 && idx < host.children.length) ? host.children[idx] : null;
          if (!slot) continue;
          if (it.IconUrl) {
            slot.style.backgroundImage = `url(${it.IconUrl})`;
            slot.style.backgroundSize = 'cover';
          } else if (it.ItemId) {
            slot.textContent = it.ItemId;
            slot.style.fontSize = '9px';
            slot.style.color = '#ccc';
            slot.style.padding = '2px';
            slot.style.wordBreak = 'break-all';
          }
          if (it.Count > 1) {
            const c = document.createElement('span');
            c.className = 'count';
            c.textContent = it.Count;
            slot.appendChild(c);
          }
          slot.onclick = () =>
            tsic.publishMessage('UI.Cmd.Inventory.Transfer', {
              FromOwnerId: 'Universal',
              ToOwnerId: 'Player',
              FromSlot: idx,
              ToSlot: -1,
              Count: it.Count || 1
            });
        }
      }
      whenReady(()=>{
        tsic.on('tsic.msg.UI.Inventory.Updated', (p)=>{
          if (!p || p.OwnerId !== 'Universal') return;
          renderItems(p.Items || []);
        });
        document.getElementById('btn-close').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.Resume', {});
      });
    })();
  </script>
</body></html>
