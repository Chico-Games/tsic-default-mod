<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Equipment">
  <title>Equipment</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
</head><body>
  <div id="root" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);">
    <div class="tsic-panel" style="width:520px;max-height:80vh;overflow:auto;">
      <h2 style="margin:0 0 12px;letter-spacing:3px;">EQUIPMENT</h2>
      <div id="grid" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      <div style="margin-top:12px;">
        <button class="tsic-button" id="btn-close">Close</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      whenReady(()=>{
        tsic.on('tsic.msg.UI.Equipment.Updated', (p) => {
          const host = document.getElementById('grid');
          host.innerHTML = '';
          for (const s of ((p && p.Slots) || [])) {
            const slot = document.createElement('div');
            slot.className = 'tsic-slot';
            slot.style.width = '72px';
            slot.style.height = '72px';
            if (s.IconUrl) {
              slot.style.backgroundImage = `url(${s.IconUrl})`;
              slot.style.backgroundSize = 'cover';
            } else {
              const label = document.createElement('div');
              label.style.cssText = 'font-size:9px;color:#bbb;padding:2px;word-break:break-all;';
              label.textContent = s.SlotTag || '';
              slot.appendChild(label);
              if (s.ItemId) {
                const item = document.createElement('div');
                item.style.cssText = 'font-size:9px;color:#fff;padding:2px;word-break:break-all;';
                item.textContent = s.ItemId;
                slot.appendChild(item);
              }
            }
            slot.title = s.SlotTag || '';
            slot.onclick = () => tsic.publishMessage('tsic.msg.UI.Cmd.Equipment.Unequip', { SlotTag: s.SlotTag || '', ItemId: s.ItemId || '' });
            host.appendChild(slot);
          }
        });
        document.getElementById('btn-close').onclick = () =>
          tsic.publishMessage('tsic.msg.UI.Cmd.Pause.Resume', {});
      });
    })();
  </script>
</body></html>
