<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Wardrobe">
  <title>Wardrobe</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    #wardrobe-panel { width: 760px; max-height: 80vh; display:grid; grid-template-columns: 1fr 280px; gap:16px; }
    #wardrobe-grid  { display:flex; flex-wrap:wrap; gap:6px; }
    #wardrobe-preview { width: 280px; height: 360px; background: rgba(241,229,207,0.92); border:1px solid var(--tsic-border); }
    #wardrobe-preview img { width:100%; height:100%; object-fit:contain; }
    #wardrobe-close { grid-column: 1 / 3; }
  </style>
</head><body>
  <div id="root" class="tsic-modal-scrim">
    <div id="wardrobe-panel" class="tsic-panel">
      <div>
        <h2 class="tsic-title">Wardrobe</h2>
        <div id="wardrobe-grid"></div>
      </div>
      <div>
        <div class="tsic-eyebrow">Preview</div>
        <div id="wardrobe-preview"><img id="wardrobe-preview-img" alt=""></div>
      </div>
      <div id="wardrobe-close" class="tsic-close-row">
        <button class="tsic-button" id="btn-close">Close</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      let charPreviewFrame = 0;
      let charPreviewTimer = null;

      function startCharPreviewPolling() {
        if (charPreviewTimer) return;
        const img = document.getElementById('wardrobe-preview-img');
        charPreviewTimer = setInterval(() => {
          charPreviewFrame++;
          img.src = `tex://character-preview?t=${charPreviewFrame}`;
        }, 100);
      }
      function stopCharPreviewPolling() {
        if (charPreviewTimer) { clearInterval(charPreviewTimer); charPreviewTimer = null; }
      }

      whenReady(()=>{
        tsic.on('tsic.msg.UI.Equipment.Updated', (p) => {
          const host = document.getElementById('wardrobe-grid');
          host.innerHTML = '';
          for (const s of ((p && p.Slots) || [])) {
            const tag = (s.SlotTag || '').toLowerCase();
            if (tag && tag.indexOf('cosmetic') < 0 && tag.indexOf('wardrobe') < 0 && tag.indexOf('outfit') < 0) {
              continue;
            }
            const slot = document.createElement('div');
            slot.className = 'tsic-slot';
            slot.style.width = '72px';
            slot.style.height = '72px';
            if (s.IconUrl) {
              slot.style.backgroundImage = `url(${s.IconUrl})`;
              slot.style.backgroundSize = 'cover';
            } else {
              const label = document.createElement('div');
              label.style.cssText = 'font-size:9px;color: var(--cat-ink-soft);padding:2px;word-break:break-all;';
              label.textContent = s.SlotTag || '';
              slot.appendChild(label);
              if (s.ItemId) {
                const item = document.createElement('div');
                item.style.cssText = 'font-size:9px;color: var(--cat-ink-dark);padding:2px;word-break:break-all;';
                item.textContent = s.ItemId;
                slot.appendChild(item);
              }
            }
            slot.title = s.SlotTag || '';
            slot.onclick = () => tsic.publishMessage('UI.Cmd.Equipment.Unequip', { SlotTag: s.SlotTag || '', ItemId: s.ItemId || '' });
            host.appendChild(slot);
          }
        });
        tsic.on('tsic.msg.UI.CharacterPreview.Ready', (p) => {
          if (p && p.bReady) startCharPreviewPolling();
        });
        document.getElementById('btn-close').onclick = () => {
          tsic.publishMessage('UI.Cmd.CharacterPreview.Hide', {});
          stopCharPreviewPolling();
          tsic.publishMessage('UI.Cmd.Pause.Resume', {});
        };
        tsic.publishMessage('UI.Cmd.CharacterPreview.Show', {});
      });
    })();
  </script>
</body></html>
