<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="SaveLoad">
  <title>Save / Load</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
</head><body>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);">
    <div class="tsic-panel" style="width:480px;">
      <h2 style="margin:0 0 16px;letter-spacing:3px;">SAVE / LOAD</h2>
      <div id="slots" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;"></div>
      <div style="margin-top:16px;display:flex;gap:8px;">
        <button class="tsic-button" id="btn-back" style="flex:1;">Back</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if (window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      whenReady(()=>{
        tsic.on('tsic.msg.UI.Save.Slots', (p)=>{
          const host = document.getElementById('slots');
          host.innerHTML = '';
          const slots = (p && p.Slots) || [];
          for (const s of slots) {
            const el = document.createElement('div');
            el.className = 'tsic-panel';
            el.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 12px;';
            el.innerHTML = `<div><b>${s.Label || s.SlotId}</b><br><span style="opacity:0.6;font-size:11px;">${s.TimestampIso}</span></div>`;
            const load = document.createElement('button');
            load.className = 'tsic-button';
            load.textContent = 'Load';
            load.onclick = () => tsic.publishMessage('tsic.msg.UI.Cmd.Menu.LoadSlot', { SlotId: s.SlotId });
            el.appendChild(load);
            host.appendChild(el);
          }
        });
        document.getElementById('btn-back').onclick = () =>
          tsic.publishMessage('tsic.msg.UI.Cmd.Pause.Resume', {});
      });
    })();
  </script>
</body></html>
