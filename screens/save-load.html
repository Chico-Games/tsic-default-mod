<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="SaveLoad">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>Save / Load</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
</head><body>
  <style>
    /* Slot row is a tsic-row-button; override default flex with a grid so the
       thumb / meta layout matches the original. */
    .slot-row { display: grid; grid-template-columns: 84px 1fr;
                gap: 12px; align-items: center; padding: 10px 12px; }
    .slot-thumb { width: 84px; height: 56px; background: rgba(35,31,24,0.20);
                  border: 1px solid var(--cat-border);
                  display: flex; align-items: center; justify-content: center;
                  color: var(--cat-ink-soft); font-size: 10px; letter-spacing: 2px;
                  text-transform: uppercase; overflow: hidden; }
    .slot-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slot-meta { display: flex; flex-direction: column; gap: 2px;
                 font-size: 12px; line-height: 1.35; }
    .slot-meta .opened { color: var(--cat-ink-dark); }
    .slot-meta .playtime { color: var(--cat-ink-soft); }
    .slot-empty { color: rgba(47,43,34,0.6); padding: 16px; text-align: center; }
    .slot-row { position: relative; }
    .slot-delete { position: absolute; top: 6px; right: 8px;
                   padding: 2px 8px; font-size: 11px;
                   background: rgba(150,30,30,0.85); color: #fff;
                   border: 1px solid rgba(80,15,15,0.85); border-radius: 3px;
                   cursor: pointer; pointer-events: auto; }
    .slot-delete:hover { background: rgba(180,40,40,0.95); }
  </style>
  <div class="tsic-modal-scrim tsic-modal-scrim--clear">
    <div class="tsic-panel" style="width:520px; background: var(--cat-bg);">
      <h2 class="tsic-title">Save / Load</h2>
      <div id="slots" class="tsic-stack tsic-stack--sm" style="max-height:380px;overflow:auto;" data-tsic-focus-group="slot-list"></div>
      <div class="tsic-button-row" data-tsic-focus-group="actions">
        <button class="tsic-button" id="btn-back" style="flex:1;" data-tsic-initial-focus>Back</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      function formatPlaytime(seconds) {
        const total = Math.max(0, Math.floor(Number(seconds) || 0));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
        return `${m}m`;
      }
      function formatOpened(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (isNaN(d)) return iso;
        // Locale short date + 24h time.
        const date = d.toLocaleDateString();
        const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `${date}  ${time}`;
      }
      function safeThumbnailUrl(u) {
        if (typeof u !== 'string' || !u) return null;
        if (u.startsWith('data:image/png;base64,')) return u;
        try {
          const parsed = new URL(u);
          return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : null;
        } catch { return null; }
      }

      tsic.bootMenu(function (ctx) {
        ctx.on('tsic.msg.UI.Save.Slots', (p)=>{
          const host = document.getElementById('slots');
          host.innerHTML = '';
          const slots = (p && p.Slots) || [];
          if (!slots.length) {
            const empty = document.createElement('div');
            empty.className = 'slot-empty';
            empty.textContent = 'No saves yet.';
            host.appendChild(empty);
            return;
          }
          for (const s of slots) {
            const el = document.createElement('button');
            el.type = 'button';
            el.className = 'tsic-row-button slot-row';
            el.setAttribute('aria-label', `Load save from ${formatOpened(s.TimestampIso)}`);

            const thumbWrap = document.createElement('div');
            thumbWrap.className = 'slot-thumb';
            const thumbUrl = safeThumbnailUrl(s.ThumbnailUrl);
            if (thumbUrl) {
              const img = document.createElement('img');
              img.src = thumbUrl;
              img.alt = '';
              thumbWrap.appendChild(img);
            } else {
              thumbWrap.textContent = 'No image';
            }

            const meta = document.createElement('div');
            meta.className = 'slot-meta';
            const opened = document.createElement('span');
            opened.className = 'opened';
            opened.textContent = formatOpened(s.TimestampIso);
            const playtime = document.createElement('span');
            playtime.className = 'playtime';
            playtime.textContent = `Playtime ${formatPlaytime(s.PlaytimeSeconds)}`;
            meta.append(opened, playtime);

            const del = document.createElement('span');
            del.className = 'slot-delete';
            del.textContent = 'Delete';
            del.setAttribute('role', 'button');
            del.setAttribute('aria-label', `Delete save ${s.SlotId}`);
            del.onclick = (ev) => {
              ev.stopPropagation();
              if (!confirm('Delete this save? This cannot be undone.')) return;
              tsic.publishMessage('UI.Cmd.Save.DeleteSlot', { SlotId: s.SlotId });
            };

            el.append(thumbWrap, meta, del);
            el.onclick = () => tsic.publishMessage('UI.Cmd.Menu.LoadSlot', { SlotId: s.SlotId });
            host.appendChild(el);
          }
        });
        document.getElementById('btn-back').onclick = () =>
          tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: 'MainMenu' });
      });
    })();
  </script>
</body></html>
