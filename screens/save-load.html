<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="SaveLoad">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>Save / Load</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
</head><body>
  <div class="tsic-modal-scrim tsic-modal-scrim--dim">
    <div class="tsic-panel" style="width:480px;">
      <h2 class="tsic-title">Save / Load</h2>
      <div id="slots" class="tsic-stack tsic-stack--sm" style="max-height:320px;overflow:auto;" data-tsic-focus-group="slot-list"></div>
      <div class="tsic-button-row" data-tsic-focus-group="actions">
        <button class="tsic-button" id="btn-back" style="flex:1;" data-tsic-initial-focus>Back</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if (window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      whenReady(()=>{
        tsic.on('tsic.msg.UI.Save.Slots', (p)=>{
          const host = document.getElementById('slots');
          host.innerHTML = '';
          const slots = (p && p.Slots) || [];
          for (const s of slots) {
            const el = document.createElement('div');
            el.className = 'tsic-panel';
            el.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 12px;';
            el.innerHTML = `<div><b>${s.Label || s.SlotId}</b><br><span style="opacity:0.6;font-size:11px;">${s.TimestampIso}</span></div>`;
            const load = document.createElement('button');
            load.className = 'tsic-button';
            load.textContent = 'Load';
            load.onclick = () => tsic.publishMessage('UI.Cmd.Menu.LoadSlot', { SlotId: s.SlotId });
            el.appendChild(load);
            host.appendChild(el);
          }
        });
        document.getElementById('btn-back').onclick = () =>
          tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: 'MainMenu' });
      });
    })();
  </script>
</body></html>
