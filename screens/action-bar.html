<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="ActionBar">
  <title>Action Bar</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    #ab-root { position: fixed; left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
    #ab-gameplay { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: rgba(0,0,0,0.4); border-radius: 4px; }
    #ab-gameplay.hidden { display: none; }
    #ab-menu { display: flex; flex-direction: row; flex-wrap: wrap; gap: 12px; padding: 8px 10px; background: rgba(0,0,0,0.4); border-radius: 4px; }
    #ab-menu.hidden { display: none; }
    #ab-menu .ab-row { padding: 0; }
    #ab-menu .ab-text { display: flex; align-items: center; }
    #ab-menu .ab-name { font-weight: 500; }
    .ab-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #fff; padding: 2px 0; }
    .ab-row[data-status="blocked"]         { opacity: 0.45; color: #f6c0c0; }
    .ab-row[data-status="cooldown"]        { opacity: 0.85; color: #d4d4d4; filter: saturate(0.55); }
    .ab-row[data-status="single-use-used"] { opacity: 0.35; text-decoration: line-through; }
    .ab-key { position: relative; width: 36px; height: 26px; display: flex; align-items: center; justify-content: center;
              background: var(--tsic-border); border-radius: 3px; font-weight: bold; font-size: 11px; overflow: hidden; }
    .ab-key img { max-width: 22px; max-height: 22px; object-fit: contain; }
    .ab-key-fallback { color: #fff; padding: 0 4px; }
    .ab-cd-sweep { position: absolute; inset: 0; pointer-events: none;
                   background: conic-gradient(rgba(0,0,0,0.7) calc(var(--tsic-cd-percent,0) * 1%), transparent 0);
                   mix-blend-mode: multiply; }
    .ab-text { flex: 1; line-height: 1.15; }
    .ab-name { font-weight: 500; }
    .ab-sub { font-size: 10px; opacity: 0.75; }
  </style>
</head><body>
  <div id="ab-root">
    <div id="ab-gameplay"></div>
    <div id="ab-menu"></div>
  </div>
  <script>
    (function () {
      const MENU_SCREENS = new Set([
        'Inventory', 'Storage', 'Crafting', 'Production', 'Upgrade', 'Teleporter',
        'BossSummoner', 'UniversalStorage', 'Construction', 'Map', 'Settings',
        'PauseMenu', 'SaveLoad', 'Mods', 'Credits', 'NewStore',
      ]);

      const STATUS_LABEL = ['available', 'blocked', 'cooldown', 'single-use-used'];

      let lastAbilities = { Slots: [] };
      let lastMenu      = { Entries: [] };
      let currentMode   = 'MouseAndKeyboard';
      let activeScreen  = null;

      function whenReady(cb) { if (window.tsic) { cb(); return; } setTimeout(() => whenReady(cb), 16); }
      function preferGamepad() { return currentMode === 'Gamepad'; }
      function truncate(s, n) { if (!s) return ''; return s.length > n ? (s.slice(0, n - 1) + '…') : s; }
      function bracketedName(name) {
        if (!name) return '';
        if (name.startsWith('IA_UI_')) return name.slice(6);
        if (name.startsWith('IA_'))    return name.slice(3);
        return name;
      }

      function makeKey(iconUrl, inputName) {
        const key = document.createElement('div');
        key.className = 'ab-key';
        if (iconUrl) {
          const img = document.createElement('img');
          img.src = iconUrl;
          img.alt = inputName || '';
          img.onerror = () => {
            img.replaceWith(Object.assign(document.createElement('span'),
              { className: 'ab-key-fallback', textContent: bracketedName(inputName) }));
          };
          key.appendChild(img);
        } else {
          const fallback = document.createElement('span');
          fallback.className = 'ab-key-fallback';
          fallback.textContent = bracketedName(inputName);
          key.appendChild(fallback);
        }
        return key;
      }

      function renderGameplay() {
        const host = document.getElementById('ab-gameplay');
        host.innerHTML = '';
        const slots = (lastAbilities && lastAbilities.Slots) || [];
        for (const s of slots) {
          if (s.bVisible === false) continue;
          const row = document.createElement('div');
          row.className = 'ab-row';
          row.dataset.status = STATUS_LABEL[s.StatusInt | 0] || 'available';
          row.style.setProperty('--tsic-cd-percent',
            String(Math.max(0, Math.min(100, Math.round((s.CooldownPercent || 0) * 100)))));

          const iconUrl = preferGamepad() ? s.GamepadIconUrl : s.KeyboardIconUrl;
          const key = makeKey(iconUrl, s.InputName);
          if ((s.CooldownPercent || 0) > 0 && (s.CooldownPercent || 0) < 1) {
            const sweep = document.createElement('div');
            sweep.className = 'ab-cd-sweep';
            key.appendChild(sweep);
          }

          const text = document.createElement('div');
          text.className = 'ab-text';
          const name = document.createElement('div');
          name.className = 'ab-name';
          name.textContent = s.AbilityName || bracketedName(s.InputName);
          text.appendChild(name);
          if (s.SubText) {
            const sub = document.createElement('div');
            sub.className = 'ab-sub';
            sub.textContent = truncate(s.SubText, 30);
            text.appendChild(sub);
          }

          row.appendChild(key);
          row.appendChild(text);
          host.appendChild(row);
        }
        applyVisibility();
      }

      function renderMenu() {
        const host = document.getElementById('ab-menu');
        host.innerHTML = '';
        const entries = (lastMenu && lastMenu.Entries) || [];
        for (const e of entries) {
          const row = document.createElement('div');
          row.className = 'ab-row';
          const iconUrl = preferGamepad() ? e.GamepadIconUrl : e.KeyboardIconUrl;
          const key = makeKey(iconUrl, e.ActionName);
          const text = document.createElement('div');
          text.className = 'ab-text';
          const name = document.createElement('div');
          name.className = 'ab-name';
          name.textContent = e.Label || bracketedName(e.ActionName);
          text.appendChild(name);
          row.appendChild(key);
          row.appendChild(text);
          host.appendChild(row);
        }
        applyVisibility();
      }

      function emptyGameplay() {
        return !((lastAbilities.Slots || []).some(s => s.bVisible !== false));
      }
      function emptyMenu() {
        return ((lastMenu.Entries || []).length === 0);
      }
      function applyVisibility() {
        const isMenu = activeScreen && MENU_SCREENS.has(activeScreen);
        document.getElementById('ab-gameplay').classList.toggle('hidden', !!isMenu || emptyGameplay());
        document.getElementById('ab-menu')    .classList.toggle('hidden', !isMenu || emptyMenu());
      }

      whenReady(() => {
        tsic.on('tsic.msg.UI.ActionBar.Abilities', (p) => {
          lastAbilities = p || { Slots: [] };
          renderGameplay();
        });
        tsic.on('tsic.msg.UI.ActionBar.MenuContext', (p) => {
          lastMenu = p || { Entries: [] };
          renderMenu();
        });
        tsic.on('tsic.msg.UI.Screen.Changed', (p) => {
          activeScreen = (p && p.Name) || null;
          applyVisibility();
        });
        tsic.on('tsic.msg.UI.Input.Mode.Changed', (p) => {
          currentMode = (p && p.Mode) || 'MouseAndKeyboard';
          renderGameplay();
          renderMenu();
        });
        // Initial paint in case sticky messages already fired before subscribe.
        renderGameplay();
        renderMenu();
      });
    })();
  </script>
</body></html>
