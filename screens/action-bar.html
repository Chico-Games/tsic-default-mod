<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="ActionBar">
  <title>Action Bar</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <script src="/shared/icons.js" defer></script>
    <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <style>
    /* Two presentation modes share the same publisher + DOM root, but
       render with different layouts:
         - Gameplay group: vertical stack, bottom-right.
         - Menu group: horizontal strip, bottom-centre, sits under whichever
           modal panel is open.
       Both share a magazine-halftone backdrop (.ab-shell base style) —
       same dot grid as the main menu but with darker ink so the strip
       reads as a tight HUD chip over any game scene. */
    html, body { background: transparent; }

    .ab-shell {
      position: fixed;
      bottom: 18px;
      max-width: calc(100vw - 48px);
      /* Light-on-dark: bright text reads cleanly against a dark halftone
         chip so prompts stay legible no matter what's behind the HUD. */
      color: var(--paper-bright);
      pointer-events: none;
      padding: 4px 10px;
      background-color: rgba(18, 14, 10, 0.68);
      background-image:
        radial-gradient(rgba(241, 229, 207, 0.22) 14%, transparent 15%),
        radial-gradient(rgba(241, 229, 207, 0.22) 14%, transparent 15%);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .ab-shell.hidden { display: none; }

    #ab-shell-gameplay { right: 24px; }
    #ab-shell-menu {
      left: 50%;
      transform: translateX(-50%);
    }

    /* Vertical stack, right-justified so keys hug the screen edge. */
    #ab-gameplay {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      /* Generous row spacing so the cooldown ring + label don't crowd
         neighbouring rows. */
      gap: 14px;
      /* Dark halo + thin black shadow keeps bright text crisp against the
         dotted halftone chip. */
      text-shadow:
        0 0 3px rgba(0, 0, 0, 0.85),
        0 0 6px rgba(0, 0, 0, 0.55),
        0 1px 2px rgba(0, 0, 0, 0.55);
    }
    #ab-menu {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #ab-menu::-webkit-scrollbar { display: none; }
    /* applyVisibility() mirrors `.hidden` onto the inner host as well as the
       shell, so consumers (and tests) can still read visibility off
       `#ab-gameplay` / `#ab-menu` directly. */
    #ab-gameplay.hidden, #ab-menu.hidden { display: none; }

    .ab-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: Georgia, "Libre Baskerville", serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--paper-bright);
    }
    .ab-row[data-status="blocked"]         { opacity: 0.55; }
    .ab-row[data-status="cooldown"]        { opacity: 0.75; filter: saturate(0.55); }
    .ab-row[data-status="single-use-used"] { opacity: 0.35; text-decoration: line-through; }

    .ab-key {
      /* No chrome on the key itself — just a 32×32 host for the icon and
         the cooldown ring centred around it. */
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: transparent;
      color: inherit;
      font-family: Georgia, "Libre Baskerville", serif;
      font-size: 13px;
      font-weight: 700;
    }
    .ab-key img { width: 22px; height: 22px; object-fit: contain; }
    .ab-key-fallback { padding: 0 2px; }
    .ab-cd-sweep {
      /* Cooldown ring — a thin white arc that wraps the key and fills
         clockwise from 12 o'clock as the cooldown progresses. Sized 32×32
         and centred on the key so it sits just outside the chip border;
         the radial mask isolates the visible 2px ring band. */
      position: absolute;
      left: 50%; top: 50%;
      width: 32px; height: 32px;
      margin: -16px 0 0 -16px;
      pointer-events: none;
      border-radius: 50%;
      background: conic-gradient(
        rgba(255, 255, 255, 0.92) calc(var(--tsic-cd-percent, 0) * 1%),
        transparent 0
      );
      -webkit-mask: radial-gradient(transparent 11px, #000 12px);
              mask: radial-gradient(transparent 11px, #000 12px);
    }

    .ab-text { display: inline-flex; align-items: baseline; gap: 6px; }
    .ab-name { font-weight: 700; }
    .ab-sub { font-size: 10px; font-weight: 400; opacity: 0.7; letter-spacing: 0.04em; text-transform: none; }

    /* Only the (horizontal) menu group needs separators between rows now —
       the vertical gameplay stack hides them via the rule below. */
    .ab-separator {
      display: inline-block;
      width: 1px;
      height: 16px;
      background: var(--cat-border-strong);
      opacity: 0.45;
    }
    #ab-gameplay .ab-separator { display: none; }
  </style>
</head><body>
  <div id="ab-shell-gameplay" class="ab-shell hidden">
    <div id="ab-gameplay"></div>
  </div>
  <div id="ab-shell-menu" class="ab-shell hidden">
    <div id="ab-menu"></div>
  </div>
  <script>
    (function () {
      const MENU_SCREENS = new Set([
        'Inventory', 'Storage', 'Crafting', 'Production', 'Upgrade', 'Teleporter',
        'BossSummoner', 'UniversalStorage', 'Construction', 'Map', 'Settings',
        'PauseMenu', 'SaveLoad', 'Mods', 'Credits', 'NewStore',
      ]);
      const STATUS_LABEL = ['available', 'blocked', 'cooldown', 'single-use-used'];

      let lastAbilities = { Slots: [] };
      let lastMenu      = { Entries: [] };
      let currentMode   = 'MouseAndKeyboard';
      let activeScreen  = null;

      function preferGamepad() { return currentMode === 'Gamepad'; }
      function truncate(s, n) { if (!s) return ''; return s.length > n ? (s.slice(0, n - 1) + '…') : s; }
      function bracketedName(name) {
        if (!name) return '';
        if (name.startsWith('IA_UI_')) return name.slice(6);
        if (name.startsWith('IA_'))    return name.slice(3);
        return name;
      }

      function makeKey(iconUrl, inputName, keyText) {
        var resolvedUrl = iconUrl;
        if (!resolvedUrl && keyText && window.TSIC && window.TSIC.keyIconUrl) {
          resolvedUrl = TSIC.keyIconUrl(keyText, preferGamepad());
        }
        if (!resolvedUrl && !keyText && !inputName) return null;
        const key = document.createElement('span');
        key.className = 'ab-key';
        if (resolvedUrl) {
          const img = document.createElement('img');
          img.src = resolvedUrl;
          img.alt = keyText || inputName || '';
          img.onerror = () => {
            var svgUrl = (window.TSIC && window.TSIC.keyIconUrl) ? TSIC.keyIconUrl(keyText, preferGamepad()) : '';
            if (svgUrl && svgUrl !== resolvedUrl) {
              img.onerror = () => {
                img.replaceWith(Object.assign(document.createElement('span'),
                  { className: 'ab-key-fallback', textContent: keyText || bracketedName(inputName) }));
              };
              img.src = svgUrl;
            } else {
              img.replaceWith(Object.assign(document.createElement('span'),
                { className: 'ab-key-fallback', textContent: keyText || bracketedName(inputName) }));
            }
          };
          key.appendChild(img);
        } else {
          const fallback = document.createElement('span');
          fallback.className = 'ab-key-fallback';
          fallback.textContent = keyText || bracketedName(inputName);
          key.appendChild(fallback);
        }
        return key;
      }

      function renderRow(iconUrl, inputName, name, sub, statusInt, cooldownPct, keyText) {
        const row = document.createElement('span');
        row.className = 'ab-row';
        if (statusInt !== undefined) row.dataset.status = STATUS_LABEL[statusInt | 0] || 'available';
        if (cooldownPct !== undefined) {
            row.style.setProperty('--tsic-cd-percent',
                String(Math.max(0, Math.min(100, Math.round((cooldownPct || 0) * 100)))));
        }
        const txt = document.createElement('span');
        txt.className = 'ab-text';
        const nm = document.createElement('span');
        nm.className = 'ab-name';
        nm.textContent = name || bracketedName(inputName);
        txt.appendChild(nm);
        if (sub) {
            const sb = document.createElement('span');
            sb.className = 'ab-sub';
            sb.textContent = truncate(sub, 30);
            txt.appendChild(sb);
        }
        row.appendChild(txt);
        const key = makeKey(iconUrl, inputName, keyText);
        if (key) {
            if (cooldownPct !== undefined && cooldownPct > 0 && cooldownPct < 1) {
                const sweep = document.createElement('div');
                sweep.className = 'ab-cd-sweep';
                key.appendChild(sweep);
            }
            row.appendChild(key);
        }
        return row;
      }

      function renderGameplay() {
        const host = document.getElementById('ab-gameplay');
        host.innerHTML = '';
        const slots = (lastAbilities && lastAbilities.Slots) || [];
        let first = true;
        for (const s of slots) {
          if (s.bVisible === false) continue;
          if (!first) {
              const sep = document.createElement('span'); sep.className = 'ab-separator'; host.appendChild(sep);
          }
          first = false;
          const iconUrl = preferGamepad() ? s.GamepadIconUrl : s.KeyboardIconUrl;
          const keyText = preferGamepad() ? s.GamepadKeyText : s.KeyboardKeyText;
          host.appendChild(renderRow(iconUrl, s.InputName, s.AbilityName, s.SubText, s.StatusInt, s.CooldownPercent, keyText));
        }
        applyVisibility();
      }

      function renderMenu() {
        const host = document.getElementById('ab-menu');
        host.innerHTML = '';
        const entries = (lastMenu && lastMenu.Entries) || [];
        let first = true;
        for (const e of entries) {
          if (!first) {
              const sep = document.createElement('span'); sep.className = 'ab-separator'; host.appendChild(sep);
          }
          first = false;
          const iconUrl = preferGamepad() ? e.GamepadIconUrl : e.KeyboardIconUrl;
          const keyText = preferGamepad() ? e.GamepadKeyText : e.KeyboardKeyText;
          host.appendChild(renderRow(iconUrl, e.ActionName, e.Label, undefined, undefined, undefined, keyText));
        }
        applyVisibility();
      }

      function emptyGameplay() { return !((lastAbilities.Slots || []).some(s => s.bVisible !== false)); }
      function emptyMenu()     { return ((lastMenu.Entries || []).length === 0); }

      function applyVisibility() {
        const isMenu = activeScreen && MENU_SCREENS.has(activeScreen);
        const gameHidden = !!isMenu || emptyGameplay();
        const menuHidden = !isMenu  || emptyMenu();
        document.getElementById('ab-shell-gameplay').classList.toggle('hidden', gameHidden);
        document.getElementById('ab-shell-menu')    .classList.toggle('hidden', menuHidden);
        // Mirror onto the inner host: keeps `#ab-gameplay.hidden` /
        // `#ab-menu.hidden` working as a visibility signal for tests and any
        // external consumer that doesn't know about the shell wrappers.
        document.getElementById('ab-gameplay').classList.toggle('hidden', gameHidden);
        document.getElementById('ab-menu')    .classList.toggle('hidden', menuHidden);
      }

      (function boot() {
        if (!window.tsic || typeof tsic.bootMenu !== 'function') { setTimeout(boot, 16); return; }
        tsic.bootMenu(function (ctx) {
          ctx.on('tsic.msg.UI.ActionBar.Abilities', (p) => { lastAbilities = p || { Slots: [] };   renderGameplay(); });
          ctx.on('tsic.msg.UI.ActionBar.MenuContext', (p) => { lastMenu     = p || { Entries: [] }; renderMenu(); });
          ctx.on('tsic.msg.UI.Screen.Changed', (p) => { activeScreen = (p && p.Name) || null; applyVisibility(); });
          ctx.on('tsic.msg.UI.Input.Mode.Changed', (p) => {
            currentMode = (p && p.Mode) || 'MouseAndKeyboard';
            renderGameplay(); renderMenu();
          });
          // Initial paint in case sticky messages already fired before subscribe.
          renderGameplay();
          renderMenu();
        }, { escape: false, closeButton: false });
      })();
    })();
  </script>
</body></html>
