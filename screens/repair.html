<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Repair">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[{"ActionName":"IA_UI_ConfirmAccept","Label":"Repair","Priority":10}]'>
  <title>Repair</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <script src="/shared/catalog.js" defer></script>
  <style>
    .repair-row { display:flex; align-items:center; gap:8px; padding:6px 8px; background:rgba(241,229,207,0.55); border:1px solid var(--tsic-border); }
    .repair-row .icon { width:28px; height:28px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .repair-row .icon img { width:100%; height:100%; object-fit:contain; }
  </style>
</head><body>
  <div id="repair-root" class="tsic-modal-scrim">
    <div id="repair-panel" class="tsic-panel tsic-panel--screen">
      <h2 class="tsic-title" style="margin:0 0 8px;">Repair</h2>
      <div class="tsic-eyebrow">Items needing repair</div>
      <div id="repair-list" class="tsic-list-pane" style="flex:1 1 auto;"></div>
      <div class="tsic-close-row">
        <button class="tsic-button" id="btn-close">Close</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      let opened = null;

      function render() {
        const host = document.getElementById('repair-list');
        host.innerHTML = '';
        const items = (opened && opened.Items) || [];
        if (items.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'tsic-empty';
          empty.textContent = 'No items here need repair.';
          host.appendChild(empty);
          return;
        }
        for (const it of items) {
          const row = document.createElement('div');
          row.className = 'repair-row';
          const iconWrap = document.createElement('div');
          iconWrap.className = 'icon';
          if (it.ItemId) {
            const img = document.createElement('img');
            img.src = `tex://item-icon/${encodeURIComponent(it.ItemId)}`;
            img.onerror = () => { img.style.visibility = 'hidden'; };
            iconWrap.appendChild(img);
          }
          const label = document.createElement('div');
          label.style.flex = '1';
          label.textContent = (window.tsic && window.tsic.itemName) ? window.tsic.itemName(it.ItemId) : it.ItemId;
          const btn = document.createElement('button');
          btn.className = 'tsic-button';
          btn.textContent = 'Repair';
          btn.onclick = () => tsic.publishMessage('UI.Cmd.Recipe.Start', { Kind: 'Repair', RecipeId: it.ItemId });
          row.appendChild(iconWrap);
          row.appendChild(label);
          row.appendChild(btn);
          host.appendChild(row);
        }
      }

      whenReady(()=>{
        // Reuse UI.Recipe.StationOpened envelope (Kind="Repair") so we don't need
        // a new C++ message; the legacy URepairStationScreen extends EntityHelperWidget
        // and the helper plumbing already routes through the recipe-family channel.
        tsic.on('tsic.msg.UI.Recipe.StationOpened', (p) => {
          if (!p || p.Kind !== 'Repair') return;
          opened = p; render();
        });
        window.addEventListener('tsic-item-catalog', render);
        document.getElementById('btn-close').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.Resume', {});
      });
    })();
  </script>
</body></html>
