<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Repair">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[{"ActionName":"IA_UI_ConfirmAccept","Label":"Repair","Priority":10}]'>
  <title>Repair</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <script src="/shared/catalog.js" defer></script>
  <style>
    /* Override tsic-row-button's panel-paper bg with the existing translucent
       look so the repair list keeps its tighter visual weight. */
    .repair-row { gap:8px; padding:6px 8px; background:rgba(241,229,207,0.55); }
    .repair-row:hover { background:rgba(241,229,207,0.85); }
    .repair-row .icon { width:28px; height:28px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .repair-row .icon img { width:100%; height:100%; object-fit:contain; }
    .repair-row .label { flex:1; }
    .repair-row .pristine-tag { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--cat-ink-soft); }
  </style>
</head><body>
  <div id="repair-root" class="tsic-modal-scrim">
    <div id="repair-panel" class="tsic-panel tsic-panel--screen">
      <h2 class="tsic-title" style="margin:0 0 8px;">Repair</h2>
      <div class="tsic-eyebrow">Items needing repair</div>
      <div id="repair-list" class="tsic-list-pane" style="flex:1 1 auto;"></div>
      <div class="tsic-close-row">
        <button class="tsic-button" id="btn-close" data-tsic-initial-focus>Close</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      let opened = null;
      let stationId = null;

      function render() {
        const host = document.getElementById('repair-list');
        host.innerHTML = '';
        // UI.Recipe.StationOpened publishes `Recipes` (same envelope used by
        // crafting / upgrade). Each entry has RecipeId + Durability/MaxDurability.
        const recipes = (opened && opened.Recipes) || [];
        if (recipes.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'tsic-empty';
          empty.textContent = 'No items here need repair.';
          host.appendChild(empty);
          return;
        }
        for (const r of recipes) {
          const itemId = r.RecipeId;
          const dur = (typeof r.Durability === 'number') ? r.Durability : 1;
          const max = (typeof r.MaxDurability === 'number' && r.MaxDurability > 0) ? r.MaxDurability : 1;
          const pct = Math.max(0, Math.min(1, dur / max));
          const pristine = pct >= 0.999;
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'tsic-row-button repair-row';
          row.disabled = pristine;
          const iconWrap = document.createElement('div');
          iconWrap.className = 'icon';
          if (itemId) {
            const img = document.createElement('img');
            img.src = `tex://item-icon/${encodeURIComponent(itemId)}`;
            img.onerror = () => { img.style.visibility = 'hidden'; };
            iconWrap.appendChild(img);
          }
          const label = document.createElement('div');
          label.className = 'label';
          const name = (window.tsic && window.tsic.itemName) ? window.tsic.itemName(itemId) : (r.Name || itemId);
          label.textContent = `${name} — ${Math.round(pct * 100)}%`;
          row.appendChild(iconWrap);
          row.appendChild(label);
          if (pristine) {
            const tag = document.createElement('span');
            tag.className = 'pristine-tag';
            tag.textContent = 'Pristine';
            row.appendChild(tag);
          }
          row.onclick = () => {
            if (pristine) return;
            tsic.publishMessage('UI.Cmd.Recipe.Start', { Kind: 'Repair', StationId: stationId, RecipeId: itemId, Count: 1 });
          };
          host.appendChild(row);
        }
      }

      whenReady(()=>{
        // Reuse UI.Recipe.StationOpened envelope (Kind="Repair") so we don't need
        // a new C++ message; the legacy URepairStationScreen extends EntityHelperWidget
        // and the helper plumbing already routes through the recipe-family channel.
        tsic.on('tsic.msg.UI.Recipe.StationOpened', (p) => {
          if (!p || p.Kind !== 'Repair') return;
          opened = p; stationId = p.StationId; render();
        });
        window.addEventListener('tsic-item-catalog', render);
        document.getElementById('btn-close').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.Resume', {});
      });
    })();
  </script>
</body></html>
