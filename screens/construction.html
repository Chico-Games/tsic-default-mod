<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Construction">
  <meta name="tsic-input-mode" content="InputMode.Construction">
  <title>Construction</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
</head><body>
  <!-- Sidebar of constructable items (left edge) -->
  <div id="sidebar" class="tsic-panel" style="position:fixed;left:24px;top:24px;bottom:24px;width:280px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;">
    <h2 style="margin:0 0 8px;letter-spacing:3px;font-size:14px;">BUILD</h2>
    <div id="items" style="display:flex;flex-direction:column;gap:4px;"></div>
  </div>

  <!-- Preview status pill (top-center) -->
  <div id="preview-pill" class="tsic-panel" style="position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:6px 16px;font-size:12px;letter-spacing:2px;display:none;">
    <span id="preview-text">—</span>
  </div>

  <!-- Action buttons (bottom-center) -->
  <div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;">
    <button class="tsic-button" id="btn-confirm">Confirm</button>
    <button class="tsic-button" id="btn-cancel">Cancel</button>
    <button class="tsic-button" id="btn-deconstruct">Deconstruct</button>
  </div>

  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }

      function renderItems(items) {
        const host = document.getElementById('items');
        host.innerHTML = '';
        for (const it of (items || [])) {
          const row = document.createElement('button');
          row.className = 'tsic-button';
          row.style.cssText = 'display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:6px 10px;text-align:left;';
          if (it.IconUrl) {
            const img = document.createElement('img');
            img.src = it.IconUrl;
            img.style.cssText = 'width:24px;height:24px;object-fit:contain;';
            row.appendChild(img);
          }
          const label = document.createElement('span');
          label.textContent = it.Name || it.EntityDefId;
          row.appendChild(label);
          row.onclick = () => tsic.publishMessage('UI.Cmd.Construction.Begin', { EntityDefId: it.EntityDefId });
          host.appendChild(row);
        }
      }

      function renderPreview(p) {
        const pill = document.getElementById('preview-pill');
        const text = document.getElementById('preview-text');
        if (!p) {
          pill.style.display = 'none';
          return;
        }
        pill.style.display = 'block';
        if (p.bCanPlace) {
          text.textContent = 'READY';
          pill.style.color = '#7fff9a';
          pill.style.borderColor = 'rgba(127,255,154,0.45)';
        } else {
          text.textContent = (p.FailureReason || 'BLOCKED').toUpperCase();
          pill.style.color = '#ff7a7a';
          pill.style.borderColor = 'rgba(255,122,122,0.45)';
        }
      }

      whenReady(()=>{
        tsic.on('tsic.msg.UI.Construction.Available', (p) => renderItems(p && p.Items));
        tsic.on('tsic.msg.UI.Construction.PreviewState', (p) => renderPreview(p));

        document.getElementById('btn-confirm').onclick = () =>
          tsic.publishMessage('UI.Cmd.Construction.Confirm', {});
        document.getElementById('btn-cancel').onclick = () =>
          tsic.publishMessage('UI.Cmd.Construction.Cancel', {});
        // v1: Deconstruct without a UI target — gameplay layer feeds the entity id.
        // The publish below is a no-op-by-construction (EntityId=0). The actual
        // deconstruct flow today is driven by the look-at trace in gameplay code;
        // wiring a "Deconstruct mode" toggle that surfaces target ids to JS is a
        // follow-up once UI.Construction.GraphChanged is consumed by Map.
        document.getElementById('btn-deconstruct').onclick = () =>
          tsic.publishMessage('UI.Cmd.Construction.Deconstruct', { EntityId: 0 });
      });
    })();
  </script>
</body></html>
