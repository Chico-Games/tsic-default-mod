<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Interaction">
  <title>Interaction</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    #wrap { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:380px; }
    .row { display:flex; align-items:center; gap:8px; justify-content:flex-start; padding:8px 12px; text-align:left; width:100%; }
    .pri { border-color: rgba(127,255,154,0.45); }
    .tag { font-size:10px; letter-spacing:2px; opacity:0.7; margin-left:auto; }
  </style>
</head><body>
  <div id="wrap" class="tsic-panel">
    <h2 style="margin:0 0 12px;letter-spacing:3px;font-size:14px;">INTERACT</h2>
    <div id="rows" style="display:flex;flex-direction:column;gap:6px;"></div>
    <div id="empty" style="opacity:0.6;padding:8px 0;display:none;">No targets in focus.</div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }

      function render(p) {
        const host = document.getElementById('rows');
        const empty = document.getElementById('empty');
        host.innerHTML = '';
        const targets = (p && p.Targets) || [];
        if (targets.length === 0) {
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';
        for (const t of targets) {
          const row = document.createElement('button');
          row.className = 'tsic-button row' + (t.bIsPrimary ? ' pri' : '');
          const label = document.createElement('span');
          label.textContent = t.Label || ('Entity ' + t.EntityId);
          row.appendChild(label);
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = t.bIsPrimary ? 'PRIMARY' : 'ALT';
          row.appendChild(tag);
          // User explicitly chose from the menu, so always send bPrimary=false
          // unless this is the primary target itself; spec says always false.
          row.onclick = () => tsic.publishMessage('UI.Cmd.Interaction.Activate', {
            EntityId: t.EntityId|0,
            OptionId: '',
            bPrimary: false,
          });
          host.appendChild(row);
        }
      }

      whenReady(()=>{
        tsic.on('tsic.msg.UI.Interaction.Targets', (p) => render(p));
      });
    })();
  </script>
</body></html>
