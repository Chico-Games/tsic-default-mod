<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Interaction">
  <meta name="tsic-focus" content="enabled">
  <title>Interaction</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
    <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    #wrap { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:420px; }
    .group h3 { letter-spacing: 3px; color:rgba(37,33,25,0.65); font-size: 11px; margin: 12px 0 6px; }
    .row { display:flex; align-items:center; gap:8px; padding:8px 12px; text-align:left; width:100%; }
    .key  { width:32px; height:24px; display:flex; align-items:center; justify-content:center; background:var(--tsic-border); border-radius:3px; font-weight:bold; font-size:11px; }
    .label{ flex:1; }
  </style>
</head><body>
  <div id="wrap" class="tsic-panel">
    <h2 class="tsic-title tsic-title--sm">Interact</h2>
    <div class="group" id="g-targets"><div id="rows" class="tsic-stack tsic-stack--sm"></div></div>
    <div id="empty" class="tsic-empty" style="display:none;">No targets in focus.</div>
  </div>
  <script>
    (function boot(){
      if(!window.tsic){ setTimeout(boot,16); return; }

      function makeRow(t) {
        const row = document.createElement('button');
        row.className = 'tsic-button row';
        const key = document.createElement('span');
        key.className = 'key';
        key.textContent = 'E';
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = t.Label || ('Entity ' + t.EntityId);
        row.appendChild(key);
        row.appendChild(label);
        row.onclick = () => tsic.publishMessage('UI.Cmd.Interaction.Activate', {
          EntityId: t.EntityId | 0,
          OptionId: '',
        });
        return row;
      }

      function render(p) {
        const host = document.getElementById('rows');
        const g = document.getElementById('g-targets');
        const empty = document.getElementById('empty');
        host.innerHTML = '';
        const targets = (p && p.Targets) || [];
        if (targets.length === 0) { empty.style.display = 'block'; g.style.display = 'none'; return; }
        empty.style.display = 'none';
        g.style.display = '';
        let firstRow = null;
        for (const t of targets) {
          const row = makeRow(t);
          if (!firstRow) firstRow = row;
          host.appendChild(row);
        }
        // Anchor initial focus on the first rendered row.
        if (firstRow) firstRow.setAttribute('data-tsic-initial-focus', '');
      }

      tsic.on('tsic.msg.UI.Interaction.Targets', (p) => render(p));
    })();
  </script>
</body></html>
