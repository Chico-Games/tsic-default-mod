<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="HealthBar">
  <title>Health</title>
  <link rel="stylesheet" href="/shared/base.css">
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud-liquid-bar.js"></script>
  <style> html, body { background: transparent; margin: 0; pointer-events: none; } </style>
</head><body>
  <!-- Liquid blood vial — fills bottom-up, wavy surface, damage trail + side spill. -->
  <div id="vial" style="position:fixed; left:48px; bottom:64px; width:54px; --vial-h:248px;"></div>
  <script>
    (function boot() {
      if (!window.TSICLiquidBar) { setTimeout(boot, 16); return; }
      TSICLiquidBar.mount(document.getElementById('vial'), { channel: 'Health', label: 'Health' });
    })();
  </script>
</body></html>
