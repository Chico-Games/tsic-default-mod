<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="HealthBar">
  <title>Health</title>
  <link rel="stylesheet" href="/shared/base.css">
  <script src="/shared/router.js" defer></script>
  <style>
    #wrap {
      position: fixed; left: 24px; bottom: 60px;
      width: 240px; height: 18px;
      border: 1px solid rgba(184,170,145,0.45);
      background: rgba(241,229,207,0.88);
      border-radius: 3px; overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #damage-fill, #health-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
    }
    #damage-fill { background: #6b1010; width: 100%; }
    #health-fill { background: #ce2424; width: 100%; transition: width 0.05s linear; }
    #numbers {
      position: absolute; left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      text-align: center; font-size: 12px; font-weight: 700;
      color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.75);
    }
  </style>
</head><body>
  <div id="wrap">
    <div id="damage-fill"></div>
    <div id="health-fill"></div>
    <div id="numbers">— / —</div>
  </div>
  <script>
    (function () {
      const DAMAGE_DELAY = 2.0;
      const DAMAGE_INTERP_FRAC = 0.2;

      let current = 1, max = 1;
      let healthN = 1, damageN = 1;
      let lastDamageTime = -1e9;

      function whenReady(cb) { if (window.tsic) { cb(); return; } setTimeout(() => whenReady(cb), 16); }

      function applyAttr(p) {
        if (!p || p.Channel !== 'Health') return;
        current = Number(p.Current) || 0;
        max     = Number(p.Max) || 1;
      }

      function onDamage(p) {
        if (!p) return;
        lastDamageTime = performance.now() / 1000;
      }

      let last = performance.now() / 1000;
      function frame() {
        const now = performance.now() / 1000;
        const dt = Math.max(0, now - last);
        last = now;

        const target = max > 0 ? Math.max(0, Math.min(1, current / max)) : 0;
        if (target > healthN) damageN = Math.max(damageN, target);
        healthN = target;

        if ((now - lastDamageTime) >= DAMAGE_DELAY) {
          const step = DAMAGE_INTERP_FRAC * dt;
          if (damageN > healthN) damageN = Math.max(healthN, damageN - step);
        }
        if (damageN < healthN) damageN = healthN;

        const dEl = document.getElementById('damage-fill');
        const hEl = document.getElementById('health-fill');
        const nEl = document.getElementById('numbers');
        if (dEl) dEl.style.width = (damageN * 100).toFixed(1) + '%';
        if (hEl) hEl.style.width = (healthN * 100).toFixed(1) + '%';
        if (nEl) nEl.textContent = Math.round(current) + ' / ' + Math.round(max);
        requestAnimationFrame(frame);
      }

      whenReady(() => {
        tsic.on('tsic.msg.UI.Player.Attribute', applyAttr);
        tsic.on('tsic.msg.Message.DamageEvent', onDamage);
        requestAnimationFrame(frame);
      });
    })();
  </script>
</body></html>
