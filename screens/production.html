<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Production">
  <title>Production</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
</head><body>
  <div id="modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;">
    <div class="tsic-panel" style="width:520px;max-height:80vh;overflow:auto;">
      <h2 style="margin:0 0 12px;letter-spacing:3px;">PRODUCTION</h2>
      <div id="progress-row" style="margin-bottom:12px;display:none;">
        <div style="font-size:11px;opacity:0.7;margin-bottom:4px;" id="progress-label">—</div>
        <div style="height:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);">
          <div id="progress-bar" style="height:100%;width:0%;background:#7fd4ff;"></div>
        </div>
      </div>
      <div id="recipes" style="display:flex;flex-direction:column;gap:6px;"></div>
      <button class="tsic-button" id="btn-close" style="margin-top:12px;">Close</button>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      let stationId = null;
      whenReady(()=>{
        tsic.on('tsic.msg.UI.Recipe.StationOpened', (p) => {
          if (!p || p.Kind !== 'Production') return;
          stationId = p.StationId;
          const host = document.getElementById('recipes');
          host.innerHTML = '';
          for (const r of (p.Recipes || [])) {
            const row = document.createElement('div');
            row.className = 'tsic-panel';
            row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:8px 12px;';
            const ing = (r.Ingredients || []).map(i => i.ItemId + ' x' + i.Count).join(', ');
            row.innerHTML = `<div><b>${r.Name || r.RecipeId}</b><br><span style="opacity:0.6;font-size:11px;">${ing}</span></div>`;
            const btn = document.createElement('button');
            btn.className = 'tsic-button';
            btn.textContent = 'Queue';
            btn.onclick = () => tsic.publishMessage('UI.Cmd.Recipe.Start', { Kind: 'Production', StationId: stationId, RecipeId: r.RecipeId, Count: 1 });
            row.appendChild(btn);
            host.appendChild(row);
          }
        });
        tsic.on('tsic.msg.UI.Recipe.Progress', (p) => {
          if (!p || p.Kind !== 'Production') return;
          if (stationId && p.StationId && p.StationId !== stationId) return;
          const row = document.getElementById('progress-row');
          const bar = document.getElementById('progress-bar');
          const label = document.getElementById('progress-label');
          const pct = Math.max(0, Math.min(1, Number(p.Progress) || 0));
          if (pct > 0 && p.ActiveRecipeId) {
            row.style.display = 'block';
            bar.style.width = (pct * 100).toFixed(1) + '%';
            label.textContent = p.ActiveRecipeId;
          } else {
            row.style.display = 'none';
          }
        });
        document.getElementById('btn-close').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.Resume', {});
      });
    })();
  </script>
</body></html>
