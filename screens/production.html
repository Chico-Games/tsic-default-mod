<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Production">
  <meta name="tsic-input-mode" content="InputMode.Menu.Production">
  <title>Production</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <script src="/shared/catalog.js" defer></script>
  <script src="/shared/recipe-info.js" defer></script>
  <style>
    #p-root { position:fixed; inset:0; background: rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; }
    #p-panel { width: 880px; max-height: 80vh; display:grid; grid-template-columns: 240px 220px 1fr; gap:12px; }
    #p-list, #p-queue { display:flex; flex-direction:column; gap:4px; max-height:520px; overflow-y:auto; }
    .p-row { display:flex; align-items:center; gap:8px; padding:6px 8px; background: rgba(255,255,255,0.04); border:1px solid var(--tsic-border); cursor:pointer; }
    .p-row.selected { background: var(--tsic-accent-dim); }
    .p-row.locked { opacity:0.45; }
    .p-row img { width:24px; height:24px; object-fit:contain; }
    .q-entry { padding:6px; background: rgba(255,255,255,0.04); border:1px solid var(--tsic-border); }
    .q-bar { height:6px; background: rgba(255,255,255,0.08); margin-top:4px; }
    .q-bar > div { height:100%; background:#7fd4ff; transition: width 0.15s; }
    .q-bar.active > div { background:#7fffae; }
    #p-info { padding:10px; background: rgba(0,0,0,0.4); border:1px solid var(--tsic-border); }
    #p-add { width:100%; margin-top:12px; padding:8px; }
    #p-add:disabled { opacity:0.4; cursor:not-allowed; }
    #p-throb { display:none; font-size:10px; opacity:0.6; letter-spacing:2px; }
    #p-throb.on { display:block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity:0.6; } 50% { opacity:1.0; } }
  </style>
</head><body>
<div id="p-root">
  <div id="p-panel" class="tsic-panel">
    <h2 style="grid-column: 1 / 4; margin:0;letter-spacing:3px;">PRODUCTION</h2>
    <div id="p-list"></div>
    <div>
      <div id="p-throb">PRODUCING…</div>
      <div id="p-queue"></div>
    </div>
    <div>
      <div id="p-info"></div>
      <button id="p-add" class="tsic-button" disabled>Add to Queue</button>
    </div>
    <div style="grid-column: 1 / 4; text-align:right;">
      <button class="tsic-button" id="btn-close">Close (Esc)</button>
    </div>
  </div>
</div>
<script>
(function(){
    let stationId = null;
    let lastStation = null;
    let queue = [];
    let materialCounts = {};
    let selectedRecipeId = null;

    function whenReady(cb){ if(window.tsic && window.TSICRecipeInfo){cb();return;} setTimeout(()=>whenReady(cb),16); }

    function renderList() {
        const host = document.getElementById('p-list');
        host.innerHTML = '';
        if (!lastStation) return;
        const cat = window.tsic.itemCatalog || {};
        for (const r of (lastStation.Recipes || [])) {
            const locked = !r.bDiscovered || !r.bStationLevelSufficient;
            const row = document.createElement('div');
            row.className = 'p-row' + (selectedRecipeId === r.RecipeId ? ' selected' : '') + (locked ? ' locked' : '');
            const img = document.createElement('img');
            img.src = r.bDiscovered ? `tex://item-icon/${encodeURIComponent((r.Outputs[0]||{}).ItemId||'')}` : '';
            row.appendChild(img);
            const name = document.createElement('div');
            name.style.flex = '1';
            name.textContent = r.bDiscovered ? ((cat[(r.Outputs[0]||{}).ItemId] || {}).Name || r.Name) : '???';
            row.appendChild(name);
            row.addEventListener('click', () => { selectedRecipeId = r.RecipeId; renderAll(); });
            host.appendChild(row);
        }
    }
    function renderQueue() {
        const host = document.getElementById('p-queue');
        host.innerHTML = '';
        const cat = window.tsic.itemCatalog || {};
        const recipesById = {};
        for (const r of ((lastStation && lastStation.Recipes) || [])) recipesById[r.RecipeId] = r;
        for (const e of queue) {
            const div = document.createElement('div');
            div.className = 'q-entry';
            const r = recipesById[e.RecipeId];
            const itemId = r ? (r.Outputs[0] || {}).ItemId : '';
            const name = (cat[itemId] || {}).Name || e.RecipeId;
            div.innerHTML = `<div>${e.QueueIndex+1}. ${name}</div>`;
            const bar = document.createElement('div');
            bar.className = 'q-bar' + (e.bIsActive ? ' active' : '');
            const inner = document.createElement('div');
            inner.style.width = (Math.max(0, Math.min(1, e.Progress || 0)) * 100).toFixed(1) + '%';
            bar.appendChild(inner);
            div.appendChild(bar);
            const btn = document.createElement('button');
            btn.className = 'tsic-button';
            btn.textContent = 'Cancel';
            btn.style.cssText = 'margin-top:4px;width:100%;';
            btn.addEventListener('click', () => {
                tsic.publishMessage('UI.Cmd.Recipe.Cancel', { Kind: 'Production', StationId: stationId, QueueIndex: e.QueueIndex });
                tsic.publishMessage('UI.Cmd.Sound.Play', { SoundKey: 'Recipe.Removed', VolumeScale: 1.0 });
            });
            div.appendChild(btn);
            host.appendChild(div);
        }
        const throb = document.getElementById('p-throb');
        throb.className = queue.some(e => e.bIsActive) ? 'on' : '';
    }
    function renderInfo() {
        const recipe = lastStation && (lastStation.Recipes || []).find(r => r.RecipeId === selectedRecipeId);
        window.TSICRecipeInfo.render(document.getElementById('p-info'), recipe, materialCounts);
        const btn = document.getElementById('p-add');
        btn.disabled = !window.TSICRecipeInfo.canCraft(recipe, materialCounts);
    }
    function renderAll() { renderList(); renderQueue(); renderInfo(); }

    whenReady(() => {
        tsic.on('tsic.msg.UI.Recipe.StationOpened', (p) => {
            if (!p || p.Kind !== 'Production') return;
            stationId = p.StationId;
            lastStation = p;
            materialCounts = p.MaterialCounts || {};
            if (!selectedRecipeId && (p.Recipes || []).length > 0) selectedRecipeId = p.Recipes[0].RecipeId;
            renderAll();
        });
        tsic.on('tsic.msg.UI.Recipe.QueueChanged', (p) => {
            if (!p || p.Kind !== 'Production') return;
            if (stationId && p.StationId !== stationId) return;
            queue = p.Entries || [];
            renderQueue();
        });
        tsic.on('tsic.msg.UI.Recipe.Progress', (p) => {
            if (!p || p.Kind !== 'Production') return;
            if (stationId && p.StationId !== stationId) return;
            for (const e of queue) if (e.bIsActive) { e.Progress = p.Progress || 0; }
            renderQueue();
        });
        tsic.on('tsic.msg.UI.Recipe.Completed', (p) => {
            if (p && p.Kind === 'Production') {
                tsic.publishMessage('UI.Cmd.Sound.Play', { SoundKey: 'Recipe.Completed', VolumeScale: 1.0 });
            }
        });
        window.addEventListener('tsic-item-catalog', renderAll);

        document.getElementById('p-add').addEventListener('click', () => {
            const recipe = lastStation && (lastStation.Recipes || []).find(r => r.RecipeId === selectedRecipeId);
            if (!recipe || !window.TSICRecipeInfo.canCraft(recipe, materialCounts)) return;
            tsic.publishMessage('UI.Cmd.Recipe.Start', { Kind: 'Production', StationId: stationId, RecipeId: recipe.RecipeId, Count: 1 });
            tsic.publishMessage('UI.Cmd.Sound.Play', { SoundKey: 'Recipe.Added', VolumeScale: 1.0 });
        });
        document.getElementById('btn-close').addEventListener('click', () => {
            tsic.publishMessage('UI.Cmd.Pause.Resume', {});
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') document.getElementById('btn-close').click();
        });
    });
})();
</script>
</body></html>
