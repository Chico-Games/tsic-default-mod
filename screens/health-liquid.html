<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="HealthLiquid">
  <title>Health — Liquid</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/router.js" defer></script>
  <style>
    /* Liquid / ink-fill health vial — a stylised "specimen vial" of blood that
       fills bottom-up behind glass, with a scrolling wavy surface, foam crest,
       slosh on damage, falling droplets, a colour ramp (crimson → venous dark)
       and a danger pulse when low. HUD overlay: transparent, no pointer events. */
    html, body { background: transparent; margin: 0; pointer-events: none; }

    .vial {
      position: fixed; left: 48px; bottom: 64px;
      width: 54px;
      font-family: Georgia, "Libre Baskerville", serif;
      --hp: #cf2233;          /* current blood; set per-frame by JS (colour ramp) */
      --trail: #4f0a0f;       /* lagging damage-trail blood (darker) */
      --level: 72%;           /* current liquid height, set by JS */
      --trail-level: 72%;     /* lagging trail height, driven by rAF */
    }

    /* "HEALTH" runs vertically, up the length of the vial. */
    .label {
      position: absolute; left: 50%; top: 50%; z-index: 2;
      transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap;
      font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
      font-weight: 700; color: #f0e7d4;
      text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.7);
    }

    .glass {
      position: relative; height: 248px; border-radius: 13px; overflow: hidden;
      background:
        linear-gradient(180deg, rgba(58,40,34,0.55), rgba(14,9,8,0.62));
      border: 1px solid rgba(184,170,145,0.55);
      box-shadow:
        inset 0 1px 0 rgba(255,250,240,0.18),
        inset 0 0 18px rgba(0,0,0,0.55),
        0 3px 10px rgba(0,0,0,0.45);
    }

    /* Sideways: this rotated wrapper turns the (vertical) bottom-up liquid
       engine into a horizontal fill running along the tube's length — reuses the
       wave/trail logic unchanged; only the surface line becomes vertical. The
       glass, ticks and text stay upright (outside this wrapper). */
    .rot {
      position: absolute; top: 0; left: 0;
      width: var(--thick); height: var(--len);
      transform: translateX(var(--len)) rotate(90deg);
      transform-origin: top left;
    }

    /* Lagging "damage trail" — darker blood that lingers at the previous level
       then drains down to meet the current level (driven by rAF, no transition),
       so recent damage reads as a dark band sitting above the lighter current
       blood and the current surface is unmistakable at a glance. */
    .trail {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: var(--trail-level);
      background: linear-gradient(180deg, var(--trail), color-mix(in srgb, var(--trail) 65%, #000));
    }

    /* The body of CURRENT liquid (lighter) — fills from the bottom. Slosh easing
       overshoots a touch on change so it reads as fluid settling. Sits in front
       of the trail. */
    .liquid {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: var(--level);
      background: linear-gradient(180deg, var(--hp), color-mix(in srgb, var(--hp) 55%, #1a0606));
      transition: height 480ms cubic-bezier(0.34, 1.42, 0.5, 1),
                  background 400ms linear;
      box-shadow: inset 0 8px 14px rgba(0,0,0,0.22);
    }

    /* Wavy surface bands sit just above the flat liquid top. Each is a strip of
       liquid colour, MASKED by a scrolling sine tile so its TOP edge is wavy
       (and stays the ramped colour). Two coloured layers + a white foam crest. */
    .surface {
      position: absolute; left: -20px; right: -20px; height: 16px;
      -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
      -webkit-mask-size: 120px 16px; mask-size: 120px 16px;
      will-change: -webkit-mask-position, mask-position;
    }
    /* Two same-colour blood wave layers at different speeds/directions overlap
       into a single, more complex wavy surface — no brighter crest. Sat low so
       only modest humps peek above the liquid top. */
    .surface.front { top: -9px;  background: var(--hp); animation: wave 2.6s linear infinite; }
    .surface.back  { top: -12px; background: var(--hp); opacity: 0.45;
                     animation: wave 4.3s linear infinite reverse; }
    /* Dark wavy surface for the lagging trail. */
    .surface.twave { top: -12px; height: 14px; background: var(--trail); opacity: 0.96;
                     -webkit-mask-size: 120px 14px; mask-size: 120px 14px;
                     animation: wave 5.4s linear infinite; }
    @keyframes wave {
      from { -webkit-mask-position: 0 0;      mask-position: 0 0; }
      to   { -webkit-mask-position: -120px 0; mask-position: -120px 0; }
    }
    /* At full health the vial is brimmed — flatten the surface (no waves). */
    .vial.full .surface { display: none; }

    /* Etched measurement ticks on the glass (25/50/75%). */
    .ticks {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0, transparent 100%);
    }
    .ticks::before {
      content: ''; position: absolute; right: 10px; top: 0; bottom: 0; width: 12px;
      background:
        repeating-linear-gradient(180deg,
          rgba(255,250,240,0.0) 0, rgba(255,250,240,0.0) calc(25% - 1px),
          rgba(255,250,240,0.22) calc(25% - 1px), rgba(255,250,240,0.22) 25%);
    }

    /* Quiet glass reflection. */
    .glare {
      position: absolute; left: 0; right: 0; top: 0; height: 46%;
      background: linear-gradient(180deg, rgba(255,250,240,0.16), transparent);
      pointer-events: none;
    }

    .readout {
      position: absolute; left: 0; right: 0; bottom: 10px; z-index: 2;
      text-align: center; font-weight: 700; font-size: 21px; letter-spacing: 0.02em;
      color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 5px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    .readout .max { display: block; font-size: 10px; opacity: 0.8; margin-top: -1px; }

    /* Droplets spilled on damage — they arc OUT to the side (over the rim) then
       run down, rather than dropping straight. Spawned on .vial (not clipped) so
       they can spill past the glass edge. */
    .drip {
      position: absolute; width: 4px; height: 7px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: var(--hp); top: 0; opacity: 0; pointer-events: none; z-index: 3;
      box-shadow: 0 0 3px rgba(0,0,0,0.4);
    }
    /* Spill droplet: spills out, then ACCELERATES downward while SHRINKING, and
       vanishes. Transform (fall+shrink) and opacity run as separate animations
       so the fall stays a single, smooth accelerating segment. */
    @keyframes drip-fall {
      0%   { transform: translate(0, 0) scale(1, 0.9); }
      100% { transform: translate(var(--drift, 16px), var(--fall, 96px)) scale(0.18, 0.32); }
    }
    @keyframes drip-fade {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      66%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Brief blood crest streak on impact. Lives inside .liquid at its top edge
       so it rides the surface down as the level drains (no white line snapping
       to the final level). */
    .splash {
      position: absolute; left: 0; right: 0; top: -3px; height: 5px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--hp), #ff9a8a 55%), transparent);
      opacity: 0; pointer-events: none;
    }
    .splash.go { animation: splash 420ms ease-out; }
    @keyframes splash { 0% { opacity: 0; } 25% { opacity: 0.9; } 100% { opacity: 0; } }

    /* Low-health danger: red rim + slow pulse. */
    .vial.danger .glass {
      border-color: rgba(207,34,51,0.6);
      animation: danger 1.1s ease-in-out infinite;
    }
    @keyframes danger {
      0%, 100% { box-shadow: inset 0 1px 0 rgba(255,250,240,0.18), inset 0 0 18px rgba(0,0,0,0.55), 0 0 6px rgba(207,34,51,0.25); }
      50%      { box-shadow: inset 0 1px 0 rgba(255,250,240,0.18), inset 0 0 18px rgba(0,0,0,0.55), 0 0 20px rgba(207,34,51,0.55); }
    }

    @media (prefers-reduced-motion: reduce) {
      .surface, .vial.danger .glass { animation: none; }
      .liquid { transition: height 200ms linear, background 200ms linear; }
    }
  </style>
</head><body>
  <div class="vial" id="vial">
    <div class="glass" id="glass">
      <div class="trail" id="trail">
        <div class="surface twave"></div>
      </div>
      <div class="liquid" id="liquid">
        <div class="surface back"></div>
        <div class="surface front"></div>
        <div class="splash" id="splash"></div>
      </div>
      <div class="ticks"></div>
      <div class="glare"></div>
      <div class="label">Health</div>
      <div class="readout" id="readout">— <span class="max">/ —</span></div>
    </div>
  </div>
  <script>
    (function boot() {
      if (!window.tsic) { setTimeout(boot, 16); return; }

      // Wave mask tiles (built once). Black = liquid shows through; the sine
      // top edge makes the surface wavy. Foam uses the same tile (alpha mask).
      function waveMask() {
        const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='120' height='16'>" +
          "<path fill='black' d='M0,9 Q15,2 30,9 T60,9 T90,9 T120,9 V16 H0 Z'/></svg>";
        return "url(\"data:image/svg+xml," + encodeURIComponent(svg) + "\")";
      }
      const mask = waveMask();
      document.querySelectorAll('.surface').forEach((s) => {
        s.style.webkitMaskImage = mask; s.style.maskImage = mask;
      });

      const vial = document.getElementById('vial');
      const liquid = document.getElementById('liquid');
      const glass = document.getElementById('glass');
      const splash = document.getElementById('splash');
      const readout = document.getElementById('readout');

      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const lerp = (a, b, t) => a + (b - a) * t;

      // Current blood colour — crimson (full) → venous dark (low). Stays
      // lighter than the dark --trail so the current level still reads.
      function hpColor(frac) {
        const k = clamp01(frac);
        const r = Math.round(lerp(110, 207, k));
        const g = Math.round(lerp(16, 34, k));
        const b = Math.round(lerp(20, 51, k));
        return `rgb(${r}, ${g}, ${b})`;
      }

      const levelPct = (f) => 4 + clamp01(f) * 96;  // 4% (sliver at 0) .. 100% (full to the brim)

      let prevFrac = null;
      let liveFrac = 0.72, trailFrac = 0.72, decayStart = -1e9;
      const TRAIL_DELAY = 0.4, TRAIL_DECAY = 0.7;   // seconds; per-second catch-up

      // One small outside splash droplet at the given surface Y — spilled out
      // the side, accelerating + shrinking as it falls, then gone. These are
      // emitted continuously while the surface is dropping (see trailLoop), so
      // the spill traces down the side as the level travels.
      function spawnDrip(surfaceY) {
        const w = glass.clientWidth;
        const d = document.createElement('div');
        d.className = 'drip';
        const side = Math.random() < 0.5 ? -1 : 1;          // spill left or right
        d.style.left = (side < 0 ? (3 + Math.random() * 9) : (w - 3 - Math.random() * 9)).toFixed(0) + 'px';
        d.style.top = (surfaceY - 1 + Math.random() * 4).toFixed(0) + 'px';
        d.style.setProperty('--drift', (side * (9 + Math.random() * 14)).toFixed(0) + 'px');
        d.style.setProperty('--fall', (26 + Math.random() * 44).toFixed(0) + 'px');
        const dur = Math.round(720 + Math.random() * 260);
        // ease-in curve → accelerates as it falls (gravity-like), then shrinks/fades.
        d.style.animation = `drip-fall ${dur}ms cubic-bezier(0.45, 0, 0.85, 0.6) forwards, drip-fade ${dur}ms linear forwards`;
        vial.appendChild(d);                                // vial isn't clipped → drips spill past the side
        setTimeout(() => d.remove(), dur + 220);
      }

      function render(p) {
        const cur = p ? Number(p.Current) || 0 : 0;
        const max = p ? Number(p.Max) || 1 : 1;
        const frac = clamp01(max > 0 ? cur / max : 0);

        vial.style.setProperty('--level', levelPct(frac).toFixed(2) + '%');
        vial.style.setProperty('--hp', hpColor(frac));
        vial.classList.toggle('danger', frac > 0 && frac < 0.25);
        vial.classList.toggle('full', frac >= 0.995);   // full to the brim, flat top

        readout.innerHTML = Math.round(cur) + ' <span class="max">/ ' + Math.round(max) + '</span>';

        // Damage feedback: a blood crest streak rides the draining surface
        // (splash lives inside .liquid at its top); the side-spill droplets are
        // emitted continuously by trailLoop as the surface descends. The dark
        // trail starts its catch-up timer so it lingers at the old level.
        if (prevFrac !== null && frac < prevFrac - 0.001) {
          decayStart = performance.now() / 1000;
          splash.classList.remove('go'); void splash.offsetWidth; splash.classList.add('go');
        }
        liveFrac = frac;
        prevFrac = frac;
      }

      tsic.on('tsic.msg.UI.Player.Attribute', (p) => {
        if (!p || p.Channel !== 'Health') return;
        render(p);
      });

      // Trail decay: after a short delay the darker trail drains down to meet
      // the current level, leaving a transient dark band that shows the damage.
      // Also emits side-spill droplets continuously while the surface is falling.
      let lastT = performance.now() / 1000;
      let lastFg = null, dripAccum = 0;
      const DRIP_EVERY_PX = 12;   // one splash droplet per this much surface descent
      (function trailLoop() {
        const t = performance.now() / 1000;
        const dt = Math.min(0.05, t - lastT); lastT = t;
        if (t - decayStart >= TRAIL_DELAY && trailFrac > liveFrac) {
          trailFrac = Math.max(liveFrac, trailFrac - TRAIL_DECAY * dt);
        }
        // The trail must never sit BELOW the (animating) foreground — clamp to
        // the foreground's actually-rendered level so on heal it rises *with*
        // the foreground instead of leading ahead of it.
        const glassH = glass.clientHeight || 1;
        const fgFrac = clamp01((liquid.getBoundingClientRect().height / glassH - 0.04) / 0.96);
        if (trailFrac < fgFrac) trailFrac = fgFrac;
        vial.style.setProperty('--trail-level', levelPct(trailFrac).toFixed(2) + '%');

        // While the surface is dropping, splash out the sides at its CURRENT
        // position — so the spill traces all the way down as the level travels,
        // rather than firing once at the end. Spacing is per-distance so faster
        // / bigger drops splash more.
        const surfaceY = (1 - fgFrac) * glassH;
        if (lastFg !== null && fgFrac < lastFg - 1e-4) {
          dripAccum += (lastFg - fgFrac) * glassH;
          let made = 0;
          while (dripAccum >= DRIP_EVERY_PX && made < 4) { spawnDrip(surfaceY); dripAccum -= DRIP_EVERY_PX; made++; }
        } else {
          dripAccum = 0;
        }
        lastFg = fgFrac;

        requestAnimationFrame(trailLoop);
      })();
    })();
  </script>
</body></html>
