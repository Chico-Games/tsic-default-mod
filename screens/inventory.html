<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Inventory">
  <meta name="tsic-input-mode" content="InputMode.Menu.Inventory">
  <title>Inventory</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <script src="/shared/catalog.js" defer></script>
  <script src="/shared/inventory.js" defer></script>
  <script src="/shared/action-bar.js" defer></script>
  <style>
    /* Layout is custom; the .tsic-modal-scrim class would clash because we
       need the panel to size itself rather than auto-centre via flex defaults. */
    #inv-root { position:fixed; inset:0; background: rgba(35,31,24,0.35); display:flex; align-items:center; justify-content:center; }
    /* Heights kept tight so the whole grid fits inside 80vh on a 720p viewport
       without scroll — the close-row and capacity bar must stay visible. */
    #inv-panel { width: 900px; max-width: calc(100vw - 48px); max-height: 84vh; overflow:auto; display:grid; grid-template-columns: 140px 1fr 220px; gap:10px; }
    #inv-tabs { display:flex; flex-direction:column; gap:4px; }
    .inv-tab { padding:6px 10px; background: rgba(241,229,207,0.55); border:1px solid var(--tsic-border); cursor:pointer; }
    .inv-tab.active { background: var(--tsic-accent-dim); }
    #inv-grid { display:grid; grid-template-columns: repeat(8, 56px); grid-auto-rows: 56px; gap:6px; }
    #inv-info { padding: 8px; background: rgba(241,229,207,0.88); border:1px solid var(--tsic-border); min-height: 100px; }
    #inv-equip-row { grid-column: 1 / 3; display:flex; gap:6px; padding:6px; background: rgba(184,170,145,0.35); }
    .equip-slot { width:42px; height:42px; background: rgba(241,229,207,0.55); border:1px solid var(--tsic-border); display:flex; align-items:center; justify-content:center; font-size:9px; color: var(--cat-ink-soft); cursor:pointer; }
    #inv-char-preview { width:220px; height:220px; background: rgba(241,229,207,0.92); border:1px solid var(--tsic-border); }
    #inv-char-preview img { width:100%; height:100%; object-fit:contain; }
    #inv-capacity { grid-column: 1 / 4; display:flex; flex-direction:column; gap:4px; font-size:11px; }
    #inv-capacity-line { display:flex; justify-content:space-between; opacity:0.75; }
    #inv-capacity-bar { height:6px; background: rgba(241,229,207,0.55); border-radius:3px; overflow:hidden; }
    #inv-capacity-fill { height:100%; width:0; background:#cbd5e1; transition: width 100ms linear, background 100ms linear; }
    #inv-capacity[data-state="warning"] #inv-capacity-fill { background:#f59e0b; }
    #inv-capacity[data-state="full"] #inv-capacity-fill { background:#ef4444; }
    #inv-capacity[data-state="overburdened"] #inv-capacity-fill { background:#b91c1c; }
    #inv-capacity[data-state="overburdened"] #inv-capacity-overburdened { display:block; }
    #inv-capacity-overburdened { display:none; color:#fca5a5; font-weight:600; letter-spacing:1px; }
    #inv-close { grid-column: 1 / 4; text-align:right; }
  </style>
</head><body>
<div id="inv-root">
  <div id="inv-panel" class="tsic-panel">
    <h2 class="tsic-title" style="grid-column: 1 / 4; margin:0;">Inventory</h2>
    <div id="inv-tabs"></div>
    <div id="inv-grid"></div>
    <div id="inv-info"></div>
    <div id="inv-equip-row"></div>
    <div id="inv-char-preview"><img id="inv-char-img" alt=""></div>
    <div id="inv-capacity">
      <div id="inv-capacity-line"><span id="inv-capacity-text">CAPACITY: -</span><span id="inv-capacity-overburdened">OVERBURDENED</span></div>
      <div id="inv-capacity-bar"><div id="inv-capacity-fill"></div></div>
    </div>
    <div id="inv-close"><button class="tsic-button" id="btn-close">Close (Esc)</button></div>
  </div>
</div>
<script>
(function(){
    const TABS = [
        { id: 'All',   filter: null },
        { id: 'Tools', filter: i => i.Category === 'Equipment' },
        { id: 'Cons.', filter: i => i.Category === 'Consumable' },
        { id: 'Mats',  filter: i => i.Category === 'CraftingMaterial' },
        { id: 'Other', filter: i => !['Equipment','Consumable','CraftingMaterial'].includes(i.Category) },
    ];
    let activeTab = 'All';
    let lastUpdate = null;
    let lastEquipment = null;
    let hoveredItem = null;
    let charPreviewFrame = 0;
    let charPreviewTimer = null;

    function whenReady(cb){ if(window.tsic && window.TSICInventory){cb();return;} setTimeout(()=>whenReady(cb),16); }

    function renderTabs() {
        const host = document.getElementById('inv-tabs');
        host.innerHTML = '';
        for (const t of TABS) {
            const div = document.createElement('div');
            div.className = 'inv-tab' + (activeTab === t.id ? ' active' : '');
            div.textContent = t.id;
            div.addEventListener('click', () => { activeTab = t.id; refresh(); });
            host.appendChild(div);
        }
    }

    function publishHoverContext(it) {
        if (!window.tsic || !window.tsic.setMenuActionContext) return;
        const cat = window.tsic.itemCatalog || {};
        if (!it) {
            window.tsic.setMenuActionContext([]);
            return;
        }
        const desc = cat[it.ItemId];
        const category = desc && desc.Category;
        const entries = [];
        if (category === 'Equipment') {
            entries.push({ ActionName: 'IA_UI_ConfirmAccept', Label: 'Equip',         Priority: 10 });
            entries.push({ ActionName: 'IA_UI_AddToHotbar',   Label: 'Assign Hotbar', Priority: 20 });
            entries.push({ ActionName: 'IA_UI_DropItem',      Label: 'Drop',          Priority: 30 });
        } else if (category === 'Consumable') {
            entries.push({ ActionName: 'IA_UI_ConfirmAccept', Label: 'Use',  Priority: 10 });
            entries.push({ ActionName: 'IA_UI_DropItem',      Label: 'Drop', Priority: 30 });
        } else {
            entries.push({ ActionName: 'IA_UI_DropItem', Label: 'Drop', Priority: 30 });
        }
        window.tsic.setMenuActionContext(entries);
    }

    function refresh() {
        renderTabs();
        if (!lastUpdate) return;
        const cat = window.tsic.itemCatalog || {};
        const filter = (TABS.find(t => t.id === activeTab) || {}).filter;
        const items = (lastUpdate.Items || []).filter(it => {
            if (!filter) return true;
            const desc = cat[it.ItemId];
            return desc ? filter(desc) : (activeTab === 'Other' || activeTab === 'All');
        });
        const opts = {
            maxSlots: lastUpdate.MaxSlots || 32,
            onHover: (it) => {
                hoveredItem = it;
                window.TSICInventory.renderInfoPanel(document.getElementById('inv-info'), it ? cat[it.ItemId] : null, it);
                publishHoverContext(it);
            },
            onLeave: () => {
                hoveredItem = null;
                window.TSICInventory.renderInfoPanel(document.getElementById('inv-info'), null);
                publishHoverContext(null);
            },
            onClick: (it) => {
                if (!it) return;
                tsic.publishMessage('UI.Cmd.Inventory.Use', { OwnerId: 'Player', SlotIndex: it.SlotIndex });
            },
            onRMB: (it) => {
                if (!it) return;
                if (it.Count > 1) {
                    window.TSICInventory.openQuantityModal(it.Count, (count) => {
                        tsic.publishMessage('UI.Cmd.Inventory.Drop', { OwnerId: 'Player', SlotIndex: it.SlotIndex, Count: count });
                        tsic.publishMessage('UI.Cmd.Sound.Play', { SoundKey: 'Inventory.Drop', VolumeScale: 1.0 });
                    });
                } else {
                    tsic.publishMessage('UI.Cmd.Inventory.Drop', { OwnerId: 'Player', SlotIndex: it.SlotIndex, Count: 1 });
                    tsic.publishMessage('UI.Cmd.Sound.Play', { SoundKey: 'Inventory.Drop', VolumeScale: 1.0 });
                }
            },
            onDrop: (src, targetSlot) => {
                if (src.slot === targetSlot) return;
                tsic.publishMessage('UI.Cmd.Inventory.Transfer', {
                    FromOwnerId: 'Player', ToOwnerId: 'Player',
                    FromSlot: src.slot, ToSlot: targetSlot, Count: 0
                });
            }
        };
        window.TSICInventory.renderGrid(document.getElementById('inv-grid'), items, opts);

        const used = (lastUpdate.Items || []).length;
        const cur = lastUpdate.CurrentWeight || 0;
        const max = lastUpdate.MaxWeight || 0;
        const ratio = max > 0 ? cur / max : 0;
        const cap = document.getElementById('inv-capacity');
        document.getElementById('inv-capacity-text').textContent =
            `CAPACITY: ${used} items · ${cur.toFixed(2)}/${max.toFixed(2)} kg`;
        document.getElementById('inv-capacity-fill').style.width = `${Math.max(0, Math.min(100, ratio * 100))}%`;
        cap.dataset.state = ratio >= 1.05 ? 'overburdened'
            : ratio >= 1.0  ? 'full'
            : ratio >= 0.75 ? 'warning'
            : 'normal';
    }

    function renderEquipment() {
        const host = document.getElementById('inv-equip-row');
        host.innerHTML = '';
        const slots = (lastEquipment && lastEquipment.Slots) || [];
        for (const s of slots) {
            const div = document.createElement('div');
            div.className = 'equip-slot';
            const label = (s.SlotTag || '').split('.').pop();
            if (s.ItemId) {
                const img = document.createElement('img');
                img.src = `tex://item-icon/${encodeURIComponent(s.ItemId)}`;
                img.style.cssText = 'width:100%;height:100%;object-fit:contain;pointer-events:none;';
                div.appendChild(img);
                div.title = `${label} - click to unequip`;
                div.addEventListener('click', () => {
                    tsic.publishMessage('UI.Cmd.Equipment.Unequip', { ItemId: '', SlotTag: s.SlotTag });
                });
            } else {
                div.textContent = label;
            }
            host.appendChild(div);
        }
    }

    function startCharPreviewPolling() {
        if (charPreviewTimer) return;
        const img = document.getElementById('inv-char-img');
        charPreviewTimer = setInterval(() => {
            charPreviewFrame++;
            img.src = `tex://character-preview?t=${charPreviewFrame}`;
        }, 100);
    }
    function stopCharPreviewPolling() {
        if (charPreviewTimer) { clearInterval(charPreviewTimer); charPreviewTimer = null; }
    }

    whenReady(() => {
        tsic.on('tsic.msg.UI.Inventory.Updated', (p) => {
            if (!p || p.OwnerId !== 'Player') return;
            lastUpdate = p;
            refresh();
        });
        tsic.on('tsic.msg.UI.Equipment.Updated', (p) => {
            if (!p || p.OwnerId !== 'Player') return;
            lastEquipment = p;
            renderEquipment();
        });
        tsic.on('tsic.msg.UI.CharacterPreview.Ready', (p) => {
            if (p && p.bReady) startCharPreviewPolling();
        });
        // AddToHotbar input action opens the modal picker. Quick 0-9 keys still
        // work via the keydown handler below for power users; the modal is the
        // accessible / discoverable path matching UMG UHotbarSlotPicker.
        tsic.on('tsic.msg.UI.Input.IA_UI_AddToHotbar', (e) => {
            if (e.Phase !== 'Started' || !hoveredItem || !window.TSICInventory) return;
            const it = hoveredItem;
            window.TSICInventory.openHotbarSlotModal(it.ItemId, (slotIndex) => {
                tsic.publishMessage('UI.Cmd.Hotbar.Assign', { SlotIndex: slotIndex, ItemId: String(it.SlotIndex) });
            });
        });
        window.addEventListener('tsic-item-catalog', refresh);

        document.getElementById('btn-close').addEventListener('click', () => {
            tsic.publishMessage('UI.Cmd.CharacterPreview.Hide', {});
            stopCharPreviewPolling();
            tsic.publishMessage('UI.Cmd.Pause.Resume', {});
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                tsic.publishMessage('UI.Cmd.CharacterPreview.Hide', {});
                stopCharPreviewPolling();
                tsic.publishMessage('UI.Cmd.Pause.Resume', {});
            }
            if (/^[0-9]$/.test(e.key) && hoveredItem) {
                // 1..9 -> slots 0..8, 0 -> slot 9 (C++ NumHotbarSlots == 10).
                const slotIndex = e.key === '0' ? 9 : (parseInt(e.key, 10) - 1);
                tsic.publishMessage('UI.Cmd.Hotbar.Assign', {
                    SlotIndex: slotIndex,
                    ItemId: String(hoveredItem.SlotIndex)
                });
            }
        });

        tsic.publishMessage('UI.Cmd.CharacterPreview.Show', {});
    });
})();
</script>
</body></html>
