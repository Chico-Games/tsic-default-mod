<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Credits">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>Credits</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
    <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <style>
    html, body { background: transparent; color: var(--cat-ink-dark);
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center; }
    .credits { width: min(720px, calc(100% - 48px));
               padding: 48px 64px; box-sizing: border-box;
               background: var(--cat-bg);
               border: 1px solid var(--cat-border);
               box-shadow: var(--cat-shadow-soft);
               font-family: var(--cat-font-serif); }
    h1 { letter-spacing: 8px; font-weight: 200; font-size: 36px; margin: 0 0 16px;
         text-transform: uppercase; color: var(--cat-ink-dark); }
    h2 { letter-spacing: 6px; font-weight: 300; font-size: 18px;
         text-transform: uppercase; color: var(--cat-ink-soft); margin: 32px 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 4px 0; letter-spacing: 1px; }
  </style>
</head><body>
  <div class="credits">
    <h1>The Store is Closed</h1>

    <h2>Design &amp; Programming</h2>
    <ul>
      <li>Chico Games</li>
    </ul>

    <h2>Art</h2>
    <ul>
      <li>—</li>
    </ul>

    <h2>Special Thanks</h2>
    <ul>
      <li>—</li>
    </ul>

    <h2>Built With</h2>
    <ul>
      <li>Unreal Engine 5.6</li>
      <li>Chromium Embedded Framework (CEF)</li>
      <li>mod.io</li>
    </ul>

    <div class="tsic-button-row tsic-button-row--start" style="margin-top:40px;" data-tsic-focus-group="actions">
      <button class="tsic-button" id="btn-back" data-tsic-initial-focus>Back</button>
    </div>
  </div>
  <script>
    (function boot() {
      if (!window.tsic || typeof tsic.bootMenu !== 'function') { setTimeout(boot, 16); return; }
      tsic.bootMenu(function (ctx) {
        document.getElementById('btn-back').onclick = () =>
          tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: 'MainMenu' });
      });
    })();
  </script>
</body></html>
