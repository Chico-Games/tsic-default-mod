<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="DeathScreen">
  <title>You died</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    #death-root { position:fixed; inset:0; background: rgba(0,0,0,0.92); color:#fff; display:flex; align-items:center; justify-content:center; }
    #death-panel { text-align:center; }
    #death-panel h1 { letter-spacing:8px; font-size:36px; margin: 0 0 18px; color:#dc2626; }
    #death-panel p  { opacity:0.6; margin: 0 0 22px; letter-spacing:2px; }
    #death-actions  { display:flex; gap:12px; justify-content:center; }
  </style>
</head><body>
  <div id="death-root">
    <div id="death-panel">
      <h1>YOU DIED</h1>
      <p>respawn at the nearest spawn point</p>
      <div id="death-actions">
        <button class="tsic-button" id="btn-respawn">Respawn</button>
        <button class="tsic-button" id="btn-menu">Quit to Menu</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      whenReady(()=>{
        // Server is responsible for actually respawning the player; we just signal intent
        // via the existing Pause.Resume command. When a dedicated Death.Respawn command
        // lands on C++, swap this for it.
        document.getElementById('btn-respawn').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.Resume', {});
        document.getElementById('btn-menu').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.QuitToMenu', {});
      });
    })();
  </script>
</body></html>
