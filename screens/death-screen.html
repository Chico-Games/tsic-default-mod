<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="DeathScreen">
  <meta name="tsic-focus" content="enabled">
  <title>You died</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    #death-root { color: var(--cat-ink-dark); }
    #death-panel { text-align:center; }
    #death-panel h1 { color:#9f2e25; }   /* warm red from the catalogue palette */
    #death-panel p  { color:rgba(37,33,25,0.6); margin: 0 0 22px; letter-spacing:2px; }
  </style>
</head><body>
  <div id="death-root" class="tsic-modal-scrim tsic-modal-scrim--dim">
    <div id="death-panel">
      <h1 class="tsic-title tsic-title--lg">You Died</h1>
      <p>respawn at the nearest spawn point</p>
      <div class="tsic-button-row tsic-button-row--center">
        <button class="tsic-button" id="btn-respawn" data-tsic-initial-focus>Respawn</button>
        <button class="tsic-button" id="btn-menu">Quit to Menu</button>
      </div>
    </div>
  </div>
  <script>
    (function boot() {
      if (!window.tsic || typeof tsic.bootMenu !== 'function') { setTimeout(boot, 16); return; }
      tsic.bootMenu(function (ctx) {
        // Server is responsible for actually respawning the player; we just signal intent
        // via the existing Pause.Resume command. When a dedicated Death.Respawn command
        // lands on C++, swap this for it.
        document.getElementById('btn-respawn').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.Resume', {});
        document.getElementById('btn-menu').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.QuitToMenu', {});
      });
    })();
  </script>
</body></html>
