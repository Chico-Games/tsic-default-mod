<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="BossSummoner">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-input-mode" content="InputMode.Menu.BossSummoner">
  <meta name="tsic-action-bar-context" content='[{"ActionName":"IA_UI_ConfirmAccept","Label":"Summon","Priority":10}]'>
  <title>Boss Summoner</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <script src="/shared/catalog.js" defer></script>
  <style>
    /* Layered on tsic-row-button. */
    .bs-row { gap:10px; padding:8px 12px; }
    .bs-meta { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
    .bs-name { font-weight:700; }
    .bs-ings { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11px; opacity:0.85; }
    .bs-ings .bs-ing { display:flex; align-items:center; gap:4px; }
    .bs-ings .bs-ing img { width:18px; height:18px; object-fit:contain; }
  </style>
</head><body>
  <div id="modal" class="tsic-modal-scrim">
    <div class="tsic-panel tsic-panel--screen">
      <h2 class="tsic-title" style="margin:0 0 8px;">Boss Summoner</h2>
      <div class="tsic-eyebrow">Available rituals</div>
      <div id="recipes" class="tsic-list-pane" style="flex:1 1 auto;" data-tsic-focus-group="recipes"></div>
      <div class="tsic-close-row" data-tsic-focus-group="actions">
        <button class="tsic-button" id="btn-close" data-tsic-initial-focus>Close</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      function whenReady(cb){ if(window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      let stationId = null;
      let lastRecipes = [];

      function render() {
        const host = document.getElementById('recipes');
        host.innerHTML = '';
        const cat = (window.tsic && window.tsic.itemCatalog) || {};
        const visibleRecipes = lastRecipes.filter(r => r.bDiscovered !== false);
        if (visibleRecipes.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'tsic-empty';
          empty.textContent = 'No rituals available yet.';
          host.appendChild(empty);
          if (window.tsic && window.tsic.focus) window.tsic.focus.refresh();
          return;
        }
        for (const r of visibleRecipes) {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'tsic-row-button bs-row';
          const meta = document.createElement('div');
          meta.className = 'bs-meta';
          const name = document.createElement('div');
          name.className = 'bs-name';
          name.textContent = r.Name || r.RecipeId;
          meta.appendChild(name);
          const ings = document.createElement('div');
          ings.className = 'bs-ings';
          for (const i of (r.Ingredients || [])) {
            const ing = document.createElement('span');
            ing.className = 'bs-ing';
            const img = document.createElement('img');
            img.src = `tex://item-icon/${encodeURIComponent(i.ItemId)}`;
            img.onerror = () => { img.style.visibility = 'hidden'; };
            ing.appendChild(img);
            const lbl = document.createElement('span');
            lbl.textContent = `${(cat[i.ItemId] || {}).Name || i.ItemId} x${i.Count}`;
            ing.appendChild(lbl);
            ings.appendChild(ing);
          }
          meta.appendChild(ings);
          row.appendChild(meta);
          row.onclick = () => tsic.publishMessage('UI.Cmd.Recipe.Start', { Kind: 'Boss', StationId: stationId, RecipeId: r.RecipeId, Count: 1 });
          host.appendChild(row);
        }
        if (window.tsic && window.tsic.focus) window.tsic.focus.refresh();
      }

      whenReady(()=>{
        tsic.on('tsic.msg.UI.Recipe.StationOpened', (p) => {
          if (!p || p.Kind !== 'Boss') return;
          stationId = p.StationId;
          lastRecipes = p.Recipes || [];
          render();
        });
        window.addEventListener('tsic-item-catalog', render);
        document.getElementById('btn-close').onclick = () =>
          tsic.publishMessage('UI.Cmd.Pause.Resume', {});
      });
    })();
  </script>
</body></html>
