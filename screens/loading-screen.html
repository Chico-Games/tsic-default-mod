<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Loading">
  <title>Loading</title>
  <link rel="stylesheet" href="/shared/base.css">
  <script src="/shared/router.js" defer></script>
    <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <style>
    .loading-wrap { position:fixed; inset:0;
                    display:flex; align-items:center; justify-content:center;
                    background: var(--cat-bg); }
    .loading-card { padding: 24px 48px;
                    background: var(--cat-bg);
                    border: 1px solid var(--cat-border);
                    box-shadow: var(--cat-shadow-soft);
                    font-family: var(--cat-font-serif);
                    color: var(--cat-ink-dark);
                    min-width: 360px;
                    text-align: center; }
    .loading-label { font-size: 18px;
                     letter-spacing: 6px;
                     text-transform: uppercase; }
    .loading-dots { display: inline-block;
                    letter-spacing: 0;
                    margin-left: 0.15em; }
    .loading-dots > span { display: inline-block;
                           opacity: 0; }
    .loading-dots > span:nth-child(1) { animation: tsic-loading-dot-1 1.4s infinite; }
    .loading-dots > span:nth-child(2) { animation: tsic-loading-dot-2 1.4s infinite; }
    .loading-dots > span:nth-child(3) { animation: tsic-loading-dot-3 1.4s infinite; }
    @keyframes tsic-loading-dot-1 {
      0%, 24.99% { opacity: 0; }
      25%, 99%   { opacity: 1; }
      100%       { opacity: 0; }
    }
    @keyframes tsic-loading-dot-2 {
      0%, 49.99% { opacity: 0; }
      50%, 99%   { opacity: 1; }
      100%       { opacity: 0; }
    }
    @keyframes tsic-loading-dot-3 {
      0%, 74.99% { opacity: 0; }
      75%, 99%   { opacity: 1; }
      100%       { opacity: 0; }
    }
  </style>
</head><body>
  <div class="loading-wrap">
    <div class="loading-card">
      <div class="loading-label">
        <span id="loading-label-text">Loading</span><span class="loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      function stripTrailingDots(s) {
        return (s || '').replace(/[\s.…]+$/, '');
      }
      function render(payload) {
        const label = stripTrailingDots((payload && payload.Label) || 'Loading');
        document.getElementById('loading-label-text').textContent = label || 'Loading';
      }
      (function boot() {
        if (!window.tsic || typeof tsic.bootMenu !== 'function') { setTimeout(boot, 16); return; }
        tsic.bootMenu(function (ctx) {
          ctx.on('tsic.msg.UI.Loading.Progress', render);
        }, { escape: false, closeButton: false });
      })();
    })();
  </script>
</body></html>
