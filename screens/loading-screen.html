<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Loading">
  <title>TSIC — Loading</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
</head><body>
  <div id="app" style="position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div style="font-size:32px;letter-spacing:6px;margin-bottom:32px;">TSIC</div>
    <div style="width:60vw;max-width:520px;" class="tsic-bar-track">
      <div id="progress-fill" class="tsic-bar-fill" style="width:0%;"></div>
    </div>
    <div id="progress-label" style="margin-top:14px;font-size:13px;opacity:0.7;">Loading…</div>
  </div>
  <script>
    (function() {
      function whenReady(cb) {
        if (window.tsic) { cb(); return; }
        setTimeout(() => whenReady(cb), 16);
      }
      whenReady(() => {
        tsic.on('tsic.msg.UI.Loading.Progress', (p) => {
          if (!p) return;
          const fill = document.getElementById('progress-fill');
          const label = document.getElementById('progress-label');
          if (fill) fill.style.width = Math.round((p.Progress || 0) * 100) + '%';
          if (label) label.textContent = p.Label || 'Loading…';
        });
      });
    })();
  </script>
</body></html>
