<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="NewStore">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>New Game</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
    <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <style>
    html, body { background: transparent; color: var(--cat-ink-dark);
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center; }
    .wrap { width: min(560px, calc(100% - 48px));
            padding: 40px 56px; box-sizing: border-box;
            background: var(--cat-bg);
            border: 1px solid var(--cat-border);
            box-shadow: var(--cat-shadow-soft);
            font-family: var(--cat-font-serif); }
    h1 { letter-spacing: 12px; font-weight: 200; font-size: 36px;
         text-transform: uppercase; color: var(--cat-ink-dark); margin: 0 0 24px; }
    label { display:block; letter-spacing: 4px; text-transform: uppercase;
            font-size: 11px; color: rgba(37,33,25,0.7); margin: 16px 0 6px; }
    /* Make the layout dropdown read as a button, not a text box. */
    #layout-dd { width: 100%; padding: 10px 14px; font-size: 14px;
            background: var(--cat-green); color: #f7edd9;
            border-color: var(--cat-green);
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; }
    #layout-dd:hover { background: var(--cat-green-hover, var(--cat-green));
            color: #f7edd9; }
    #layout-dd .tsic-dropdown-label { flex: 1; text-align: left; }
    #layout-dd .tsic-dropdown-caret {
            font-size: 16px; line-height: 1; opacity: 1;
            padding-left: 10px; margin-left: 4px;
            border-left: 1px solid rgba(247,237,217,0.35); }
    #layout-dd[data-tsic-value=""] .tsic-dropdown-label,
    #layout-dd:not([data-tsic-value]) .tsic-dropdown-label { color: rgba(247,237,217,0.75); font-style: italic; }
    .field-hint { display: block; font-size: 11px; font-style: italic;
            color: var(--cat-ink-soft); margin-top: 6px; letter-spacing: 0; text-transform: none; }
    .mods-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mods-panel {
            display: flex; flex-direction: column;
            border: 1px solid rgba(184,170,145,0.45);
            background: rgba(241,229,207,0.45);
            min-height: 120px; max-height: 240px;
    }
    .mods-panel-head {
            padding: 4px 8px; font-size: 10px; letter-spacing: 3px;
            text-transform: uppercase; color: var(--cat-ink-soft);
            border-bottom: 1px solid rgba(184,170,145,0.35);
    }
    .mods-list { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 2px; }
    .mods-list-empty { font-size: 11px; color: rgba(47,43,34,0.5); padding: 6px 4px; font-style: italic; }
    .mod-row {
            display: flex; align-items: center; gap: 4px;
            padding: 3px 4px;
            background: rgba(241,229,207,0.55);
            border: 1px solid transparent;
    }
    .mod-row:hover { background: rgba(241,229,207,0.85); border-color: var(--tsic-border); }
    .mod-row .name { flex: 1; font-size: 12px; }
    .mod-row button {
            background: rgba(241,229,207,0.88);
            border: 1px solid rgba(184,170,145,0.45); color: var(--cat-ink-dark);
            padding: 1px 7px; cursor: pointer; font-size: 12px; line-height: 1.4;
    }
    .mod-row button:hover { background: rgba(241,229,207,1.0); }
    .mod-row button:disabled { color: rgba(37,33,25,0.35); background: rgba(241,229,207,0.35); cursor: not-allowed; }
    .actions { margin-top: 24px; display: flex; justify-content: space-between; }
    .manage-link { display: inline-block; margin-top: 6px;
            color: var(--cat-ink-soft); cursor: pointer;
            text-decoration: underline; font-size: 12px; }
  </style>
</head><body>
  <div class="wrap">
    <h1>New Game</h1>

    <div data-tsic-focus-group="fields">
      <label>Map</label>
      <button class="tsic-dropdown" id="layout-dd" data-tsic-focusable
              data-tsic-initial-focus data-tsic-options='[]'>
        <span class="tsic-dropdown-label">Select a map…</span>
        <span class="tsic-dropdown-caret" aria-hidden="true">▼</span>
      </button>
      <span class="field-hint">Choose which map to play on.</span>

      <label>Active Mods</label>
      <div class="mods-split">
        <div class="mods-panel" data-tsic-focus-group="mods-enabled">
          <div class="mods-panel-head">Enabled</div>
          <div id="mods-enabled" class="mods-list"></div>
        </div>
        <div class="mods-panel" data-tsic-focus-group="mods-available">
          <div class="mods-panel-head">Available</div>
          <div id="mods-available" class="mods-list"></div>
        </div>
      </div>
      <span class="manage-link" id="link-manage" data-tsic-focusable tabindex="0">Manage Mods →</span>
    </div>

    <div class="actions" data-tsic-focus-group="actions">
      <button class="tsic-button" id="btn-back">Back</button>
      <button class="tsic-button" id="btn-create" disabled>Create</button>
    </div>
  </div>
  <script>
    (function(){
      let layouts = [];
      let mods = [];
      let order = [];
      let selectedLayout = null;

      function refreshLayoutDD() {
        const dd = document.getElementById('layout-dd');
        const opts = layouts.map(L => ({ value: L.LayoutId, label: L.DisplayName }));
        // Tsic-dropdown expects JSON in data-tsic-options.
        dd.setAttribute('data-tsic-options', JSON.stringify(opts));
        if (window.tsic && tsic.dropdown && tsic.dropdown.options) {
          tsic.dropdown.options(dd, opts);
        }
        // Preserve current selection if still valid; otherwise default to first.
        if (!opts.find(o => o.value === selectedLayout)) {
          selectedLayout = opts.length ? opts[0].value : null;
          if (selectedLayout) {
            if (tsic.dropdown && tsic.dropdown.set) {
              tsic.dropdown.set(dd, selectedLayout);
            } else {
              // tsic-dropdown.js is deferred; if a sticky replay reaches us
              // before it installs, mirror what .set would do directly.
              dd.setAttribute('data-tsic-value', String(selectedLayout));
              const match = opts.find(o => o.value === selectedLayout);
              const lbl = dd.querySelector('.tsic-dropdown-label');
              if (lbl && match) lbl.textContent = String(match.label != null ? match.label : match.value);
            }
          } else {
            dd.removeAttribute('data-tsic-value');
            const lbl = dd.querySelector('.tsic-dropdown-label');
            if (lbl) lbl.textContent = '— No maps available —';
          }
        }
        validate();
      }

      function renderMods() {
        const enabledHost = document.getElementById('mods-enabled');
        const availHost = document.getElementById('mods-available');
        enabledHost.innerHTML = '';
        availHost.innerHTML = '';
        const indexOf = (id) => order.indexOf(id) >= 0 ? order.indexOf(id) : 9999;
        const enabled  = mods.filter(m =>  m.bEnabled).sort((a, b) => indexOf(a.ModId) - indexOf(b.ModId));
        const available = mods.filter(m => !m.bEnabled);

        function setEnabled(id, on) {
          tsic.publishMessage('UI.Cmd.Mod.SetEnabled', { ModId: id, Enabled: on });
        }

        if (enabled.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'mods-list-empty';
          empty.textContent = 'No mods enabled.';
          enabledHost.appendChild(empty);
        } else {
          for (let i = 0; i < enabled.length; i++) {
            const m = enabled[i];
            const row = document.createElement('div');
            row.className = 'mod-row';
            row.setAttribute('data-tsic-focusable', '');
            row.tabIndex = -1;

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = String(m.DisplayName || m.ModId || '');

            const up = document.createElement('button');
            up.type = 'button'; up.textContent = '↑'; up.title = 'Move up';
            up.disabled = (i === 0 || !!m.bLocked);
            up.onclick = () => move(m.ModId, -1);

            const down = document.createElement('button');
            down.type = 'button'; down.textContent = '↓'; down.title = 'Move down';
            down.disabled = (i === enabled.length - 1 || !!m.bLocked);
            down.onclick = () => move(m.ModId, +1);

            const remove = document.createElement('button');
            remove.type = 'button'; remove.textContent = '→'; remove.title = 'Disable (move to Available)';
            remove.disabled = !!m.bLocked;
            remove.onclick = () => setEnabled(m.ModId, false);

            row.append(name, up, down, remove);
            enabledHost.appendChild(row);
          }
        }

        if (available.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'mods-list-empty';
          empty.textContent = mods.length ? 'All installed mods are enabled.'
                                          : 'No mods installed. Open Manage Mods to subscribe.';
          availHost.appendChild(empty);
        } else {
          for (const m of available) {
            const row = document.createElement('div');
            row.className = 'mod-row';
            row.setAttribute('data-tsic-focusable', '');
            row.tabIndex = -1;

            const add = document.createElement('button');
            add.type = 'button'; add.textContent = '←'; add.title = 'Enable (move to Enabled)';
            add.onclick = () => setEnabled(m.ModId, true);

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = String(m.DisplayName || m.ModId || '');

            row.append(add, name);
            availHost.appendChild(row);
          }
        }
      }

      function move(modId, delta) {
        const i = order.indexOf(modId);
        if (i < 0) { order = [modId, ...order]; }
        const j = Math.max(0, Math.min(order.length - 1, i + delta));
        if (i === j && i >= 0) return;
        if (i >= 0) order.splice(i, 1);
        order.splice(j, 0, modId);
        tsic.publishMessage('UI.Cmd.Mod.SetLoadOrder', { Order: order });
      }

      function validate() {
        document.getElementById('btn-create').disabled = !selectedLayout;
      }

      // Also wait for tsic.dropdown — it's installed by a deferred script, so
      // it lands AFTER this inline script. If we subscribe to a sticky channel
      // (UI.Menu.Layouts) before then, the cached replay fires the handler
      // synchronously and we can't push the default selection through .set().
      (function boot() {
      if (!window.tsic || !window.tsic.dropdown) { setTimeout(boot, 16); return; }
      tsic.whenReady(function () {
        const dd = document.getElementById('layout-dd');
        dd.addEventListener('tsic-change', (e) => {
          selectedLayout = (e.detail && e.detail.value) || null;
          validate();
        });

        tsic.on('tsic.msg.UI.Menu.Layouts', (p) => { layouts = (p && p.Layouts) || []; refreshLayoutDD(); });
        tsic.on('tsic.msg.UI.Mod.InstalledList', (p) => { mods = (p && p.Mods) || []; renderMods(); });
        tsic.on('tsic.msg.UI.Mod.LoadOrder', (p) => { order = (p && p.Order) || []; renderMods(); });

        document.getElementById('btn-back').onclick = () =>
          tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: 'MainMenu' });
        document.getElementById('link-manage').onclick = () =>
          tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: 'Mods' });
        document.getElementById('btn-create').onclick = () => {
          if (!selectedLayout) return;
          const enabledMods = mods.filter(m => m.bEnabled).map(m => m.ModId);
          // StoreName / PlayerName left empty — C++ auto-generates "Store N" + "Owner".
          tsic.publishMessage('UI.Cmd.Menu.StartGame', {
            StoreName: '',
            PlayerName: '',
            LayoutId: selectedLayout,
            EnabledMods: enabledMods,
            LoadOrder: order,
          });
        };
      });
      })();
    })();
  </script>
</body></html>
