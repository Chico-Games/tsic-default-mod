<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="NewStore">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>New Game</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/tsic-dropdown.js" defer></script>
  <style>
    html, body { background: transparent; color: var(--cat-ink-dark);
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center; }
    .wrap { width: min(560px, calc(100% - 48px));
            padding: 40px 56px; box-sizing: border-box;
            background: var(--cat-bg);
            border: 1px solid var(--cat-border);
            box-shadow: var(--cat-shadow-soft);
            font-family: var(--cat-font-serif); }
    h1 { letter-spacing: 12px; font-weight: 200; font-size: 36px;
         text-transform: uppercase; color: var(--cat-ink-dark); margin: 0 0 24px; }
    label { display:block; letter-spacing: 4px; text-transform: uppercase;
            font-size: 11px; opacity: 0.7; margin: 16px 0 6px; }
    /* Make the layout dropdown read as a button, not a text box. */
    #layout-dd { width: 100%; padding: 10px 14px; font-size: 14px;
            background: var(--cat-green); color: #f7edd9;
            border-color: var(--cat-green); }
    #layout-dd:hover { background: var(--cat-green-hover, var(--cat-green));
            color: #f7edd9; }
    #layout-dd .tsic-dropdown-caret { font-size: 12px; opacity: 0.9; }
    .mods { display: flex; flex-direction: column; gap: 4px;
            border: 1px solid rgba(184,170,145,0.45); padding: 8px;
            background: rgba(241,229,207,0.45); }
    .mod-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .mod-row .name { flex: 1; }
    .mod-row button { background: rgba(241,229,207,0.88);
            border: 1px solid rgba(184,170,145,0.45); color: var(--cat-ink-dark);
            padding: 2px 8px; cursor: pointer; }
    .actions { margin-top: 24px; display: flex; justify-content: space-between; }
    .manage-link { display: inline-block; margin-top: 6px;
            color: var(--cat-ink-soft); cursor: pointer;
            text-decoration: underline; font-size: 12px; }
  </style>
</head><body>
  <div class="wrap">
    <h1>New Game</h1>

    <div data-tsic-focus-group="fields">
      <label>Layout</label>
      <button class="tsic-dropdown" id="layout-dd" data-tsic-focusable
              data-tsic-initial-focus data-tsic-options='[]'>
        <span class="tsic-dropdown-label">— Select —</span>
        <span class="tsic-dropdown-caret">▾</span>
      </button>

      <label>Active Mods</label>
      <div class="mods" id="mods" data-tsic-focus-group="mods"></div>
      <span class="manage-link" id="link-manage" data-tsic-focusable tabindex="0">Manage Mods →</span>
    </div>

    <div class="actions" data-tsic-focus-group="actions">
      <button class="tsic-button" id="btn-back">Back</button>
      <button class="tsic-button" id="btn-create" disabled>Create</button>
    </div>
  </div>
  <script>
    (function(){
      let layouts = [];
      let mods = [];
      let order = [];
      let selectedLayout = null;

      function refreshLayoutDD() {
        const dd = document.getElementById('layout-dd');
        const opts = layouts.map(L => ({ value: L.LayoutId, label: L.DisplayName }));
        // Tsic-dropdown expects JSON in data-tsic-options.
        dd.setAttribute('data-tsic-options', JSON.stringify(opts));
        if (window.tsic && tsic.dropdown && tsic.dropdown.options) {
          tsic.dropdown.options(dd, opts);
        }
        // Preserve current selection if still valid; otherwise default to first.
        if (!opts.find(o => o.value === selectedLayout)) {
          selectedLayout = opts.length ? opts[0].value : null;
          if (selectedLayout && tsic.dropdown && tsic.dropdown.set) {
            tsic.dropdown.set(dd, selectedLayout);
          } else {
            const lbl = dd.querySelector('.tsic-dropdown-label');
            if (lbl) lbl.textContent = opts.length ? opts[0].label : '— None —';
          }
        }
        validate();
      }

      function renderMods() {
        const host = document.getElementById('mods');
        host.innerHTML = '';
        const indexOf = (id) => order.indexOf(id) >= 0 ? order.indexOf(id) : 9999;
        mods.sort((a, b) => indexOf(a.ModId) - indexOf(b.ModId));

        for (const m of mods) {
          const row = document.createElement('div');
          row.className = 'mod-row';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = !!m.bEnabled;
          cb.onchange = (e) => tsic.publishMessage('UI.Cmd.Mod.SetEnabled',
            { ModId: m.ModId, Enabled: e.target.checked });

          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = String(m.DisplayName || '');

          const up = document.createElement('button');
          up.dataset.act = 'up';
          up.textContent = '↑';
          up.onclick = () => move(m.ModId, -1);

          const down = document.createElement('button');
          down.dataset.act = 'down';
          down.textContent = '↓';
          down.onclick = () => move(m.ModId, +1);

          row.append(cb, name, up, down);
          host.appendChild(row);
        }
        if (!mods.length) {
          const empty = document.createElement('div');
          empty.style.opacity = '0.6';
          empty.textContent = 'No mods installed. Open Manage Mods to subscribe.';
          host.appendChild(empty);
        }
      }

      function move(modId, delta) {
        const i = order.indexOf(modId);
        if (i < 0) { order = [modId, ...order]; }
        const j = Math.max(0, Math.min(order.length - 1, i + delta));
        if (i === j && i >= 0) return;
        if (i >= 0) order.splice(i, 1);
        order.splice(j, 0, modId);
        tsic.publishMessage('UI.Cmd.Mod.SetLoadOrder', { Order: order });
      }

      function validate() {
        document.getElementById('btn-create').disabled = !selectedLayout;
      }

      function whenReady(cb){ if (window.tsic){cb();return;} setTimeout(()=>whenReady(cb),16); }
      whenReady(() => {
        const dd = document.getElementById('layout-dd');
        dd.addEventListener('tsic-change', (e) => {
          selectedLayout = (e.detail && e.detail.value) || null;
          validate();
        });

        tsic.on('tsic.msg.UI.Menu.Layouts', (p) => { layouts = (p && p.Layouts) || []; refreshLayoutDD(); });
        tsic.on('tsic.msg.UI.Mod.InstalledList', (p) => { mods = (p && p.Mods) || []; renderMods(); });
        tsic.on('tsic.msg.UI.Mod.LoadOrder', (p) => { order = (p && p.Order) || []; renderMods(); });

        document.getElementById('btn-back').onclick = () =>
          tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: 'MainMenu' });
        document.getElementById('link-manage').onclick = () =>
          tsic.publishMessage('UI.Cmd.Menu.Navigate', { Screen: 'Mods' });
        document.getElementById('btn-create').onclick = () => {
          if (!selectedLayout) return;
          const enabledMods = mods.filter(m => m.bEnabled).map(m => m.ModId);
          // StoreName / PlayerName left empty — C++ auto-generates "Store N" + "Owner".
          tsic.publishMessage('UI.Cmd.Menu.StartGame', {
            StoreName: '',
            PlayerName: '',
            LayoutId: selectedLayout,
            EnabledMods: enabledMods,
            LoadOrder: order,
          });
        };
      });
    })();
  </script>
</body></html>
