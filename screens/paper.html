<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Paper">
  <meta name="tsic-focus" content="enabled">
  <meta name="tsic-action-bar-context" content='[]'>
  <title>Note</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/tsic-focus.js" defer></script>
  <script src="/shared/lore.js" data-kind="Paper" defer></script>
  <style>
    #paper-root { padding: 40px; }
    #paper-sheet { width: 560px; max-height: 80vh; background: #f5ecd9; color: #3b2f1c; font-family: 'Georgia', serif; padding: 28px 32px; box-shadow: 0 8px 22px rgba(35,31,24,0.45); overflow:auto; transform: rotate(-0.7deg); position:relative; }
    #lore-group  { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity:0.55; margin-bottom: 10px; }
    #lore-heading{ font-size: 22px; margin: 0 0 14px; line-height: 1.2; }
    #lore-body   { white-space: pre-wrap; font-size: 15px; line-height: 1.55; }
    #lore-controls { display:flex; gap:8px; margin-top: 16px; justify-content: flex-end; align-items: center; }
    #lore-pageinfo { opacity: 0.5; font-size: 11px; margin-right: 6px; }
    #lore-index-list { display:flex; flex-direction:column; gap:4px; margin-top: 12px; font-size: 11px; max-height: 120px; overflow:auto; }
    .lore-index { padding: 2px 6px; cursor:pointer; }
    .lore-index.current { background: rgba(60,40,10,0.15); }
  </style>
</head><body>
  <div id="paper-root" class="tsic-modal-scrim tsic-modal-scrim--dim">
    <div id="paper-sheet">
      <div id="lore-group"></div>
      <h1 id="lore-heading"></h1>
      <div id="lore-body"></div>
      <div id="lore-index-list"></div>
      <div id="lore-controls">
        <span id="lore-pageinfo"></span>
        <button class="tsic-button" id="lore-prev">‹ Prev</button>
        <button class="tsic-button" id="lore-next">Next ›</button>
        <button class="tsic-button" id="lore-close">Close</button>
      </div>
    </div>
  </div>
</body></html>
