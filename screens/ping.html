<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Ping">
  <title>Ping</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
    <script src="/shared/tsic-bridge.js" defer></script>
  <script src="/shared/tsic-runtime.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <style>
    /* Modal radial wheel — paper backdrop (tsic-modal-scrim--paper), centred. */
    #wheel {
      position: relative;
      width: 340px; height: 340px;
      border-radius: 50%;
      border: 1px solid var(--tsic-border);
      background: rgba(35,31,24,0.35);
    }
    .pp-btn {
      position: absolute;
      width: 92px; height: 92px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(35,31,24,0.50);
      border: 2px solid var(--tsic-border);
      color: var(--cat-ink-dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
      font-size: 12px;
      letter-spacing: 2px;
      transition: background 80ms ease, border-color 80ms ease, transform 80ms ease;
    }
    .pp-btn:hover { background: var(--tsic-accent); border-color: var(--tsic-accent); transform: translate(-50%, -50%) scale(1.05); }
    .pp-dot { width: 14px; height: 14px; border-radius: 50%; }
    #wheel-title {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      color: var(--cat-ink-soft);
      font-size: 12px; letter-spacing: 4px;
      pointer-events: none;
    }
  </style>
</head><body>
  <div id="backdrop" class="tsic-modal-scrim tsic-modal-scrim--paper">
    <div id="wheel">
      <div id="wheel-title">PING</div>
    </div>
  </div>
  <script>
    (function () {
      // Mirror EScpPingType: Ground / Entity / Enemy / Player / Map.
      // We surface the 4 the user typically asks for from the wheel; "Player" is
      // implicit when looking at a teammate (engine resolves at request time).
      const TYPES = [
        { id: 'Enemy',  label: 'ENEMY',  color: '#e74c3c' },
        { id: 'Entity', label: 'LOOT',   color: '#2ecc71' },
        { id: 'Ground', label: 'MOVE',   color: '#3498db' },
        { id: 'Map',    label: 'DANGER', color: '#f1c40f' },
      ];

      function publish(type) {
        // Location is a placeholder; gameplay-side overrides with the look-at hit.
        tsic.publishMessage('UI.Cmd.Ping.Request', {
          PingType: type,
          Location: { X: 0, Y: 0, Z: 0 },
        });
      }

      function build() {
        const wheel = document.getElementById('wheel');
        const radius = 110;
        const n = TYPES.length;
        for (let i = 0; i < n; ++i) {
          const t = TYPES[i];
          // Distribute evenly around the circle; start at the top and go clockwise.
          const angle = (-Math.PI / 2) + (i / n) * (Math.PI * 2);
          const x = 50 + (radius / 340 * 100) * Math.cos(angle);
          const y = 50 + (radius / 340 * 100) * Math.sin(angle);
          const btn = document.createElement('button');
          btn.className = 'pp-btn tsic-button';
          btn.style.left = x + '%';
          btn.style.top = y + '%';
          btn.onclick = () => publish(t.id);
          const dot = document.createElement('div');
          dot.className = 'pp-dot';
          dot.style.background = t.color;
          const lbl = document.createElement('div');
          lbl.textContent = t.label;
          btn.appendChild(dot);
          btn.appendChild(lbl);
          wheel.appendChild(btn);
        }
      }

      (function boot() {
        if (!window.tsic || typeof tsic.bootMenu !== 'function') { setTimeout(boot, 16); return; }
        tsic.bootMenu(function (ctx) {
          build();
          // Subscribe to the ping set just to keep cache replay alive on this page;
          // we don't render it here (3D world handles that), but having the listener
          // means cached payloads flow on context-ready.
          ctx.on('tsic.msg.UI.Ping.Set', () => { /* no-op for now */ });
        }, { escape: false, closeButton: false });
      })();
    })();
  </script>
</body></html>
