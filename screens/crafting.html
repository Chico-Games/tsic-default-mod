<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="tsic-screen" content="Crafting">
  <meta name="tsic-input-mode" content="InputMode.Menu.Crafting">
  <meta name="tsic-action-bar-context" content='[{"ActionName":"IA_UI_ConfirmAccept","Label":"Craft","Priority":10}]'>
  <title>Crafting</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/hud.css">
  <script src="/shared/router.js" defer></script>
  <script src="/shared/hud.js" defer></script>
  <script src="/shared/catalog.js" defer></script>
  <script src="/shared/recipe-info.js" defer></script>
  <style>
    #c-root { position:fixed; inset:0; background: rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; }
    #c-panel { width: 720px; max-height: 80vh; display:grid; grid-template-columns: 280px 1fr; gap:12px; }
    #c-list { display:flex; flex-direction:column; gap:4px; max-height: 600px; overflow-y:auto; }
    .c-row { display:flex; align-items:center; gap:8px; padding:6px 8px; background: rgba(255,255,255,0.04); border:1px solid var(--tsic-border); cursor:pointer; }
    .c-row.selected { background: var(--tsic-accent-dim); }
    .c-row.locked { opacity:0.45; }
    .c-row img { width:32px; height:32px; object-fit:contain; }
    #c-info { padding: 10px; background: rgba(0,0,0,0.4); border:1px solid var(--tsic-border); min-height:200px; }
    #c-craft { width: 100%; margin-top:12px; padding: 8px; }
    #c-craft:disabled { opacity:0.4; cursor:not-allowed; }
  </style>
</head><body>
<div id="c-root">
  <div id="c-panel" class="tsic-panel">
    <h2 style="grid-column: 1 / 3; margin:0;letter-spacing:3px;">CRAFTING</h2>
    <div id="c-list"></div>
    <div>
      <div id="c-info"></div>
      <button id="c-craft" class="tsic-button" disabled>Craft</button>
    </div>
    <div style="grid-column: 1 / 3; text-align:right;">
      <button class="tsic-button" id="btn-close">Close (Esc)</button>
    </div>
  </div>
</div>
<script>
(function(){
    let stationId = null;
    let lastStation = null;
    let materialCounts = {};
    let selectedRecipeId = null;
    let craftPendingAt = 0;

    function whenReady(cb){ if(window.tsic && window.TSICRecipeInfo){cb();return;} setTimeout(()=>whenReady(cb),16); }

    function renderList() {
        const host = document.getElementById('c-list');
        host.innerHTML = '';
        if (!lastStation) return;
        const cat = window.tsic.itemCatalog || {};
        for (const r of (lastStation.Recipes || [])) {
            const row = document.createElement('div');
            const locked = !r.bDiscovered || !r.bStationLevelSufficient;
            row.className = 'c-row' + (selectedRecipeId === r.RecipeId ? ' selected' : '') + (locked ? ' locked' : '');
            const img = document.createElement('img');
            img.src = r.bDiscovered ? `tex://item-icon/${encodeURIComponent((r.Outputs[0]||{}).ItemId||'')}` : '';
            row.appendChild(img);
            const name = document.createElement('div');
            name.style.flex = '1';
            const displayName = r.bDiscovered ? ((cat[(r.Outputs[0]||{}).ItemId] || {}).Name || r.Name) : '???';
            name.textContent = displayName;
            row.appendChild(name);
            if (!r.bStationLevelSufficient) {
                const lvl = document.createElement('span');
                lvl.style.cssText = 'font-size:10px;opacity:0.6;';
                lvl.textContent = `lvl ${r.RequiredStationLevel}`;
                row.appendChild(lvl);
            }
            row.addEventListener('click', () => { selectedRecipeId = r.RecipeId; renderAll(); });
            host.appendChild(row);
        }
    }
    function renderInfo(recipe) {
        window.TSICRecipeInfo.render(document.getElementById('c-info'), recipe, materialCounts);
        const btn = document.getElementById('c-craft');
        btn.disabled = !window.TSICRecipeInfo.canCraft(recipe, materialCounts);
    }
    function renderAll() {
        renderList();
        if (!lastStation) return;
        const recipe = (lastStation.Recipes || []).find(r => r.RecipeId === selectedRecipeId);
        renderInfo(recipe);
    }

    whenReady(() => {
        tsic.on('tsic.msg.UI.Recipe.StationOpened', (p) => {
            if (!p || p.Kind !== 'Crafting') return;
            stationId = p.StationId;
            lastStation = p;
            materialCounts = p.MaterialCounts || {};
            if (!selectedRecipeId && (p.Recipes || []).length > 0) {
                selectedRecipeId = p.Recipes[0].RecipeId;
            }
            renderAll();
        });
        tsic.on('tsic.msg.UI.Toast.Show', (p) => {
            if (!p) return;
            const sev = (p.Severity && p.Severity.TagName) || '';
            if (Date.now() - craftPendingAt < 500 && /Warning|Error/i.test(sev)) {
                tsic.publishMessage('UI.Cmd.Sound.Play', { SoundKey: 'Craft.Fail', VolumeScale: 1.0 });
            }
        });
        window.addEventListener('tsic-item-catalog', renderAll);

        document.getElementById('c-craft').addEventListener('click', () => {
            const recipe = lastStation && (lastStation.Recipes || []).find(r => r.RecipeId === selectedRecipeId);
            if (!recipe || !window.TSICRecipeInfo.canCraft(recipe, materialCounts)) return;
            craftPendingAt = Date.now();
            tsic.publishMessage('UI.Cmd.Recipe.Start', { Kind: 'Crafting', StationId: stationId, RecipeId: recipe.RecipeId, Count: 1 });
            tsic.publishMessage('UI.Cmd.Sound.Play', { SoundKey: 'Craft.Success', VolumeScale: 1.0 });
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('c-craft').click();
            if (e.key === 'Escape') document.getElementById('btn-close').click();
        });
        document.getElementById('btn-close').addEventListener('click', () => {
            tsic.publishMessage('UI.Cmd.Pause.Resume', {});
        });
    });
})();
</script>
</body></html>
