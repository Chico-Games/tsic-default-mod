<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 18px 22px;
    background:
      radial-gradient(circle at 25% 25%, #ff5e7d 0%, transparent 45%),
      radial-gradient(circle at 75% 75%, #2afdef 0%, transparent 45%),
      linear-gradient(135deg, #1a1a3e 0%, #0d0d22 100%);
    color: #fff;
    box-sizing: border-box;
    height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  .tag { position: fixed; right: 10px; top: 8px; font-family: monospace; font-size: 10px; font-weight: 800; letter-spacing: 2px; padding: 4px 10px; border-radius: 4px; background: #ff00aa; color: #000; }
  .anime-box {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #ff5e7d, #2afdef);
    display: inline-block;
    margin: 4px;
    border-radius: 6px;
  }
  .counter {
    font-size: 36px; font-weight: 900;
    color: #2afdef;
    text-shadow: 0 0 12px #2afdef;
    font-family: monospace;
    margin: 10px 0 6px;
  }
  .anime-btn {
    display: inline-block;
    padding: 8px 18px;
    background: linear-gradient(135deg, #ff5e7d, #b53cff);
    color: #fff; border: none; border-radius: 6px;
    font-weight: 700; cursor: pointer;
    font-size: 12px; letter-spacing: 2px;
  }
</style></head><body>
  <div class="tag">4 anime.js</div>
  <h2 style="color:#2afdef; margin: 6px 0; font-size: 22px;">anime.js</h2>
  <p style="font-size: 12px; opacity: 0.85; margin: 0 0 8px;">JS keyframe animation</p>
  <div id="boxes">
    <div class="anime-box"></div><div class="anime-box"></div>
    <div class="anime-box"></div><div class="anime-box"></div>
    <div class="anime-box"></div><div class="anime-box"></div>
    <div class="anime-box"></div><div class="anime-box"></div>
  </div>
  <div class="counter" id="counter">0</div>
  <button class="anime-btn" onclick="bounce()">PULSE</button>
  <div id="status" style="font-size: 11px; margin-top: 6px; opacity: 0.85;"></div>

<script src="libs/anime.min.js"></script>
<script>
  const statusEl = document.getElementById('status');
  function start() {
    if (typeof anime === 'undefined') { statusEl.textContent = 'anime.js failed'; statusEl.style.color = '#ff5e5e'; return; }
    statusEl.textContent = 'anime.js v' + (anime.version || '3') + ' running';
    statusEl.style.color = '#2afdef';
    anime({
      targets: '#boxes .anime-box',
      translateY: [{ value: -22, duration: 400 }, { value: 0, duration: 600, easing: 'easeOutBounce' }],
      scale:      [{ value: 1.3, duration: 400 }, { value: 1, duration: 600 }],
      rotate: '+=180',
      delay: anime.stagger(80),
      loop: true,
      direction: 'alternate'
    });
    anime({
      targets: '#counter',
      innerHTML: [0, 1000],
      easing: 'linear', round: 1, duration: 4000, loop: true
    });
  }
  function bounce() {
    if (typeof anime === 'undefined') return;
    anime({ targets: '#boxes .anime-box', scale: [{ value: 1.8, duration: 200 }, { value: 1, duration: 400 }], delay: anime.stagger(50) });
  }
  if (typeof anime !== 'undefined') start();
  else window.addEventListener('load', start);
</script>
</body></html>
